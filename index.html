  /* ---------------- CSV IMPORT ---------------- */
  handleFiles(fileList, mode){
    const files = Array.from(fileList);
    if(!files.length) return;
    let remaining = files.length;
    const allRows = [];
    files.forEach(file=>{
      Papa.parse(file, {
        header:true,
        skipEmptyLines:true,
        complete: (res)=>{
          allRows.push(...res.data);
          remaining--;
          if(remaining===0) this.finishImport(allRows, files.map(f=>f.name), mode);
        },
        error: ()=>{
          remaining--;
          if(remaining===0) this.finishImport(allRows, files.map(f=>f.name), mode);
        }
      });
    });
  },

  txKey(t){
    // chiave univoca per riconoscere lo stesso movimento tra import diversi
    const catKey = t.category ? `${t.category.code}|${t.category.name}` : '—';
    return [t.date.toISOString(), t.wallet, t.type, catKey, t.amount.toFixed(2), t.note].join('::');
  },

  finishImport(rows, fileNames, mode){
    const parsed = [];
    rows.forEach(row=>{
      if(!row || !row.Date || !row.Wallet) return;
      const rawDate = String(row.Date).trim(); const d = new Date(rawDate); const dm = /^(\d{4})-(\d{2})-(\d{2})/.exec(rawDate); const dateStr = dm ? dm[0] : (isNaN(d.getTime()) ? '' : localYmd(d));
      if(isNaN(d.getTime())) return;
      const amount = parseFloat(row.Amount);
      if(isNaN(amount)) return;
      const labelsRaw = (row.Labels||'').trim();
      const labels = labelsRaw ? labelsRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
      parsed.push({
        date: d,
        dateStr,
        ym: dateStr.slice(0,7),
        wallet: (row.Wallet||'').trim(),
        type: (row.Type||'').trim(),
        category: parseCategory(row['Category name']),
        amount: amount,
        note: (row.Note||'').trim(),
        labels: labels
      });
    });
    if(!parsed.length){
      this.showToast('Nessuna transazione valida trovata nei file caricati.');
      return;
    }

    let addedCount, skippedCount;
    if(mode === 'replace'){
      const keptManual = this.transactions.filter(t=>t.manual); // i movimenti manuali non fanno parte del CSV: li preservo sempre
      this.transactions = [...parsed, ...keptManual];
      addedCount = parsed.length;
      skippedCount = 0;
    } else {
      const map = new Map();
      this.transactions.forEach(t => map.set(this.txKey(t), t));
      addedCount = 0; skippedCount = 0;
      parsed.forEach(t=>{
        const k = this.txKey(t);
        if(map.has(k)){ skippedCount++; }
        else { map.set(k, t); addedCount++; }
      });
      this.transactions = Array.from(map.values());
    }

    this.transactions.sort((a,b)=> a.date-b.date);
    this.wallets = Array.from(new Set(this.transactions.filter(t=>!t.manual).map(t=>t.wallet))).sort();
    this.wallets.forEach(w=>{
      if(!(w in this.openingBalances)) this.openingBalances[w] = 0;
      if(!(w in this.operational)) this.operational[w] = this.guessOperational(w);
    });
    this.ensureScalableWallet();
    const matchedPlanned = this.reconcilePlannedPayments();
    const nProp = this.pendingProposals().length;
    const scalableNote = (nProp ? ` ${nProp} ${nProp===1?'abbinamento':'abbinamenti'} di pagamenti previsti da confermare.` : '');
    this.lastCsvImport = { at: new Date().toISOString(), files: fileNames, mode, added: addedCount, skipped: skippedCount };
    this.saveData();
    this.renderSidebar();
    this.navigate('home');
    if(mode === 'replace'){
      const keptManual = this.transactions.filter(t=>t.manual).length;
      this.showToast(`Dati sostituiti: ${addedCount} movimenti caricati da ${fileNames.length} file.${keptManual?` ${keptManual} movimenti manuali mantenuti.`:''}${matchedPlanned?` ${matchedPlanned} pagamenti previsti segnati come pagati.`:''}${scalableNote}`);
    } else {
      this.showToast(`Aggiunti ${addedCount} nuovi movimenti${skippedCount ? ` (${skippedCount} già presenti, ignorati)` : ''}.${matchedPlanned?` ${matchedPlanned} pagamenti previsti segnati come pagati.`:''}${scalableNote}`);
    }
  },

  /* ---------------- COMPUTATIONS ---------------- */
  /* ---------------- WALLET OPERATIVI vs RISPARMIO ---------------- */
  guessOperational(wallet){
    const norm = wallet.toUpperCase();
    const keywords = ['BBVA','REVOLUT','CONTANTI','BUON'];
    return keywords.some(k=> norm.includes(k));
  },
  isOperational(wallet){
    return this.operational[wallet] !== false;
  },
  setOperational(wallet, checked){
    this.operational[wallet] = checked;
    this.saveData();
    this.renderImport();
    this.showToast('Preferenza portafoglio aggiornata.');
  },
  isIncludedInTotal(wallet){
    return this.totalIncludedWallets[wallet] !== false;
  },
  setTotalIncluded(wallet, checked){
    this.totalIncludedWallets[wallet] = checked;
    this.saveData();
    this.render();
  },
  setTotalIncludedOperational(checked){
    // i portafogli operativi si abilitano/disabilitano tutti insieme, come un unico gruppo
    this.wallets.filter(w=>this.isOperational(w)).forEach(w=> this.totalIncludedWallets[w] = checked);
    this.saveData();
    this.render();
  },
  isInvestmentWallet(wallet){
    // portafogli di investimento (es. Scalable, Fondapi): mostrati in una sezione separata da quelli liquidi
    const name = displayWalletName(wallet).toUpperCase();
    return ['SCALABLE','FONDAPI'].some(k => name.includes(k));
  },
  investedWalletStats(wallet){
    // Investito netto = trasferimenti in entrata/uscita (+ per Fondapi anche le entrate con categoria TFR, che li' non sempre passano come transfer)
    // Interessi generati = somma netta (entrate - uscite) della categoria "Interessi", meno le uscite con categoria "Tasse", su tutto lo storico del portafoglio, esclusi dall'investito
    const isFondapi = displayWalletName(wallet).toUpperCase().includes('FONDAPI');
    const txs = this.transactions.filter(t=>t.wallet===wallet);
    const transferNet = txs.filter(t=> t.type==='Incoming Transfer' || t.type==='Outgoing Transfer').reduce((s,t)=>s+t.amount,0);
    const tfrNet = isFondapi ? txs.filter(t=> t.type==='Income' && t.category && t.category.name.trim().toUpperCase()==='TFR').reduce((s,t)=>s+t.amount,0) : 0;
    const invested = transferNet + tfrNet;
    const interestGross = txs.filter(t=> t.category && t.category.name.trim().toUpperCase()==='INTERESSI' && (t.type==='Income'||t.type==='Expense')).reduce((s,t)=>s+t.amount,0);
    const taxesNet = txs.filter(t=> t.category && t.category.name.trim().toUpperCase()==='TASSE' && (t.type==='Income'||t.type==='Expense')).reduce((s,t)=>s+t.amount,0);
    const interest = interestGross + taxesNet; // le tasse sono uscite (importo negativo): sommarle equivale a sottrarle
    return { invested, interest, taxes: taxesNet };
  },

  orderedWallets(){
    // ordina i portafogli secondo WALLET_ORDER (per parola chiave contenuta nel nome, senza emoji);
    // quelli non riconosciuti restano in fondo, in ordine alfabetico
    const priority = (w) => {
      const name = displayWalletName(w).toUpperCase();
      const idx = this.WALLET_ORDER.findIndex(k => name.includes(k));
      return idx === -1 ? this.WALLET_ORDER.length : idx;
    };
    return [...this.wallets].sort((a,b)=>{
      const pa = priority(a), pb = priority(b);
      if(pa !== pb) return pa - pb;
      return a.localeCompare(b);
    });
  },

  /* ---- Scalable: saldo e storico dal backup investimenti (pagina Investimenti), non dall'import Spendee ---- */
  useInvFor(w){ return !!(this.inv && Array.isArray(this.inv.positions) && this.inv.positions.length && this.isScalableWallet(w)); },
  invTotal(){ return this.inv.positions.reduce((s,p)=>s+(Number(p.value)||0),0); },
  invFlows(){ const f = this.inv && Array.isArray(this.inv.flows) ? this.inv.flows.filter(x=>x && x.d && Number.isFinite(x.a)) : []; return f.length ? f : null; },
  invValueAt(date){
    const I = this.inv, tot = this.invTotal(), x = date.getTime();
    const pts = (I.series||[]).filter(p=>p.d && Number.isFinite(p.val)).map(p=>({ t:new Date(p.d+'T00:00:00Z').getTime(), v:p.val }));
    if(!pts.length) return tot;
    const asOf = I.asOf ? new Date(I.asOf+'T00:00:00Z').getTime() : Infinity;
    if(x>=asOf || x>=pts[pts.length-1].t) return tot;
    if(x<pts[0].t) return 0;
    for(let i=1;i<pts.length;i++){ if(x<=pts[i].t){ const a = pts[i-1], b = pts[i]; return a.v + (b.v-a.v)*(x-a.t)/(b.t-a.t); } }
    return tot;
  },
  invSummary(){
    const I = this.inv, P = I.positions, tot = this.invTotal(), cost = P.reduce((s,p)=>s+(Number(p.cost)||0),0), fl = this.invFlows(), ser = I.series||[];
    const tInv = fl ? fl.reduce((x,f)=>x+f.a,0) : (ser.length && Number.isFinite(ser[ser.length-1].inv) ? ser[ser.length-1].inv : cost);
    const mx = (I.periods && I.periods.MAX) || null, gm = (k)=> (mx && mx[k]) ? mx[k].v : 0;
    const costs = mx ? gm('commissioni')+gm('spread')+gm('ter')+gm('bollo') : P.reduce((x,p)=>x+(p.fees||0)+(p.spreadPaid||0)+p.value*(this.terOf(p)||0)/100,0)+(I.extraFees||0)+tot*0.002;
    return { tot, cost, tInv, gp: tot-cost, costs };
  },
  invMonthStats(ym){
    // Scalable nel mese: versamenti netti (flows), variazione di valore al netto dei versamenti (mercato) e totale = valore fine mese - valore fine mese precedente
    const I = this.inv; if(!I) return null;
    const ser = (I.series||[]).filter(p=>p.d && Number.isFinite(p.val)), fl = this.invFlows()||[], asOfYm = (I.asOf||'').slice(0,7);
    const firstYm = [ser.length ? ser[0].d.slice(0,7) : null, fl.length ? fl.map(f=>f.d).sort()[0].slice(0,7) : null].filter(Boolean).sort()[0];
    if(!firstYm || !asOfYm || ym<firstYm || ym>asOfYm) return null;
    const endVal = (m)=>{ if(asOfYm<=m) return this.invTotal(); let v = 0; ser.forEach(p=>{ if(p.d<=m+'-31') v = p.val; }); return v; };
    const inv = this.investedIn(ym), tot = endVal(ym) - endVal(addMonthsToYm(ym,-1));
    return { inv, market: tot-inv, tot };
  },
  ensureScalableWallet(){
    // il portafoglio Scalable deve esistere anche senza movimenti Spendee: se c'e' il backup investimenti lo creo (non operativo)
    if(!(this.inv && Array.isArray(this.inv.positions) && this.inv.positions.length)) return;
    if(this.wallets.some(w=>this.isScalableWallet(w))) return;
    const n = 'SCALABLE CAPITAL';
    this.wallets.push(n); this.wallets.sort();
    if(!(n in this.openingBalances)) this.openingBalances[n] = 0;
    this.operational[n] = false;
  },
  walletBalance(wallet){
    if(this.useInvFor(wallet)) return this.invTotal();
    const open = this.openingBalances[wallet] || 0;
    const sum = this.idx().walletSum.get(wallet) || 0;
    return open + sum;
  },

  totalPatrimonio(){
    return this.wallets.filter(w=>this.isIncludedInTotal(w)).reduce((s,w)=> s + this.walletBalance(w), 0);
  },

  periodCutoffDate(key){
    // data di riferimento per il confronto "prima" del periodo scelto; null per 'all' (si usa il saldo di apertura, non una data)
    const now = this.transactions.length ? this.transactions[this.transactions.length-1].date : new Date();
    if(key==='all') return null;
    if(key==='90d'){ const d = new Date(now); d.setDate(d.getDate()-90); return d; }
    if(key==='ytd') return new Date(Date.UTC(now.getFullYear(),0,1,23,59,59,999)); // fine del 1 gennaio: include i movimenti datati 1 gennaio (es. i saldi di partenza inseriti nel CSV)
    const d = new Date(now); d.setDate(d.getDate()-30); return d;
  },
  periodShortLabel(key){
    return { '30d':'30gg', '90d':'90gg', 'ytd':'da inizio anno', 'all':'da sempre' }[key] || '30gg';
  },
  walletBalanceBeforePeriod(wallet, key){
    const cutoff = this.periodCutoffDate(key);
    return cutoff===null ? (this.useInvFor(wallet) ? 0 : (this.openingBalances[wallet]||0)) : this.walletBalanceAt(wallet, cutoff);
  },
  totalPeriodDelta(key){
    // confronta il Patrimonio totale attuale con quello a inizio periodo; 'all' usa i saldi di apertura (inizio di tutto lo storico)
    const total = this.totalPatrimonio();
    const included = this.wallets.filter(w=>this.isIncludedInTotal(w));
    const base = included.reduce((s,w)=> s + this.walletBalanceBeforePeriod(w, key), 0);
    const delta = total - base;
    // con base vicina a zero (saldi di apertura non impostati, o storico troppo corto) la % non ha senso: null invece di un fuorviante 0%
    const pct = Math.abs(base) >= 0.005 ? (delta/Math.abs(base))*100 : null;
    return { total, base, delta, pct };
  },
  setTotalPeriod(value){
    this.totalPeriod = value;
    this.render();
  },
  walletBalanceAt(wallet, cutoffDate){
    if(this.useInvFor(wallet)) return this.invValueAt(cutoffDate);
    const open = this.openingBalances[wallet] || 0;
    const sum = (this.idx().byWallet.get(wallet)||[]).filter(t=>t.date<=cutoffDate).reduce((s,t)=>s+t.amount,0);
    return open + sum;
  },

  /* ---------------- OBIETTIVI DI RISPARMIO (Portafoglio Operativo virtuale + Fondo Emergenza) ---------------- */
  findWalletByKeyword(keyword){
    return this.wallets.find(w => displayWalletName(w).toUpperCase().includes(keyword));
  },
  operationalWalletTotal(){
    return this.wallets.filter(w=>this.isOperational(w)).reduce((s,w)=> s + this.walletBalance(w), 0);
  },
  operationalWalletTotalBeforePeriod(key){
    return this.wallets.filter(w=>this.isOperational(w)).reduce((s,w)=> s + this.walletBalanceBeforePeriod(w, key), 0);
  },
  operationalWalletTotalAt(cutoffDate){
    return this.wallets.filter(w=>this.isOperational(w)).reduce((s,w)=> s + this.walletBalanceAt(w, cutoffDate), 0);
  },
  rollingMonths(windowSize){
    // ultimi N mesi (calendario) fino a quello in corso incluso, solo quelli con movimenti nei portafogli OPERATIVI
    // (un mese con soli movimenti in un portafoglio di risparmio, es. il Fondo Emergenza, non deve diluire la media)
    const nowYm = todayYm();
    const startYm = addMonthsToYm(nowYm, -(windowSize-1));
    const opMonths = new Set(this.transactions.filter(t=>this.isOperational(t.wallet)).map(t=>t.ym));
    return Array.from(opMonths).filter(ym => ym>=startYm && ym<=nowYm).sort();
  },
  rollingAvgExpense(windowSize){
    const months = this.avgMonths(windowSize, true); // solo mesi completati (come riepilogo annuo): il mese in corso e' parziale
    if(!months.length) return { avg:0, hasData:false, monthsUsed:0 };
    const total = months.reduce((s,ym)=> s + this.monthSummary(ym).totalExpense, 0);
    return { avg: total/months.length, hasData:true, monthsUsed: months.length };
  },
  rollingAvgExpenseByLabel(windowSize, label){
    const months = this.avgMonths(windowSize, true); // solo mesi completati
    if(!months.length) return { avg:0, hasData:false, monthsUsed:0 };
    let total = 0;
    months.forEach(ym=>{
      const txs = this.monthTx(ym).filter(t=> this.isOperational(t.wallet) && t.type==='Expense');
      const entry = this.labelTotals(txs).find(l=>l.label===label);
      if(entry) total += entry.total;
    });
    return { avg: total/months.length, hasData:true, monthsUsed: months.length };
  },
  setTargetMonths(key, value){
    const n = Math.max(0, this.parseNum(value));
    this[key] = n;
    this.saveData();
    this.render();
  },

  /* ---------------- STIMA LIQUIDITA' 12 MESI (netta, con impegni previsti) ---------------- */
  avgMonths(windowSize, completedOnly){
    // mesi su cui calcolare le medie; con completedOnly il mese in corso (ancora parziale) e' escluso
    if(!completedOnly) return this.rollingMonths(windowSize);
    const nowYm = todayYm();
    return this.rollingMonths(windowSize+1).filter(ym=> ym<nowYm);
  },
  rollingAvgIncome(windowSize, completedOnly){
    const months = this.avgMonths(windowSize, completedOnly);
    if(!months.length) return { avg:0, hasData:false, monthsUsed:0 };
    const total = months.reduce((s,ym)=> s + this.monthSummary(ym).totalIncome, 0);
    return { avg: total/months.length, hasData:true, monthsUsed: months.length };
  },
  recurringSeries(){
    // una voce per serie ricorrente attiva: categoria, importo attuale, frequenza e (per le annuali) mese di scadenza
    const bySeries = new Map();
    Object.keys(this.plannedPayments).sort().forEach(ym=>{
      (this.plannedPayments[ym]||[]).forEach(p=>{
        if(!p.recurrence || !p.category || !p.seriesId) return;
        bySeries.set(p.seriesId, { cat:p.category.trim().toLowerCase(), amount:Math.abs(p.amount)||0, recurrence:p.recurrence, month:ym.split('-')[1] }); // l'ultima occorrenza vince: ha l'importo piu' recente
      });
    });
    return Array.from(bySeries.values());
  },
  variableExpenseOfMonth(ym, series){
    // spesa "libera" di un mese: per ogni categoria si toglie SOLO la quota coperta da un pagamento ricorrente previsto
    // (importo della serie, al massimo quanto speso davvero); l'eccedenza resta
    const mm = ym.split('-')[1];
    const spendByCat = new Map();
    this.monthTx(ym).filter(t=> this.isOperational(t.wallet) && t.type==='Expense').forEach(t=>{
      const c = (t.category ? t.category.name : '').trim().toLowerCase();
      spendByCat.set(c, (spendByCat.get(c)||0) + Math.abs(t.amount));
    });
    const fixedByCat = new Map();
    series.forEach(sr=>{
      if(sr.recurrence==='yearly' && sr.month!==mm) return;
      fixedByCat.set(sr.cat, (fixedByCat.get(sr.cat)||0) + sr.amount);
    });
    let total = 0;
    spendByCat.forEach((spent, c)=>{ total += spent - Math.min(spent, fixedByCat.get(c)||0); });
    return total;
  },
  rollingAvgVariableExpense(windowSize, completedOnly){
    const months = this.avgMonths(windowSize, completedOnly);
    if(!months.length) return { avg:0, hasData:false, monthsUsed:0 };
    const series = this.recurringSeries();
    const total = months.reduce((s,ym)=> s + this.variableExpenseOfMonth(ym, series), 0);
    return { avg: total/months.length, hasData:true, monthsUsed: months.length };
  },
  liquidityForecast(){
    const WINDOW = 12; // mesi di storico usati per le medie mobili
    const HORIZON = 12; // mesi futuri da proiettare
    const varExp = this.rollingAvgVariableExpense(WINDOW, true); // solo mesi completati: il mese in corso e' parziale e falserebbe la media
    const avgInc = this.rollingAvgIncome(WINDOW, true);
    const hasData = varExp.hasData && avgInc.hasData;
    const netBaseline = varExp.avg - avgInc.avg; // fabbisogno "di fondo" mensile, prima degli impegni fissi del mese
    const opStart = this.operationalWalletTotal();
    const fondoWallet = this.findWalletByKeyword('FONDO EMERGENZA');
    const fondoStart = fondoWallet ? this.walletBalance(fondoWallet) : 0;
    const combinedStart = opStart + fondoStart;
    if(!hasData){
      return { hasData:false, monthsUsed: Math.min(varExp.monthsUsed, avgInc.monthsUsed), varExp, avgInc, netBaseline, opStart, fondoStart, combinedStart, rows:[], total12:0, projectedOp:opStart, projectedCombined:combinedStart };
    }
    const nowYm = todayYm();
    // mese in corso: quanto gia' speso/incassato e' nel saldo attuale, quindi conta solo il residuo rispetto alla media
    // (se hai gia' speso piu' della media il residuo di spesa e' 0; se hai gia' incassato piu' della media il residuo di entrata e' 0)
    const spentNow = this.variableExpenseOfMonth(nowYm, this.recurringSeries());
    const incomeNow = this.monthSummary(nowYm).totalIncome;
    const baseNow = Math.max(0, varExp.avg - spentNow) - Math.max(0, avgInc.avg - incomeNow);
    let runOp = opStart, runCombined = combinedStart, cur = nowYm, total12 = 0;
    const pac = Math.max(0, this.investAmount||0); // PAC mensile = campo INVESTI € della pagina Investimenti
    const flN = this.invFlows(); const pacDone = flN ? flN.filter(f=>f.a>0 && f.d.slice(0,7)===nowYm).reduce((x,f)=>x+f.a,0) : this.transactions.filter(t=>t.ym===nowYm && this.isScalableWallet(t.wallet) && t.type==='Incoming Transfer').reduce((x,t)=>x+t.amount,0);
    const pacNow = Math.max(0, pac - pacDone); // nel mese in corso conta solo la parte non ancora versata
    const rows = [];
    for(let i=0;i<HORIZON;i++){
      const planned = this.monthPlannedTotal(cur); // impegni fissi non pagati previsti per questo mese specifico
      const pacM = i===0 ? pacNow : pac;
      const need = (i===0 ? baseNow : netBaseline) + planned + pacM;
      runOp -= need; runCombined -= need; total12 += need;
      rows.push({ ym:cur, planned, pac:pacM, need, runOp, runCombined, partial: i===0 });
      cur = addMonthsToYm(cur,1);
    }
    return { hasData:true, monthsUsed: Math.min(varExp.monthsUsed, avgInc.monthsUsed), varExp, avgInc, netBaseline, opStart, fondoStart, combinedStart, rows, total12, projectedOp: runOp, projectedCombined: runCombined };
  },
  mountLiquidityChart(){
    const lf = this.liquidityForecast();
    if(!lf.hasData || !lf.rows.length) return;
    this.mountChart('liquidity', 'chart-liquidity', {
      type:'line',
      data:{
        labels: lf.rows.map(r=>this.monthLabelShort(r.ym)),
        datasets:[
          { label:'Operativo', data: lf.rows.map(r=>r.runOp), borderColor:'#963C31', backgroundColor:'rgba(150,60,49,0.08)', fill:false, tension:0.2, pointRadius:2, borderWidth:2.5 },
          { label:'Operativo + Fondo Emergenza', data: lf.rows.map(r=>r.runCombined), borderColor:'#5F7A67', backgroundColor:'rgba(95,122,103,0.1)', fill:true, tension:0.2, pointRadius:2, borderWidth:2.5 },
          { label:'Soglia zero', data: new Array(lf.rows.length).fill(0), borderColor:'#4A443A', borderDash:[5,4], borderWidth:1.25, pointRadius:0, fill:false }
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{ position:'top', labels:{ color:'#4A443A', font:{family:'Inter',size:11.5}, boxWidth:12 } },
          tooltip:{ callbacks:{ label:(c)=> `${c.dataset.label}: ${fmtEUR.format(c.parsed.y)}` } }
        },
        scales:{
          x:{ ticks:{ color:'#4A443A', font:{family:'IBM Plex Mono',size:11} }, grid:{ display:false } },
          y:{ ticks:{ color:'#4A443A', font:{family:'IBM Plex Mono',size:11}, callback:(v)=>fmtEUR0.format(v) }, grid:{ color:'rgba(33,29,22,0.08)' } }
        }
      }
    });
  },

  patrimonioSeries(){
    // punto per ogni giorno con movimenti: totale patrimonio a fine giornata (valore cumulato)
    if(!this.transactions.length) return [];
    const inc = new Set(this.wallets.filter(w=>this.isIncludedInTotal(w)));
    const invW = this.wallets.find(w=>this.useInvFor(w)), invInc = !!invW && inc.has(invW);
    let total = 0; inc.forEach(w=>{ if(w!==invW) total += this.openingBalances[w]||0; });
    const sorted = [...this.transactions].sort((a,b)=>a.date-b.date), days = new Set(sorted.map(t=>t.dateStr));
    if(invInc){ (this.inv.series||[]).forEach(p=>{ if(p.d) days.add(p.d); }); if(this.inv.asOf) days.add(this.inv.asOf); }
    let i = 0; const out = [];
    Array.from(days).sort().forEach(d=>{
      while(i<sorted.length && sorted[i].dateStr<=d){ const t = sorted[i++]; if(inc.has(t.wallet) && t.wallet!==invW) total += t.amount; }
      out.push({ dateStr:d, total: total + (invInc ? this.invValueAt(new Date(d+'T00:00:00Z')) : 0) });
    });
    return out;
  },
  patrimonioSeriesForPeriod(key){
    const full = this.patrimonioSeries();
    if(key==='all' || !full.length) return full;
    const cutoff = this.periodCutoffDate(key);
    if(!cutoff) return full;
    const cutoffStr = cutoff.toISOString().slice(0,10);
    const filtered = full.filter(p=> p.dateStr >= cutoffStr);
    // ancoro il primo punto al saldo di inizio periodo (lo stesso usato per la % nella card Patrimonio totale),
    // cosi' il grafico parte dallo stesso riferimento anche se quel giorno non ha movimenti propri
    if(!filtered.length || filtered[0].dateStr !== cutoffStr){
      filtered.unshift({ dateStr: cutoffStr, total: this.totalPeriodDelta(key).base });
    }
    return filtered;
  },

  getMonths(){
    const set = this.idx().byYm.keys();
    return Array.from(set).sort().reverse();
  },

  allMonths(){
    // lista continua e cronologica (ascendente) di mesi: dal primo mese con dati (o oggi) fino ad almeno 12 mesi nel futuro, senza buchi
    const nowYm = todayYm();
    const dataMonths = this.getMonths();
    let minYm = dataMonths.length ? dataMonths[dataMonths.length-1] : nowYm;
    let maxYm = dataMonths.length ? dataMonths[0] : nowYm;
    if(minYm > nowYm) minYm = nowYm;
    const horizon = addMonthsToYm(nowYm, 12);
    if(horizon > maxYm) maxYm = horizon;
    const out = [];
    let cur = minYm, guard = 0;
    while(cur <= maxYm && guard < 400){ out.push(cur); cur = addMonthsToYm(cur,1); guard++; }
    return out; // ascendente
  },

  monthHasActivity(ym){ return this.monthTx(ym).length > 0; },
  monthPlanned(ym){ return this.plannedPayments[ym] || []; },
  monthPlannedTotal(ym){ return this.monthPlanned(ym).filter(p=>!p.paid).reduce((s,p)=>s+p.amount,0); },
  monthPlannedPaidTotal(ym){ return this.monthPlanned(ym).filter(p=>p.paid).reduce((s,p)=>s+p.amount,0); },

  addPlanned(ym){
    if(!this.plannedPayments[ym]) this.plannedPayments[ym] = [];
    this.plannedPayments[ym].push({ id: uid(), seriesId:null, recurrence:null, name:'Nuovo pagamento', category:'', amount:0, paid:false, paidDate:null, approx:false });
    this.saveData();
    this.render();
  },
  updatePlanned(ym, id, field, value){
    const item = (this.plannedPayments[ym]||[]).find(p=>p.id===id);
    if(!item) return;
    item[field] = field==='amount' ? this.parseNum(value) : value;
    if(field!=='paid'){ item.paid = false; item.paidDate = null; item.paidKey = null; item.paidAmount = null; item.proposal = null; } // un valore modificato a mano non è più un match automatico verificato
    if(item.recurrence && (field==='name' || field==='category' || field==='amount')){
      this.generateForward(item, ym); // propaga la modifica alle occorrenze future già generate
    }
    this.saveData();
    this.render();
  },
  togglePlannedPaid(ym, id, checked){
    const item = (this.plannedPayments[ym]||[]).find(p=>p.id===id);
    if(!item) return;
    item.paid = checked;
    if(!checked) item.paidDate = null;
    item.paidKey = null; item.paidAmount = null; item.proposal = null; // spunta manuale: nessun movimento associato
    this.saveData();
    this.render();
  },
  removePlanned(ym, id){
    const item = (this.plannedPayments[ym]||[]).find(p=>p.id===id);
    if(item && item.recurrence && item.seriesId){ this.askRecurringRemove(ym, item); return; } // la scelta si chiede solo per i pagamenti Mensile/Annuale
    this.plannedPayments[ym] = (this.plannedPayments[ym]||[]).filter(p=>p.id!==id);
    this.saveData();
    this.render();
  },
  isSeriesSkipped(sid, ym){
    const sk = this.plannedSkips[sid];
    return !!sk && ((sk.from && ym>=sk.from) || (sk.months||[]).includes(ym));
  },
  askRecurringRemove(ym, item){
    const old = document.getElementById('confirm-modal'); if(old) old.remove();
    const ov = document.createElement('div');
    ov.className = 'modal-overlay'; ov.id = 'confirm-modal';
    ov.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h3 class="modal-title" id="confirm-title">Rimuovere un pagamento ricorrente</h3>
      <p class="modal-msg">«${this.esc(item.name)}» è ${item.recurrence==='yearly'?'annuale':'mensile'}. Vuoi rimuovere solo ${this.esc(this.monthLabel(ym))} oppure anche tutte le occorrenze successive non ancora pagate?</p>
      <div class="modal-actions">
        <button class="btn ghost small" data-act="no">Annulla</button>
        <button class="btn ghost small" data-act="one">Solo questo mese</button>
        <button class="btn small" data-act="all">Questo e successivi</button>
      </div></div>`;
    const close = ()=>{ ov.remove(); document.removeEventListener('keydown', onKey, true); };
    const onKey = (e)=>{ if(e.key==='Escape') close(); };
    ov.addEventListener('click', (e)=>{
      if(e.target===ov){ close(); return; }
      const b = e.target.closest('button[data-act]'); if(!b) return;
      const act = b.dataset.act; close();
      if(act==='one' || act==='all') this.removeRecurring(ym, item.id, act);
    });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(ov);
    const btn = ov.querySelector('[data-act="one"]'); if(btn) btn.focus();
  },
  removeRecurring(ym, id, scope){
    const item = (this.plannedPayments[ym]||[]).find(p=>p.id===id); if(!item) return;
    const sid = item.seriesId, sk = this.plannedSkips[sid] || (this.plannedSkips[sid] = { months:[], from:null });
    if(scope==='one'){
      if(!sk.months.includes(ym)) sk.months.push(ym); // la ricorrenza non ricrea piu' questo mese
      this.plannedPayments[ym] = (this.plannedPayments[ym]||[]).filter(p=>p.id!==id);
    } else {
      if(!sk.from || ym<sk.from) sk.from = ym; // la serie si ferma da questo mese in poi
      Object.keys(this.plannedPayments).forEach(m=>{
        if(m<ym) return;
        this.plannedPayments[m] = (this.plannedPayments[m]||[]).filter(p=>{ if(p.id===id) return false; if(p.seriesId!==sid) return true; return p.paid; }); // i gia' pagati restano
      });
    }
    this.saveData();
    this.render();
  },

  /* ---------------- RICORRENZA PAGAMENTI PREVISTI ---------------- */
  toggleRecurrence(ym, id, newType){
    const item = (this.plannedPayments[ym]||[]).find(p=>p.id===id);
    if(!item) return;
    if(!item.seriesId) item.seriesId = uid();
    if(newType) delete this.plannedSkips[item.seriesId]; // riattivare la ricorrenza la fa ripartire da zero
    item.recurrence = newType; // 'monthly' | 'yearly' | null
    this.pruneFutureSeries(item.seriesId, ym, newType);
    if(newType) this.generateForward(item, ym);
    this.saveData();
    this.render();
  },
  pruneFutureSeries(seriesId, originYm, newType){
    // rimuove dai mesi futuri le occorrenze non pagate della serie che non rispettano più il criterio scelto
    Object.keys(this.plannedPayments).forEach(ym=>{
      if(ym<=originYm) return;
      this.plannedPayments[ym] = (this.plannedPayments[ym]||[]).filter(p=>{
        if(p.seriesId!==seriesId || p.paid) return true;
        if(!newType) return false;
        if(newType==='monthly') return true;
        const om = originYm.split('-')[1], tm = ym.split('-')[1];
        return tm===om;
      });
    });
  },
  generateForward(item, fromYm){
    // crea/aggiorna le occorrenze future della serie fino all'orizzonte visibile (allMonths)
    if(!item.recurrence) return;
    const om = fromYm.split('-')[1];
    this.allMonths().forEach(ym=>{
      if(ym<=fromYm) return;
      const include = item.recurrence==='monthly' ? true : (ym.split('-')[1]===om);
      if(!include) return;
      if(this.isSeriesSkipped(item.seriesId, ym)) return;
      if(!this.plannedPayments[ym]) this.plannedPayments[ym] = [];
      const existing = this.plannedPayments[ym].find(p=>p.seriesId===item.seriesId);
      if(existing){
        if(!existing.paid){ existing.name=item.name; existing.category=item.category; existing.amount=item.amount; existing.recurrence=item.recurrence; existing.approx=!!item.approx; }
      }else{
        this.plannedPayments[ym].push({ id:uid(), seriesId:item.seriesId, recurrence:item.recurrence, name:item.name, category:item.category, amount:item.amount, paid:false, paidDate:null, approx:!!item.approx });
      }
    });
  },
  syncAllRecurrences(){
    Object.keys(this.plannedPayments).forEach(ym=>{
      (this.plannedPayments[ym]||[]).forEach(item=>{
        if(item.recurrence) this.generateForward(item, ym);
      });
    });
  },

  knownCategories(){
    const set = new Set();
    this.transactions.forEach(t=>{ if(t.category && t.type==='Expense') set.add(t.category.name); });
    return Array.from(set).sort();
  },
  knownIncomeCategories(){
    const set = new Set();
    this.transactions.forEach(t=>{ if(t.category && t.type==='Income') set.add(t.category.name); });
    return Array.from(set).sort();
  },

  /* ---------------- MOVIMENTI MANUALI (recupero dati mancanti dal CSV) ---------------- */
  canAddManual(ym){
    // consentito solo nei mesi passati (non il mese in corso, non futuri) che hanno già dei movimenti importati
    return ym < todayYm() && this.monthHasActivity(ym);
  },
  monthManualTx(ym){
    return this.transactions.filter(t=>t.manual && t.ym===ym).sort((a,b)=>a.date-b.date);
  },
  addManualTransaction(ym){
    if(!this.canAddManual(ym)) return;
    const dateStr = `${ym}-01`;
    this.transactions.push({
      id: uid(), manual: true,
      date: new Date(dateStr+'T00:00:00.000Z'), dateStr, ym,
      wallet: null, type:'Expense', category: null, amount: 0, note:'', labels: []
    });
    this.transactions.sort((a,b)=>a.date-b.date);
    this.saveData();
    this.render();
  },
  updateManualCategory(id, value){
    const t = this.transactions.find(x=>x.id===id);
    if(!t) return;
    const name = value.trim();
    t.category = name ? { code:null, name, numbered:false } : null;
    this.saveData();
    this.render();
  },
  updateManualField(id, field, value){
    const t = this.transactions.find(x=>x.id===id);
    if(!t) return;
    if(field==='amount'){
      const abs = Math.abs(this.parseNum(value));
      t.amount = t.type==='Expense' ? -abs : abs;
    } else if(field==='type'){
      t.type = value;
      t.amount = value==='Expense' ? -Math.abs(t.amount) : Math.abs(t.amount);
    } else if(field==='note'){
      t.note = value;
    }
    this.saveData();
    this.render();
  },
  toggleManualLabel(id, label, checked){
    const t = this.transactions.find(x=>x.id===id);
    if(!t) return;
    if(checked){ if(!t.labels.includes(label)) t.labels.push(label); }
    else { t.labels = t.labels.filter(l=>l!==label); }
    this.saveData();
    this.render();
  },
  removeManualTransaction(id){
    this.transactions = this.transactions.filter(t=>t.id!==id);
    this.saveData();
    this.render();
  },

  setPlannedApprox(ym, id, checked){
    const item = (this.plannedPayments[ym]||[]).find(p=>p.id===id);
    if(!item) return;
    item.approx = checked;
    if(item.recurrence) this.generateForward(item, ym); // il flag vale per tutta la serie
    const n = this.reconcilePlannedPayments(); // riapplico subito: un movimento gia' importato puo' essere abbinato adesso
    this.saveData();
    this.render();
    if(n) this.showToast(`${n} ${n===1?'pagamento previsto segnato':'pagamenti previsti segnati'} come pagato.`);
  },
  setMatchParam(key, value){
    const v = Math.min(100, Math.max(0, parseFloat(String(value).replace(',','.')) || 0));
    this[key] = v;
    const n = this.reconcilePlannedPayments(); // riapplico subito con la nuova soglia
    this.saveData();
    this.renderImport();
    this.showToast(n ? `Soglia aggiornata: ${n} ${n===1?'pagamento previsto segnato':'pagamenti previsti segnati'} come pagato.` : 'Soglia aggiornata.');
  },
  pendingProposals(){
    const out = [];
    Object.keys(this.plannedPayments).sort().forEach(ym=>{
      (this.plannedPayments[ym]||[]).forEach(p=>{ if(!p.paid && p.proposal) out.push({ ym, item:p }); });
    });
    return out;
  },
  acceptProposal(ym, id, updateAmount){
    const p = (this.plannedPayments[ym]||[]).find(x=>x.id===id);
    if(!p || !p.proposal) return;
    const pr = p.proposal;
    p.paid = true; p.paidDate = pr.dateStr; p.paidKey = pr.key; p.paidAmount = pr.amount; p.proposal = null;
    if(updateAmount && p.recurrence){ p.amount = pr.amount; this.generateForward(p, ym); } // aggiorna l'importo anche nelle occorrenze future
    this.saveData();
    this.render();
  },
  dismissProposal(ym, id){
    const p = (this.plannedPayments[ym]||[]).find(x=>x.id===id);
    if(!p || !p.proposal) return;
    p.dismissed = [...(p.dismissed||[]), p.proposal.key]; // quel movimento non verra' piu' riproposto per questo pagamento
    p.proposal = null;
    this.saveData();
    this.render();
  },
  reconcilePlannedPayments(){
    // dopo un import: per ogni pagamento previsto non ancora pagato cerca un movimento reale della stessa categoria nello stesso mese.
    // 1) importo identico -> pagato in automatico (per tutti)
    // 2) flag "Circa" -> pagato in automatico se l'importo e' entro la tolleranza
    // 3) altrimenti, se c'e' un movimento della stessa categoria con importo diverso ma non lontano, lo propone (da confermare a mano)
    let matched = 0;
    const tol = this.PLANNED_APPROX_TOL_PCT/100, win = Math.max(this.PLANNED_PROPOSAL_WINDOW_PCT, this.PLANNED_APPROX_TOL_PCT)/100; // la soglia proposte non scende sotto la tolleranza
    Object.keys(this.plannedPayments).forEach(ym=>{
      const items = this.plannedPayments[ym];
      if(!items || !items.length) return;
      items.forEach(p=>{ if(!p.paid) p.proposal = null; }); // le proposte si ricalcolano da zero a ogni passaggio
      const reserved = new Set(items.filter(p=>p.paid && p.paidKey).map(p=>p.paidKey)); // movimenti gia' usati da un pagamento pagato
      const monthTxs = this.transactions
        .filter(t=> t.ym===ym && this.isOperational(t.wallet) && t.type==='Expense')
        .map(t=>({ t, key:this.txKey(t) }))
        .filter(x=> !reserved.has(x.key));
      const used = new Set();
      const catOf = (t)=> t.category ? t.category.name.trim().toLowerCase() : '';
      const markPaid = (p, i)=>{
        const { t, key } = monthTxs[i];
        used.add(i);
        p.paid = true; p.paidDate = t.dateStr; p.paidKey = key; p.paidAmount = Math.abs(t.amount); p.proposal = null;
        matched++;
      };
      const closest = (p)=>{
        const cat = p.category.trim().toLowerCase();
        let best = -1, bestDiff = Infinity;
        monthTxs.forEach((x,i)=>{
          if(used.has(i) || catOf(x.t)!==cat || (p.dismissed||[]).includes(x.key)) return;
          const d = Math.abs(Math.abs(x.t.amount) - Math.abs(p.amount));
          if(d < bestDiff){ best = i; bestDiff = d; }
        });
        return { i:best, diff:bestDiff };
      };
      const pending = items.filter(p=> !p.paid && p.category && p.amount);
      pending.forEach(p=>{ // 1) importo identico
        const c = closest(p);
        if(c.i>-1 && c.diff<0.01) markPaid(p, c.i);
      });
      pending.filter(p=>!p.paid && p.approx).forEach(p=>{ // 2) "Circa": tolleranza automatica
        const c = closest(p);
        if(c.i>-1 && c.diff <= Math.abs(p.amount)*tol) markPaid(p, c.i);
      });
      pending.filter(p=>!p.paid).forEach(p=>{ // 3) proposta da confermare
        const c = closest(p);
        if(c.i>-1 && c.diff <= Math.abs(p.amount)*win){
          const { t, key } = monthTxs[c.i];
          used.add(c.i);
          p.proposal = { amount:Math.abs(t.amount), dateStr:t.dateStr, key };
        }
      });
    });
    return matched;
  },

  futureCommitments(){
    const nowYm = todayYm();
    const entries = Object.keys(this.plannedPayments)
      .filter(ym => ym >= nowYm)
      .map(ym => ({ ym, total: this.monthPlannedTotal(ym) }))
      .filter(e => e.total > 0)
      .sort((a,b)=> a.ym.localeCompare(b.ym));
    const total = entries.reduce((s,e)=>s+e.total,0);
    return { total, entries };
  },

  yearSummary(year){

    const txs = this.transactions.filter(t=> t.ym.startsWith(prefix) && this.isOperational(t.wallet));
    const expenses = txs.filter(t=>t.type==='Expense');
    const incomes = txs.filter(t=>t.type==='Income');
    const totalExpense = expenses.reduce((s,t)=>s+Math.abs(t.amount),0);
    const totalIncome = incomes.reduce((s,t)=>s+t.amount,0);
    const expenseCatCount = new Set(expenses.map(t=> t.category?t.category.name:'—')).size;
    const incomeCatCount = new Set(incomes.map(t=> t.category?t.category.name:'—')).size;

  getYears(){
    const set = new Set(this.transactions.map(t=>t.ym.slice(0,4)));
    return Array.from(set).sort().reverse();
  },

  yearlyDetailedSummary(year){
    const prefix = String(year);
    const nowYm = todayYm();
    const isCurrent = String(year)===nowYm.slice(0,4);
    const currentMonthNum = parseInt(nowYm.slice(5,7),10);
    const monthsElapsed = isCurrent ? Math.max(0, currentMonthNum-1) : 12; // mesi completati: esclude il mese in corso, ancora parziale
    const txs = this.transactions.filter(t=> t.ym.startsWith(prefix) && this.isOperational(t.wallet));
    const completedTxs = isCurrent ? txs.filter(t=> t.ym < nowYm) : txs; // sottoinsieme usato solo per le medie
    const expenses = txs.filter(t=>t.type==='Expense');
    const incomes = txs.filter(t=>t.type==='Income');
    const completedExpenses = completedTxs.filter(t=>t.type==='Expense');
    const completedIncomes = completedTxs.filter(t=>t.type==='Income');
    const totalExpense = expenses.reduce((s,t)=>s+Math.abs(t.amount),0);
    const totalIncome = incomes.reduce((s,t)=>s+t.amount,0);
    const completedTotalExpense = completedExpenses.reduce((s,t)=>s+Math.abs(t.amount),0);
    const completedTotalIncome = completedIncomes.reduce((s,t)=>s+t.amount,0);

    // totali per nome-categoria (e per categoria+etichetta) calcolati solo sui mesi completati, usati solo per le medie
    const catTotalsByName = (list)=>{
      const map = new Map();
      list.forEach(t=>{
        const name = t.category ? t.category.name : 'Senza categoria';
        map.set(name, (map.get(name)||0) + Math.abs(t.amount));
      });
      return map;
    };
    const catLabelTotalsByName = (list)=>{
      const map = new Map();
      list.forEach(t=>{
        const catName = t.category ? t.category.name : 'Senza categoria';
        if(!t.labels.length){
          const key = catName+'::Senza etichetta';
          map.set(key, (map.get(key)||0) + Math.abs(t.amount));
          return;
        }
        t.labels.forEach(l=>{
          const key = catName+'::'+labelName(l);
          map.set(key, (map.get(key)||0) + Math.abs(t.amount));
        });
      });
      return map;
    };
    const completedExpenseCatTotals = catTotalsByName(completedExpenses);
    const completedIncomeCatTotals = catTotalsByName(completedIncomes);
    const completedExpenseCatLabelTotals = catLabelTotalsByName(completedExpenses);

    const byCat = (list, catAvgMap, catLabelAvgMap)=>{
      const map = new Map();
      list.forEach(t=>{
        const name = t.category ? t.category.name : 'Senza categoria';
        if(!map.has(name)) map.set(name, { name, total:0, txs:[] });
        const e = map.get(name);
        e.total += Math.abs(t.amount);
        e.txs.push(t);
      });
      return Array.from(map.values()).sort((a,b)=>b.total-a.total).map(c=>{
        const avgTotal = catAvgMap.get(c.name) || 0;
        return {
          name: c.name, total: c.total, avg: monthsElapsed ? avgTotal/monthsElapsed : 0,
          labels: this.labelTotals(c.txs).sort((a,b)=>b.total-a.total).map(l=>{
            const labelAvgTotal = catLabelAvgMap.get(c.name+'::'+l.label) || 0;
            return {
              label: l.label, total: l.total, avg: monthsElapsed ? labelAvgTotal/monthsElapsed : 0,
              pct: c.total ? (l.total/c.total*100) : 0
            };
          })
        };
      });
    };

    const completedLabelTotalsExpenseMap = new Map(this.labelTotals(completedExpenses).map(l=>[l.label,l.total]));
    const completedLabelTotalsIncomeMap = new Map(this.labelTotals(completedIncomes).map(l=>[l.label,l.total]));
    const labelTotalsExpense = this.labelTotals(expenses).sort((a,b)=>b.total-a.total).map(l=>({
      label:l.label, total:l.total, avg: monthsElapsed ? (completedLabelTotalsExpenseMap.get(l.label)||0)/monthsElapsed : 0
    }));
    const labelTotalsIncome = this.labelTotals(incomes).sort((a,b)=>b.total-a.total).map(l=>({
      label:l.label, total:l.total, avg: monthsElapsed ? (completedLabelTotalsIncomeMap.get(l.label)||0)/monthsElapsed : 0
    }));

    return {
      year, isCurrent, monthsElapsed,
      totalIncome, totalExpense,
      avgIncome: monthsElapsed ? completedTotalIncome/monthsElapsed : 0,
      avgExpense: monthsElapsed ? completedTotalExpense/monthsElapsed : 0,
      expenseCats: byCat(expenses, completedExpenseCatTotals, completedExpenseCatLabelTotals),
      incomeCats: byCat(incomes, completedIncomeCatTotals, new Map()),
      labelTotalsExpense, labelTotalsIncome,
      hasData: txs.length>0
    };
  },

  labelTotals(txs){
    // somma per etichetta su una lista di transazioni (presenza multi-etichetta: importo intero a ciascuna etichetta presente)
    const map = new Map();
    txs.forEach(t=>{
      if(!t.labels.length){
        map.set('Senza etichetta', (map.get('Senza etichetta')||0) + Math.abs(t.amount));
        return;
      }
      t.labels.forEach(l=>{
        const name = labelName(l);
        map.set(name, (map.get(name)||0) + Math.abs(t.amount));
      });
    });
    return Array.from(map.entries()).map(([label,total])=>({label,total}));
  },

  yearCategoryBreakdown(year, type){
    const prefix = String(year);
    const txs = this.transactions.filter(t=> t.ym.startsWith(prefix) && this.isOperational(t.wallet) && t.type===type);
    const map = new Map();
    txs.forEach(t=>{
      const name = t.category ? t.category.name : 'Senza categoria';
      map.set(name, (map.get(name)||0) + Math.abs(t.amount));
    });
    return Array.from(map.entries()).map(([name,total])=>({name,total})).sort((a,b)=> b.total-a.total);
  },

  yearLabelTxMap(year){
    // etichetta -> movimenti di uscita dell'anno che ne fanno parte (stessa logica di labelTotals: un movimento multi-etichetta compare in ciascuna)
    const map = new Map();
    this.transactions.filter(t=> t.ym.startsWith(String(year)) && this.isOperational(t.wallet) && t.type==='Expense').forEach(t=>{
      const names = t.labels.length ? t.labels.map(l=>labelName(l)) : ['Senza etichetta'];
      names.forEach(n=>{ if(!map.has(n)) map.set(n, []); map.get(n).push(t); });
    });
    return map;
  },
  yearLabelBreakdown(year, type){
    const prefix = String(year);
    const txs = this.transactions.filter(t=> t.ym.startsWith(prefix) && this.isOperational(t.wallet) && t.type===type);
    return this.labelTotals(txs).sort((a,b)=> b.total-a.total);
  },

  monthlyCategoryBreakdown(year){
    // matrice mese (1-12) x categoria di spesa, per il grafico a barre impilate del riepilogo annuo;
    // mostra sempre tutte le categorie reali che hanno movimenti (nessun raggruppamento in "Altro")
    const prefix = String(year);
    const txs = this.transactions.filter(t=> t.ym.startsWith(prefix) && this.isOperational(t.wallet) && t.type==='Expense');
    const totalsByCat = new Map();
    txs.forEach(t=>{
      const name = t.category ? t.category.name : 'Senza categoria';
      totalsByCat.set(name, (totalsByCat.get(name)||0) + Math.abs(t.amount));
    });
    const categories = Array.from(totalsByCat.entries()).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);

    const data = {};
    categories.forEach(c=> data[c] = new Array(12).fill(0));
    txs.forEach(t=>{
      const name = t.category ? t.category.name : 'Senza categoria';
      const monthIdx = parseInt(t.ym.split('-')[1],10)-1;
      data[name][monthIdx] += Math.abs(t.amount);
    });

    return { categories, data, hasData: txs.length>0 };
  },
  monthSummary(ym){
    const allTxs = this.monthTx(ym);
    const txs = allTxs.filter(t=> this.isOperational(t.wallet));
    const expenses = txs.filter(t=>t.type==='Expense');
    const incomes = txs.filter(t=>t.type==='Income');
    const transfersIn = txs.filter(t=>t.type==='Incoming Transfer');
    const transfersOut = txs.filter(t=>t.type==='Outgoing Transfer');
    const totalExpense = expenses.reduce((s,t)=>s+Math.abs(t.amount),0);
    const totalIncome = incomes.reduce((s,t)=>s+t.amount,0);
    const netFlow = allTxs.filter(t=>!t.manual).reduce((s,t)=>s+t.amount,0);
    const nonOpWallets = this.wallets.filter(w=>!this.isOperational(w));
    const nonOpFlow = allTxs.filter(t=>!this.isOperational(t.wallet)).reduce((s,t)=>s+t.amount,0);

    const byCat = (list)=>{
      const map = new Map();
      list.forEach(t=>{
        const key = t.category ? `${t.category.numbered?String(t.category.code).padStart(2,'0'):'—'}::${t.category.name}` : '::Senza categoria';
        if(!map.has(key)) map.set(key, { code:t.category?t.category.code:null, numbered:t.category?t.category.numbered:false, name:t.category?t.category.name:'Senza categoria', total:0, txs:[] });
        const entry = map.get(key);
        entry.total += Math.abs(t.amount);
        entry.txs.push(t);
      });
      return Array.from(map.values()).sort((a,b)=> b.total-a.total);
    };

    return {
      ym, totalExpense, totalIncome, netFlow, nonOpWallets, nonOpFlow,
      transferIn: transfersIn.reduce((s,t)=>s+t.amount,0),
      transferOut: transfersOut.reduce((s,t)=>s+Math.abs(t.amount),0),
      expenseCats: byCat(expenses),
      incomeCats: byCat(incomes)
    };
  },

  labelBreakdown(catTxs){
    // ritorna [{label, total, pct}] rispetto al totale della categoria (presenza multi-etichetta: somma per ogni etichetta presente)
    const catTotal = catTxs.reduce((s,t)=>s+Math.abs(t.amount),0);
    const map = new Map();
    catTxs.forEach(t=>{
      if(!t.labels.length){
        const k = '—senza etichetta';
        map.set(k, (map.get(k)||0) + Math.abs(t.amount));
        return;
      }
      t.labels.forEach(l=>{
        const name = labelName(l);
        map.set(name, (map.get(name)||0) + Math.abs(t.amount));
      });
    });
    const arr = Array.from(map.entries()).map(([label,total])=>({label,total,pct: catTotal? (total/catTotal*100):0}));
    arr.sort((a,b)=>{
      const ia = LABEL_ORDER.indexOf(a.label), ib = LABEL_ORDER.indexOf(b.label);
      if(ia===-1 && ib===-1) return b.total-a.total;
      if(ia===-1) return 1;
      if(ib===-1) return -1;
      return ia-ib;
    });
    return arr;
  },

  setInvestAmount(value){
    this.investAmount = Math.max(0, this.parseNum(value));
    this.saveData();
    if(this.route.page==='investments') this.render();
    this.showToast('PAC aggiornato.');
  },

  /* ---------------- TRASFERIMENTI VERSO SCALABLE -> ripartizione sugli ETF ---------------- */
  isScalableWallet(wallet){
    return displayWalletName(wallet||'').toUpperCase().includes('SCALABLE');
  },
  parseNum(v){
    const str = String(v).trim();
    if(!str) return 0;
    const n = str.includes(',') ? parseFloat(str.replace(/[.\s]/g,'').replace(',','.')) : (/^-?\d{1,3}(\.\d{3})+$/.test(str) ? parseFloat(str.replace(/\./g,'')) : parseFloat(str));
    return Number.isFinite(n) ? n : 0;
  },
  esc(v){ return String(v==null?'':v).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); },

  /* ---------------- TENDINA CATEGORIE (mostra tutte le voci, senza scrollbar interna) ---------------- */
  openCatPicker(inputEl, listType){
    this.closeCatPicker();
    const cats = listType==='income' ? this.knownIncomeCategories() : this.knownCategories();
    if(!cats.length) return;
    const dd = document.createElement('div');
    dd.className = 'cat-dropdown';
    const renderItems = (filter)=>{
      const f = (filter||'').trim().toLowerCase();
      const shown = f ? cats.filter(c=>c.toLowerCase().includes(f)) : cats;
      dd.innerHTML = shown.length
        ? shown.map(c=>`<div class="cat-dropdown-item">${this.esc(c)}</div>`).join('')
        : `<div class="cat-dropdown-empty">Nessuna categoria trovata</div>`;
    };
    renderItems('');
    const rect = inputEl.getBoundingClientRect();
    dd.style.left = Math.round(window.scrollX + rect.left)+'px';
    dd.style.top = Math.round(window.scrollY + rect.bottom + 4)+'px';
    dd.style.minWidth = Math.round(rect.width)+'px';
    document.body.appendChild(dd);
    this._catDD = dd;
    this._catDDInput = inputEl;
    dd.addEventListener('mousedown', (e)=>{
      const item = e.target.closest('.cat-dropdown-item');
      if(!item) return;
      e.preventDefault();
      inputEl.value = item.textContent;
      inputEl.dispatchEvent(new Event('change'));
      this.closeCatPicker();
    });
    this._catDDFilter = ()=> renderItems(inputEl.value);
    inputEl.addEventListener('input', this._catDDFilter);
  },
  closeCatPicker(){
    if(this._catDDInput && this._catDDFilter) this._catDDInput.removeEventListener('input', this._catDDFilter);
    if(this._catDD) this._catDD.remove();

  /* ================= RENDER: DISPATCH ================= */
  render(){
    const snap = this._focusSnap();
    this._renderInner();
    this._focusRestore(snap);
    this.collapseLong();
  },
  _focusSel:'input:not([type=file]):not([type=hidden]),select,textarea,button',
  _focusSnap(){
    const main = document.getElementById('main'), a = document.activeElement;
    if(!main || !a || !main.contains(a) || !a.matches('input,select,textarea')) return null;
    const i = Array.from(main.querySelectorAll(this._focusSel)).indexOf(a);
    if(i<0) return null;
    return { i, tab: (Date.now()-(this._tabAt||0) < 500) ? this._tabDir : 0, y: window.scrollY };
  },
  _focusRestore(s){
    if(!s) return;
    const apply = ()=>{
      const list = Array.from(document.getElementById('main').querySelectorAll(this._focusSel));
      const el = list[Math.max(0, Math.min(list.length-1, s.i + s.tab))];
      if(el && (s.tab || !el.classList.contains('cat-input'))) el.focus({ preventScroll:true }); // niente refocus sui campi categoria: riaprirebbe la tendina
      window.scrollTo(0, s.y);
    };
    if(s.tab) setTimeout(apply, 0); else apply(); // con Tab aspetto che il browser finisca di spostare il focus
  },
  _renderInner(){
    Object.values(this.charts).forEach(c=>{ try{c.destroy();}catch(e){} });
    this.charts = {};
    const main = document.getElementById('main');
    if(!this.transactions.length && this.route.page!=='import' && this.route.page!=='month' && this.route.page!=='investments' && this.route.page!=='yearly'){
      main.innerHTML = this.emptyStateHTML();
      return;
    }
    if(this.route.page==='home') return this.renderHome();
    if(this.route.page==='month') return this.renderMonth(this.route.month);
    if(this.route.page==='yearly') return this.renderYearly();
    if(this.route.page==='investments') return this.renderInvestments();
    if(this.route.page==='import') return this.renderImport();
  },

  mountChart(key, canvasId, config){
    const canvas = document.getElementById(canvasId);
    if(!canvas) return;
    const wrap = canvas.closest('.chart-wrap');
    if(typeof Chart === 'undefined'){
      if(wrap) wrap.innerHTML = '<div class="chart-error">Impossibile caricare la libreria dei grafici (Chart.js) da internet. Controlla la connessione e ricarica la pagina; se il problema persiste, apri il file direttamente nel browser invece che in anteprima.</div>';
      console.error('Chart.js non è disponibile: lo script non si è caricato.');
      return;
    }
    try{
      if(this.charts[key]){ try{ this.charts[key].destroy(); }catch(e){} delete this.charts[key]; } // riapertura/re-mount: la canvas va liberata prima
      const ys = config.options && config.options.scales && config.options.scales.y;
      if(ys && !ys.afterFit) ys.afterFit = (sc)=>{ sc.width = Math.max(sc.width, 60); }; // spazio minimo per i numeri, anche se il font non e' ancora caricato
      this.charts[key] = new Chart(canvas, config);
    }catch(err){
      console.error('Errore nella creazione del grafico "'+key+'":', err);
      if(wrap) wrap.innerHTML = '<div class="chart-error">Non è stato possibile disegnare questo grafico. Apri la console del browser (F12) per il dettaglio dell\'errore.</div>';
    }
  },

          ${yearSum.hasData ? yearDetailBody(expenseCatList, expenseLabelList) : ''}
        </details>
        <div class="card">
          <div class="stat-label">Impegni futuri</div>
          <div class="stat-value mono ${commitments.total?'brick':''}">${commitments.total ? '−'+fmtEUR.format(commitments.total) : fmtEUR.format(0)}</div>
          <div class="stat-sub">${commitments.entries.length ? commitments.entries.length+(commitments.entries.length===1?' mese con pagamenti previsti':' mesi con pagamenti previsti') : 'nessun pagamento previsto'}</div>
        </div>
      </div>

      <div class="section-title"><span>Andamento del patrimonio</span><span class="stat-sub" style="font-weight:500;">· ${periodLbl}</span><span class="rule"></span></div>
      <div class="card">
        ${!series.length ? `<div class="stat-sub" style="padding:6px 2px;">Nessun movimento in questo periodo.</div>` : `<div class="chart-wrap tall"><canvas id="chart-patrimonio" role="img" aria-label="Grafico: andamento del patrimonio nel tempo"></canvas></div>`}
      </div>

      <div class="section-title"><span>Portafogli</span><span class="rule"></span></div>
      ${hasInvest ? `
      <div class="wallet-top-grid">
        <div class="wallet-col-title with-total"><span>Liquidità</span><span class="wct-total">${fmtEUR.format(opTotal + liquidNonOpTotal)}</span></div>
        <div class="wallet-col-title with-total"><span>Investimenti</span><span class="wct-total">${fmtEUR.format(investTotal)}</span></div>
        ${topPairsHTML}
      </div>
      ${(extraLiquidCards || extraInvestedCards) ? `
      <div class="wallet-cols" style="margin-top:18px;">
        <div class="wallet-col">${extraLiquidCards}</div>
        <div class="wallet-col">${extraInvestedCards}</div>
      </div>` : ''}
      ` : `<div class="wallet-col">${virtualCardHTML}${fondoCardHTML}${extraLiquidCards}</div>`}

      <div class="section-title"><span>Composizione del patrimonio</span><span class="stat-sub" style="font-weight:500;">· ${periodLbl}</span><span class="rule"></span></div>
      <div class="card"><div class="chart-wrap"><canvas id="chart-composition" role="img" aria-label="Grafico: composizione del patrimonio per portafoglio"></canvas></div></div>

      <div class="section-title"><span>Impegni futuri</span><span class="rule"></span></div>
      ${proposals.length ? `<div class="planned-warning" style="display:flex; align-items:center; gap:8px 10px; flex-wrap:wrap;">
        <span>⚠ ${proposals.length} ${proposals.length===1?'abbinamento':'abbinamenti'} tra pagamenti previsti e movimenti importati da confermare:</span>
        ${proposalMonths.map(([ym,n])=>`<button class="btn ghost small" onclick="App.navigate('month','${ym}')">${this.monthLabel(ym)} (${n})</button>`).join('')}
      </div>` : ''}
      ${commitments.entries.length ? `
      <details class="card year-detail" style="padding:14px 20px;" ${this.commitmentsOpen?'open':''} ontoggle="App.commitmentsOpen=this.open">
        <summary>
          <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
            <div>
              <div class="stat-label">Totale pagamenti fissi previsti</div>
              <div class="stat-sub">${commitments.entries.length} ${commitments.entries.length===1?'mese con pagamenti':'mesi con pagamenti'} · clicca per la lista <span class="caret">▸</span></div>
            </div>
            <div class="stat-value mono brick" style="margin-top:0; font-size:24px;">${fmtEUR.format(commitments.total)}</div>
          </div>
        </summary>
        <div class="ledger" style="margin-top:12px; padding-top:8px; border-top:1px dashed var(--line-strong);">
          ${commitments.entries.map(e=>`
            <details class="ledger-row">
              <summary>
                <span class="ledger-name">${this.monthLabel(e.ym)}</span>
                <span class="ledger-leader"></span>
                <span class="ledger-amt">${fmtEUR.format(e.total)}</span>
                <span class="caret">▸</span>
              </summary>
              <div class="label-breakdown">
                ${this.monthPlanned(e.ym).filter(p=>!p.paid).map(p=>`
                  <div class="label-chip-row">
                    <span style="flex:1; font-size:13px; font-weight:500;">${this.esc(p.name)}${p.category ? ' · '+this.esc(p.category) : ''}</span>
                    <span class="label-amt mono">${fmtEUR.format(p.amount)}</span>
                  </div>
                `).join('')}
              </div>
            </details>`).join('')}
        </div>
      </details>
      ` : `<div class="card"><div class="stat-sub" style="padding:6px 2px;">Nessun pagamento fisso previsto. Aggiungine uno da una pagina di un mese futuro (li trovi nella sidebar contrassegnati "futuro").</div></div>`}

      <div class="section-title"><span>Liquidità · previsione 12 mesi</span><span class="rule"></span></div>
      <div class="card">
        ${!lf.hasData ? `
          <div class="stat-sub" style="padding:6px 2px;">Serve almeno un mese completo di spese ed entrate registrate per stimare la liquidità futura.</div>
        ` : `
          <div class="grid grid-3" style="align-items:start;">
            <div>
              <div class="stat-label">Liquidità attuale</div>
              <div class="stat-value mono" style="font-size:24px;">${fmtEUR.format(lf.combinedStart)}</div>
              <div class="stat-sub">Operativo + Fondo Emergenza</div>
            </div>
            <div>
              <div class="stat-label">Stimata tra 12 mesi</div>
              <div class="stat-value mono" style="font-size:24px; color:${lf.projectedCombined>=0?'var(--green)':'var(--brick)'}">${fmtEUR.format(lf.projectedCombined)}</div>
              <div class="stat-sub">al netto di entrate/uscite medie e impegni fissi previsti e PAC</div>
            </div>
            <div>
              <div class="stat-label">Variazione stimata</div>
              <div class="stat-value mono" style="font-size:24px;"><span class="delta ${(lf.projectedCombined-lf.combinedStart)>=0?'pos':'neg'}">${(lf.projectedCombined-lf.combinedStart)>=0?'▲':'▼'} ${fmtEUR0.format(Math.abs(lf.projectedCombined-lf.combinedStart))}</span></div>
              <div class="stat-sub">nei prossimi 12 mesi · medie su ${lf.monthsUsed} mesi completati</div>
            </div>
          </div>
          ${this.reliabilityHTML(lf)}
          <details class="year-detail" ${this.liquidityDetailOpen?'open':''} ontoggle="App.liquidityDetailOpen=this.open; if(this.open) App.mountLiquidityChart();" style="margin-top:16px; padding-top:14px; border-top:1px dashed var(--line-strong);">
            <summary style="font-size:13.5px; font-weight:600;">Dettaglio mese per mese <span class="caret">▸</span></summary>
            <div style="margin-top:16px;">
              <div class="stat-sub" style="margin-bottom:10px;">Spesa variabile media: <strong class="mono">${fmtEUR0.format(lf.varExp.avg)}</strong>/mese (al netto degli importi già coperti da pagamenti ricorrenti previsti) · Entrate medie: <strong class="mono">${fmtEUR0.format(lf.avgInc.avg)}</strong>/mese.</div>
              <div class="chart-wrap tall"><canvas id="chart-liquidity" role="img" aria-label="Grafico: previsione della liquidità nei prossimi 12 mesi"></canvas></div>
              <div class="table-scroll" style="margin-top:16px;">
                <table class="inv-table">
                  <thead><tr><th>Mese</th><th class="num">Impegni fissi</th><th class="num">PAC</th><th class="num">Fabbisogno netto</th><th class="num">Residuo Operativo</th><th class="num">Residuo Op.+Fondo</th></tr></thead>
                  <tbody>
                    ${lf.rows.map(r=>`<tr>
                      <td>${this.monthLabel(r.ym)}${r.partial ? ' <span class="stat-sub">· in corso (solo il residuo)</span>' : ''}</td>
                      <td class="num mono">${r.planned ? fmtEUR.format(r.planned) : '—'}</td>
                      <td class="num mono">${r.pac ? fmtEUR.format(r.pac) : '—'}</td>
                      <td class="num mono">${r.need>=0?'':'+'}${fmtEUR.format(Math.abs(r.need))}${r.need>=0?'':' (surplus)'}</td>
                      <td class="num mono" style="color:${r.runOp<0?'var(--brick)':'var(--ink)'};">${fmtEUR.format(r.runOp)}</td>
                      <td class="num mono" style="color:${r.runCombined<0?'var(--brick)':'var(--ink)'};"><strong>${fmtEUR.format(r.runCombined)}</strong></td>
                    </tr>`).join('')}
                  </tbody>
                </table>
              </div>
              <div class="label-note" style="padding-left:2px;">"Fabbisogno netto" = spesa variabile media − entrate medie + impegni fissi previsti di quel mese + PAC (l'importo di INVESTI € nella pagina Investimenti; nel mese in corso si toglie quanto hai già trasferito verso Scalable). Le medie usano solo i mesi completati. Per il mese in corso conta solo il residuo: quanto hai già speso o incassato è già nel saldo attuale, quindi se spendi più (o meno) del previsto la stima si aggiorna al prossimo import. "Residuo" è la liquidità cumulata che resterebbe partendo da oggi. La stima non conta gli investimenti (Scalable, Fondapi): non sono liquidità pronta.</div>
            </div>
          </details>
        `}
      </div>
    `;

    if(series.length) this.mountChart('patrimonio', 'chart-patrimonio', {
      type:'line',
      data:{
        labels: series.map(p=>fmtDateIT(p.dateStr)),
        datasets:[{
          label:'Patrimonio',
          data: series.map(p=>p.total),
          borderColor:'#A97F3F',
          backgroundColor:'rgba(169,127,63,0.12)',
          fill:true, tension:0.25, pointRadius:0, borderWidth:2.5
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{ mode:'index', intersect:false },
        plugins:{ legend:{display:false}, tooltip:{
          intersect:false,
          callbacks:{ label:(c)=> fmtEUR.format(c.parsed.y) }
        }},
        scales:{
          x:{ ticks:{ maxTicksLimit:8, color:'#4A443A', font:{family:'IBM Plex Mono',size:11} }, grid:{ display:false } },
          y:{ ticks:{ color:'#4A443A', font:{family:'IBM Plex Mono',size:11}, callback:(v)=>fmtEUR0.format(v) }, grid:{ color:'rgba(33,29,22,0.08)' } }
        }
      }
    });
    this.mountCompositionChart();
    if(lf.hasData && this.liquidityDetailOpen) this.mountLiquidityChart();
  },

  /* ================= RENDER: MONTH ================= */
  renderMonth(ym){
    const main = document.getElementById('main');
    if(!ym){ main.innerHTML = this.emptyStateHTML(); return; }
    const s = this.monthSummary(ym);
    const allMonthsAsc = this.allMonths();
    const idx = allMonthsAsc.indexOf(ym);
    const prev = idx>0 ? allMonthsAsc[idx-1] : null;
    const next = idx<allMonthsAsc.length-1 ? allMonthsAsc[idx+1] : null;
    const nowYm = todayYm();
    const isFuture = ym > nowYm;
    const isEmpty = !this.monthHasActivity(ym);
    const planned = this.monthPlanned(ym);
    const plannedTotal = this.monthPlannedTotal(ym);
    const plannedPaidTotal = this.monthPlannedPaidTotal(ym);

    const catRow = (cat, type)=>{
      const pct = (type==='expense'? s.totalExpense : s.totalIncome) ? (cat.total/(type==='expense'?s.totalExpense:s.totalIncome)*100) : 0;
      const breakdown = type==='expense' ? this.labelBreakdown(cat.txs) : null;
      return `
        <details class="ledger-row ${type}">
          <summary>
            <span class="ledger-name">${cat.name}</span>
            <span class="ledger-leader"></span>
            <span class="ledger-pct">${pct.toFixed(0)}%</span>
            <span class="ledger-amt">${type==='expense'?'−':''}${fmtEUR.format(cat.total)}</span>
            <span class="caret">▸</span>
          </summary>
          ${type==='expense' ? `<div class="label-breakdown">
            ${breakdown.map(b=>`
              <div class="label-chip-row">
                <span class="label-chip">${b.label}</span>
                <span class="label-bar-track"><span class="label-bar-fill" style="width:${b.pct}%"></span></span>
                <span class="label-amt mono">${fmtEUR.format(b.total)}</span>
              </div>
            `).join('')}
          </div>
          <div class="label-note">Un movimento con più etichette viene conteggiato per intero in ciascuna: le percentuali per etichetta non sommano necessariamente al 100%.</div>` : ''}
          ${this.txListHTML(cat.txs)}
        </details>
      `;
    };

    const walletRows = this.orderedWallets().map(w=>{
      const txs = this.transactions.filter(t=>t.wallet===w && t.ym===ym);
      const net = txs.reduce((s2,t)=>s2+t.amount,0);
      const op = this.isOperational(w);
      const sm = this.useInvFor(w) ? this.invMonthStats(ym) : null;
      if(sm){
        const sg = (v)=> (v>=0?'+':'−')+fmtEUR.format(Math.abs(v)), cl = (v)=> v>0.004 ? 'gain-pos' : (v<-0.004 ? 'gain-neg' : '');
        const open = !!this.scalOpen[ym];
        if(!open) return `<div class="wm-row">
        <span class="wm-badge ${op?'op':'nonop'}">${op?'Operativo':'Escluso'}</span>
        <span class="wm-name">${displayWalletName(w)}</span>
        <button class="wm-amt wm-tot-btn mono ${cl(sm.tot)}" aria-expanded="false" onclick="App.toggleScalMonth('${ym}')">${sg(sm.tot)}<span class="caret">▸</span></button>
      </div>`;
        return `<div class="wm-row wm-has-multi">
        <span class="wm-badge ${op?'op':'nonop'}">${op?'Operativo':'Escluso'}</span>
        <span class="wm-name">${displayWalletName(w)}</span>
        <span class="wm-multi mono">
          <span><b>Versati</b>${sg(sm.inv)}</span>
          <span class="${cl(sm.market)}"><b>Variazione</b>${sg(sm.market)}</span>
          <button class="wm-tot wm-tot-btn ${cl(sm.tot)}" aria-expanded="true" onclick="App.toggleScalMonth('${ym}')"><b>Totale</b>${sg(sm.tot)}<span class="caret" style="transform:rotate(90deg); display:inline-block;">▸</span></button>
        </span>
      </div>`;
      }
      return `<div class="wm-row">
        <span class="wm-badge ${op?'op':'nonop'}">${op?'Operativo':'Escluso'}</span>
        <span class="wm-name">${displayWalletName(w)}</span>
        <span class="wm-amt mono ${net>0?'gain-pos':(net<0?'gain-neg':'')}">${txs.length ? (net>=0?'+':'')+fmtEUR.format(net) : '— nessun movimento'}</span>
      </div>`;
    }).join('');

    const paidNote = (p)=> (p.paid && p.paidAmount && Math.abs(p.paidAmount-Math.abs(p.amount))>=0.01)
      ? `<div class="stat-sub" style="text-align:right; margin-top:3px;">importo reale ${fmtEUR.format(p.paidAmount)}</div>` : '';
    const proposalHTML = (p)=> (!p.paid && p.proposal) ? `
      <div style="margin-top:7px; font-size:12px; text-align:right; line-height:1.4;">
        <span style="color:var(--brick); font-weight:600;">Trovato ${fmtEUR.format(p.proposal.amount)}</span> il ${fmtDateIT(p.proposal.dateStr)}
        <div style="display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; margin-top:5px;">
          <button class="btn small" onclick="App.acceptProposal('${ym}','${p.id}',false)">Conferma</button>
          ${p.recurrence ? `<button class="btn ghost small" onclick="App.acceptProposal('${ym}','${p.id}',true)">Conferma e aggiorna importo</button>` : ''}
          <button class="btn ghost small" onclick="App.dismissProposal('${ym}','${p.id}')">Ignora</button>
        </div>
      </div>` : '';
    const plannedRows = planned.length ? planned.map(p=>`
      <tr class="${p.paid?'planned-paid':''}">
        <td><input class="name-input" aria-label="Descrizione pagamento" value="${p.name.replace(/"/g,'&quot;')}" onchange="App.updatePlanned('${ym}','${p.id}','name',this.value)"></td>
        <td><input class="cat-input" aria-label="Categoria" placeholder="categoria" value="${(p.category||'').replace(/"/g,'&quot;')}" onfocus="App.openCatPicker(this,'expense')" onclick="App.openCatPicker(this,'expense')" onchange="App.updatePlanned('${ym}','${p.id}','category',this.value)"></td>
        <td class="num"><input aria-label="Importo" value="${p.amount}" onchange="App.updatePlanned('${ym}','${p.id}','amount',this.value)">
          <label class="rec-toggle" style="justify-content:flex-end; margin-top:4px;" title="Importo indicativo: all'import abbino in automatico un movimento della stessa categoria anche se differisce di poco (tolleranza ${this.PLANNED_APPROX_TOL_PCT}%)"><input type="checkbox" style="width:auto; padding:0; margin:0;" ${p.approx?'checked':''} onchange="App.setPlannedApprox('${ym}','${p.id}', this.checked)"> Circa</label>
        </td>
        <td>
          <label class="rec-toggle"><input type="checkbox" ${p.recurrence==='monthly'?'checked':''} onchange="App.toggleRecurrence('${ym}','${p.id}', this.checked?'monthly':null)"> Mensile</label>
          <label class="rec-toggle"><input type="checkbox" ${p.recurrence==='yearly'?'checked':''} onchange="App.toggleRecurrence('${ym}','${p.id}', this.checked?'yearly':null)"> Annuale</label>
        </td>
        <td class="num">
          <label class="paid-toggle" title="${p.paid?('Segnato pagato'+(p.paidDate?' automaticamente il '+p.paidDate:'')):'Segna come già pagato'}">
            <input type="checkbox" ${p.paid?'checked':''} onchange="App.togglePlannedPaid('${ym}','${p.id}', this.checked)">
            ${p.paid?'Pagato':'Da pagare'}
          </label>
          ${paidNote(p)}${proposalHTML(p)}
        </td>
        <td class="num"><button class="btn danger" onclick="App.removePlanned('${ym}','${p.id}')">Rimuovi</button></td>
      </tr>`).join('') : `<tr><td colspan="6" class="stat-sub" style="padding:12px 10px;">Nessun pagamento fisso previsto per questo mese.</td></tr>`;
    const categoryOptions = this.knownCategories().map(c=>`<option value="${c.replace(/"/g,'&quot;')}"></option>`).join('');
    const incomeCategoryOptions = this.knownIncomeCategories().map(c=>`<option value="${c.replace(/"/g,'&quot;')}"></option>`).join('');

    const canManual = this.canAddManual(ym);
    const manualTx = canManual ? this.monthManualTx(ym) : [];
    const manualRows = manualTx.length ? manualTx.map(t=>`
      <tr>
        <td>
          <select aria-label="Tipo di movimento" onchange="App.updateManualField('${t.id}','type', this.value)">
            <option value="Expense" ${t.type==='Expense'?'selected':''}>Uscita</option>
            <option value="Income" ${t.type==='Income'?'selected':''}>Entrata</option>
          </select>
        </td>
        <td><input class="cat-input" aria-label="Categoria" placeholder="categoria" value="${(t.category?t.category.name:'').replace(/"/g,'&quot;')}" onfocus="App.openCatPicker(this,'${t.type==='Income'?'income':'expense'}')" onclick="App.openCatPicker(this,'${t.type==='Income'?'income':'expense'}')" onchange="App.updateManualCategory('${t.id}', this.value)"></td>
        <td>
          <div style="display:flex; flex-wrap:wrap; gap:3px 10px; max-width:260px;">
            ${LABEL_ORDER.map(l=>`<label class="rec-toggle" style="font-size:12px;"><input type="checkbox" ${t.labels.includes(l)?'checked':''} onchange="App.toggleManualLabel('${t.id}','${l}', this.checked)"> ${l}</label>`).join('')}
          </div>
        </td>
        <td class="num"><input aria-label="Importo" value="${Math.abs(t.amount)}" onchange="App.updateManualField('${t.id}','amount', this.value)"></td>
        <td><input class="name-input" aria-label="Nota" placeholder="nota" value="${(t.note||'').replace(/"/g,'&quot;')}" onchange="App.updateManualField('${t.id}','note', this.value)"></td>
        <td class="num"><button class="btn danger" onclick="App.removeManualTransaction('${t.id}')">Rimuovi</button></td>
      </tr>`).join('') : `<tr><td colspan="6" class="stat-sub" style="padding:12px 10px;">Nessun movimento manuale aggiunto per questo mese.</td></tr>`;

    main.innerHTML = `
      <div class="page-head">
        <div class="eyebrow">Registro mensile ${isFuture?' · pianificazione':''}</div>
        <h1 class="page-title">${this.monthLabel(ym)}</h1>
        ${isEmpty ? `<div class="page-desc"><span class="empty-flag">Nessun movimento registrato in questo mese${isFuture?' (mese futuro)':''}.</span></div>` : ''}
        <div style="margin-top:14px; display:flex; gap:10px;">
          ${prev?`<button class="btn ghost small" onclick="App.navigate('month','${prev}')">‹ ${this.monthLabel(prev)}</button>`:''}
          ${next?`<button class="btn ghost small" onclick="App.navigate('month','${next}')">${this.monthLabel(next)} ›</button>`:''}
        </div>
      </div>

      <div class="grid grid-3">
        <div class="card">
          <div class="stat-label">Entrate</div>
          <div class="stat-value mono" style="color:var(--sage)">${fmtEUR.format(s.totalIncome)}</div>
        </div>
        <div class="card">
          <div class="stat-label">Uscite</div>
          <div class="stat-value mono brick">${fmtEUR.format(s.totalExpense)}</div>
          ${this.investedLine(this.investedIn(ym))}
        </div>
        <div class="card">
          <div class="stat-label">Saldo del mese</div>
          <div class="stat-value mono" style="color:${s.totalIncome-s.totalExpense>=0?'var(--green)':'var(--brick)'}">${fmtEUR.format(s.totalIncome-s.totalExpense)}</div>
          <div class="stat-sub">Tasso di risparmio: <strong class="mono">${this.savingsRate(s.totalIncome, s.totalExpense)}</strong></div>
          <div class="stat-sub">Variazione patrimonio totale (tutti i portafogli, incl. trasferimenti): ${fmtEUR.format(s.netFlow)}</div>
        </div>
      </div>

      <div class="section-title"><span>Portafogli questo mese</span><span class="rule"></span></div>
      <div class="card">
        <div class="wallet-month-grid">${walletRows || '<div class="stat-sub">Nessun portafoglio importato ancora.</div>'}</div>
        <div class="label-note" style="padding:10px 2px 0;">I portafogli "Escluso" (interessi/TFR) non entrano nelle entrate/uscite/categorie qui sotto, ma il loro movimento è comunque incluso nel patrimonio totale in Panoramica.</div>
      </div>

      <div class="section-title"><span>Categorie</span><span class="rule"></span></div>
      <div class="grid grid-2">
        <div class="card">
          <div class="stat-label" style="margin-bottom:10px;">Uscite per categoria</div>
          <div class="ledger">
            ${s.expenseCats.length ? s.expenseCats.map(c=>catRow(c,'expense')).join('') : '<div class="stat-sub" style="padding:10px 2px;">Nessuna uscita registrata questo mese.</div>'}
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:18px; min-width:0;">
          <div class="card">
            <div class="stat-label" style="margin-bottom:10px;">Entrate per categoria</div>
            <div class="ledger">
              ${s.incomeCats.length ? s.incomeCats.map(c=>catRow(c,'income')).join('') : '<div class="stat-sub" style="padding:10px 2px;">Nessuna entrata registrata questo mese.</div>'}
            </div>
          </div>
          <div class="card">
