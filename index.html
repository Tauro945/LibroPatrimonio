<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libro Patrimonio</title>

<!--pwa-->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F4EFE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#F4EFE3" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Libro">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.6.0/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root{
    --ink:#211D16;
    --ink-soft:#4A443A;
    --parchment:#F4EFE3;
    --parchment-dim:#EAE2CE;
    --card:#FBF8F0;
    --green:#16332B;
    --green-deep:#0D211A;
    --green-line: rgba(255,255,255,0.12);
    --brass:#A97F3F;
    --brass-light:#D9BD86;
    --brick:#963C31;
    --brick-soft:#F1E0DC;
    --sage:#5F7A67;
    --sage-soft:#E4EBE3;
    --line: rgba(33,29,22,0.14);
    --line-strong: rgba(33,29,22,0.28);
    --shadow: 0 1px 2px rgba(33,29,22,0.06), 0 8px 24px -12px rgba(33,29,22,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--parchment);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background: var(--brass-light); color: var(--green-deep); }
  h1,h2,h3,.display{ font-family:'Fraunces',serif; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums; }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  #app{ display:flex; min-height:100vh; }

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    width:264px; flex-shrink:0;
    background: linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%);
    color:#EDE7D6;
    padding:28px 20px 20px;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--green-line); }
  .brand .mark{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:#F6EEDA; line-height:1.15; }
  .brand .sub{ font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:#B9C4B8; margin-top:6px; }
  .nav-section{ margin-bottom:6px; }
  .nav-label{ font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#8FA093; margin:18px 4px 8px; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    width:100%; text-align:left; background:none; border:none;
    color:#DCE3D6; padding:9px 10px; border-radius:7px;
    font-size:14.5px; font-weight:500;
  }
  .nav-item:hover{ background: rgba(255,255,255,0.06); }
  .nav-item.active{ background: rgba(217,189,134,0.16); color:#F6EEDA; }
  .nav-item .num{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:#8FA093; width:18px; flex-shrink:0; }
  .nav-item.active .num{ color:var(--brass-light); }
  .month-list{ display:grid; grid-template-columns:repeat(3, 1fr); gap:5px; }
  .month-legend{ font-size:12px; color:#8FA093; padding:0 4px 8px; }
  .year-group{ margin-bottom:4px; }
  .year-group > summary{
    display:flex; align-items:center; gap:8px; cursor:pointer; list-style:none;
    padding:8px 8px; border-radius:7px; color:#DCE3D6; font-size:14px; font-weight:600;
  }
  .year-group > summary::-webkit-details-marker{ display:none; }
  .year-group > summary:hover{ background:rgba(255,255,255,0.06); }
  .year-group .caret{ color:#8FA093; }
  .year-group .yg-year{ font-family:'IBM Plex Mono',monospace; letter-spacing:.02em; }
  .year-group.has-active > summary{ color:#F6EEDA; }
  .year-group.has-active .caret{ color:var(--brass-light); }
  .year-group .month-list{ margin:4px 0 10px; }
  .backup-val{ font-size:12.5px; text-align:right; word-break:break-all; color:var(--ink-soft); }
  .last-import{
    background:var(--card); border:1px solid var(--line); border-left:5px solid var(--brass);
    border-radius:12px; padding:18px 22px; box-shadow:var(--shadow); margin-bottom:14px;
  }
  .last-import .li-label{ font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--brass); }
  .last-import .li-main{ display:flex; align-items:baseline; flex-wrap:wrap; gap:6px 16px; margin-top:8px; }
  .last-import .li-day{ font-family:'Fraunces',serif; font-size:24px; font-weight:600; color:var(--green); }
  .last-import .li-time{ font-size:22px; font-weight:600; color:var(--ink); }
  .last-import .li-sub{ font-size:13px; color:var(--ink-soft); margin-top:8px; line-height:1.5; word-break:break-word; }
  .last-import.empty .li-day{ font-size:17px; color:var(--ink-soft); font-weight:500; }
  @media (max-width:860px){ .last-import .li-day{ font-size:19px; } .last-import .li-time{ font-size:18px; } }
  .modal-overlay{ position:fixed; inset:0; background:rgba(20,17,11,0.55); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal-box{ background:var(--card); border-radius:14px; padding:24px 26px; max-width:460px; width:100%; box-shadow:0 20px 60px -10px rgba(0,0,0,0.4); }
  .modal-box .modal-title{ font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin:0 0 10px; }
  .modal-box .modal-msg{ font-size:14px; line-height:1.55; color:var(--ink-soft); margin:0 0 20px; }
  .modal-box .modal-actions{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
  .year-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:28px; }
  .year-tab{
    background:var(--card); border:1px solid var(--line-strong); border-radius:10px;
    padding:10px 20px; font-family:'Fraunces',serif; font-size:16px; font-weight:600; color:var(--ink-soft);
  }
  .year-tab .yt-sub{ display:block; font-family:'Inter',sans-serif; font-size:12px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--brass); margin-top:2px; }
  .year-tab:hover{ border-color:var(--brass); color:var(--ink); }
  .year-tab.active{ background:var(--green); border-color:var(--green); color:#F6EEDA; }
  .year-tab.active .yt-sub{ color:var(--brass-light); }
  .month-cell{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    background:rgba(255,255,255,0.045); border:1px solid transparent; border-radius:8px;
    padding:8px 2px 7px; color:#CBD6C7; font-size:12px; font-weight:600; letter-spacing:.01em;
  }
  .month-cell:hover{ background:rgba(255,255,255,0.09); }
  .month-cell.active{ background:rgba(217,189,134,0.20); border-color:rgba(217,189,134,0.5); color:#F6EEDA; }
  .month-cell.is-current{ border-color:rgba(217,189,134,0.45); }
  .month-cell.is-future{ color:#8FA093; }
  .month-cell.is-future.active{ color:#F6EEDA; }
  .mc-label{ line-height:1.1; }
  .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; display:inline-block; }
  .dot-data{ background:#8FBF9F; }
  .dot-planned{ background:var(--brass-light); }
  .dot-empty{ background:transparent; border:1.5px solid rgba(255,255,255,0.28); }
  .sidebar-foot{ margin-top:auto; padding-top:16px; border-top:1px solid var(--green-line); }
  .sidebar-foot .nav-item{ color:#B9C4B8; font-size:13px; }

  /* ---------- MAIN ---------- */
  #main{ flex:1; min-width:0; padding:40px 48px 80px; max-width:1180px; }
  .page-head{ margin-bottom:30px; }
  .eyebrow{ font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--brass); font-weight:600; margin-bottom:6px; }
  .page-title{ font-size:34px; font-weight:600; margin:0; color:var(--ink); }
  .page-desc{ color:var(--ink-soft); font-size:14.5px; margin-top:8px; max-width:640px; line-height:1.5; }

  .grid{ display:grid; gap:18px; align-items:start; }
  .grid-3{ grid-template-columns: repeat(3,1fr); }
  .grid-4{ grid-template-columns: repeat(4,1fr); }
  .grid-5{ grid-template-columns: repeat(5,1fr); }
  .grid-2{ grid-template-columns: repeat(2,1fr); }
  @media (max-width: 900px){ .grid-3, .grid-4, .grid-5{grid-template-columns:1fr 1fr;} }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:22px 24px; box-shadow:var(--shadow);
  }
  .card h3{ font-size:15px; margin:0 0 4px; font-weight:600; }
  .stat-label{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; }
  .stat-value{ font-family:'Fraunces',serif; font-size:30px; font-weight:600; margin-top:6px; color:var(--green); }
  .stat-value.brick{ color:var(--brick); }
  .stat-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; }
  .delta{ font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; padding:1px 7px; border-radius:20px; display:inline-block; }
  .delta.pos{ background:var(--sage-soft); color:var(--sage); }
  .delta.neg{ background:var(--brick-soft); color:var(--brick); }

  .section-title{
    font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin:36px 0 14px;
    display:flex; align-items:baseline; gap:10px;
  }
  .section-title .rule{ flex:1; height:1px; background:var(--line-strong); }

  /* ledger rows: numbered, dotted leader to amount */
  .ledger{ display:flex; flex-direction:column; }
  .ledger-row{
    display:flex; align-items:center; gap:10px; padding:9px 2px;
    border-bottom:1px solid var(--line);
  }
  .ledger-row:last-child{ border-bottom:none; }
  .ledger-idx{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--brass);
    width:26px; flex-shrink:0; text-align:right;
  }
  .ledger-name{ font-size:14px; font-weight:500; flex-shrink:0; width:168px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ledger-leader{ flex:1; border-bottom:1.5px dotted var(--line-strong); margin:0 6px; transform:translateY(-4px); min-width:14px; }
  .ledger-amt{ font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; flex-shrink:0; min-width:82px; text-align:right; white-space:nowrap; }
  .ledger-pct{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); width:38px; text-align:right; flex-shrink:0; white-space:nowrap; }
  .ledger-avg{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); min-width:88px; text-align:right; flex-shrink:0; white-space:nowrap; }
  .ledger-row.expense .ledger-amt{ color:var(--brick); }
  .ledger-row.income .ledger-amt{ color:var(--sage); }
  .ledger-row summary{ cursor:pointer; list-style:none; }
  .ledger-row summary::-webkit-details-marker{ display:none; }
  details.ledger-row{ display:block; padding:0; }
  details.ledger-row > summary{ display:flex; align-items:center; gap:10px; padding:9px 2px; }
  .ledger-cat-block{ border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:2px; }
  .ledger-cat-block:last-child{ border-bottom:none; margin-bottom:0; }
  .ledger-row-static{ border-bottom:none; padding-bottom:2px; }
  details.ledger-row[open] > summary{ border-bottom:1px dashed var(--line); }
  .caret{ font-size:10px; color:var(--ink-soft); transition:transform .15s; margin-left:2px; }
  details[open] .caret{ transform:rotate(90deg); }
  .label-breakdown{ padding:4px 2px 14px 36px; }
  .label-chip-row{ display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px; }
  .label-chip{
    font-size:12px; font-weight:700; letter-spacing:.04em; padding:2px 8px; border-radius:20px;
    background:var(--sage-soft); color:var(--sage); flex-shrink:0; width:84px; text-align:center;
  }
  .label-bar-track{ flex:1; height:6px; background:var(--parchment-dim); border-radius:4px; overflow:hidden; }
  .label-bar-fill{ height:100%; background:var(--brass); border-radius:4px; }
  .label-amt{ font-family:'IBM Plex Mono',monospace; font-size:12px; min-width:150px; text-align:right; color:var(--ink-soft); white-space:nowrap; flex-shrink:0; }
  .label-note{ font-size:12px; color:var(--ink-soft); padding:2px 2px 8px 36px; font-style:italic; }

  .wallet-card{ background:var(--card); border:1px solid var(--line); border-radius:11px; padding:12px 14px; box-shadow:var(--shadow); }
  .wallet-card-virtual{ border:1.5px dashed var(--brass); background:var(--parchment-dim); }
  .wallet-card-virtual summary{ cursor:pointer; list-style:none; }
  .wallet-card-virtual summary::-webkit-details-marker{ display:none; }
  .wallet-col{ display:flex; flex-direction:column; gap:10px; }
  .wallet-cols{ display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
  .wallet-top-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:stretch; }
  .wallet-top-grid > .wallet-card{ height:100%; }
  .wallet-col-title{ font-family:'Fraunces',serif; font-size:14px; font-weight:600; color:var(--ink-soft); margin:0 0 9px; letter-spacing:.01em; }
  .wallet-col-title.with-total{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .wallet-col-title .wct-total{ font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; color:var(--green); letter-spacing:0; }
  .op-wallet-list{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--line-strong); display:flex; flex-direction:column; gap:6px; }
  .op-wallet-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .op-wallet-name{ font-size:13px; font-weight:500; flex:1 1 100px; min-width:0; }
  .op-wallet-bal{ font-size:13px; font-weight:600; color:var(--green); flex-shrink:0; }
  .virtual-badge{
    font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--brass);
    border:1px solid var(--brass-light); border-radius:20px; padding:1px 7px; vertical-align:middle; white-space:nowrap;
  }
  .wallet-card-wide{ grid-column: span 2; }
  .goal-card{ padding:12px 14px; }
  .goal-inline{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--line-strong); }
  .goal-inline-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .goal-months-input{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; width:44px; text-align:center;
    padding:2px 4px; border:1px solid var(--line-strong); border-radius:5px; background:#fff;
  }

  .wallet-month-grid{ display:flex; flex-direction:column; }
  .wm-row{ display:flex; align-items:center; gap:12px; padding:9px 2px; border-bottom:1px solid var(--line); }
  .wm-row:last-child{ border-bottom:none; }
  .wm-badge{ font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:20px; flex-shrink:0; width:78px; text-align:center; }
  .wm-badge.op{ background:var(--sage-soft); color:var(--sage); }
  .wm-badge.nonop{ background:var(--parchment-dim); color:var(--ink-soft); }
  .wm-name{ flex:1; font-size:13.5px; font-weight:500; }
  .wm-amt{ font-size:13.5px; min-width:150px; text-align:right; color:var(--ink-soft); }
  .wm-amt.gain-pos{ color:var(--sage); }
  .wm-amt.gain-neg{ color:var(--brick); }
  .empty-flag{
    display:inline-block; font-size:12px; font-weight:600; color:var(--ink-soft);
    background:var(--parchment-dim); border-radius:20px; padding:4px 12px;
  }
  .planned-warning{
    background:var(--brick-soft); color:var(--brick); font-size:12.5px; font-weight:500;
    padding:10px 14px; border-radius:9px; margin-bottom:14px; line-height:1.5;
  }
  .cat-input{
    font-family:'Inter',sans-serif; font-size:13px; width:130px;
    padding:6px 9px; border:1px solid var(--line-strong); border-radius:6px; background:#fff;
  }
  .cat-dropdown{
    position:absolute; z-index:60; background:#fff; border:1px solid var(--line-strong); border-radius:8px;
    box-shadow:var(--shadow); padding:4px; max-width:320px;
  }
  .cat-dropdown-item{
    padding:6px 9px; font-size:13px; border-radius:5px; cursor:pointer; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .cat-dropdown-item:hover{ background:var(--parchment-dim); }
  .cat-dropdown-empty{ padding:6px 9px; font-size:12.5px; color:var(--ink-soft); }
  .paid-toggle{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    color:var(--ink-soft); white-space:nowrap; cursor:pointer;
  }
  .paid-toggle input{ width:auto; margin:0; }
  .rec-toggle{
    display:flex; align-items:center; gap:5px; font-size:12px; font-weight:500;
    color:var(--ink-soft); white-space:nowrap; cursor:pointer;
  }
  .rec-toggle input{ width:auto; margin:0; }
  tr.planned-paid{ opacity:0.72; }
  tr.planned-paid .paid-toggle{ color:var(--sage); }
  tr.planned-paid td:first-child input{ text-decoration:line-through; }
  .wallet-card .wname{ font-size:12px; font-weight:600; color:var(--ink-soft); }
  .wallet-card .wbal{ font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:600; margin-top:3px; color:var(--green); }
  .wallet-card .wmeta{ margin-top:5px; }

  .chart-wrap{ position:relative; height:280px; }
  .chart-wrap.tall{ height:240px; }
  .chart-wrap.xl{ height:600px; }
  .chart-error{
    display:flex; align-items:center; justify-content:center; height:100%; text-align:center;
    color:var(--brick); font-size:13px; padding:0 30px; line-height:1.5; background:var(--brick-soft); border-radius:10px;
  }

  details.year-detail{ cursor:default; }
  details.year-detail summary{ cursor:pointer; list-style:none; }
  details.year-detail summary::-webkit-details-marker{ display:none; }
  .year-detail-body{ display:flex; gap:20px; margin-top:16px; padding-top:14px; border-top:1px dashed var(--line-strong); }
  .ydb-col{ flex:1; min-width:0; max-height:230px; overflow-y:auto; padding-right:4px; }
  .ydb-title{ font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); font-weight:700; margin-bottom:8px; }
  .ydb-row{ display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:5px 0; border-bottom:1px solid var(--line); }
  .ydb-row:last-child{ border-bottom:none; }
  .ydb-row span:first-child{ color:var(--ink); flex:1; }
  .ydb-row span:last-child{ color:var(--ink-soft); flex-shrink:0; }

  .btn{
    background:var(--green); color:#F6EEDA; border:none; border-radius:8px;
    padding:10px 18px; font-size:13.5px; font-weight:600; letter-spacing:.01em;
  }
  .btn:hover{ background:var(--green-deep); }
  .btn.ghost{ background:transparent; color:var(--green); border:1.5px solid var(--line-strong); }
  .btn.ghost:hover{ background:var(--parchment-dim); }
  .btn.danger{ background:transparent; color:var(--brick); border:1.5px solid var(--brick-soft); padding:6px 10px; font-size:12px; }
  .btn.small{ padding:6px 12px; font-size:12.5px; }

  .empty-state{
    text-align:center; padding:70px 20px; border:1.5px dashed var(--line-strong); border-radius:14px; background:var(--card);
  }
  .empty-state .display{ font-size:22px; margin-bottom:10px; }
  .empty-state p{ color:var(--ink-soft); font-size:14px; max-width:420px; margin:0 auto 22px; line-height:1.55; }

  .upload-box{
    border:1.5px dashed var(--line-strong); border-radius:12px; padding:30px; text-align:center; background:var(--card);
  }
  .upload-box input[type=file]{ display:none; }
  .file-pill{
    display:inline-flex; align-items:center; gap:8px; background:var(--parchment-dim); border-radius:20px;
    padding:5px 12px 5px 12px; font-size:12.5px; margin:4px 4px 0 0;
  }
  .file-pill .x{ cursor:pointer; color:var(--brick); font-weight:700; }

const fmtDateIT = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m ? `${m[3]}.${m[2]}.${m[1]}` : (s||''); };

function uid(){ return Math.random().toString(36).slice(2,10); }

function localYmd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayYm(){ return localYmd(new Date()).slice(0,7); }
function addMonthsToYm(ym, n){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(Date.UTC(y, (m-1)+n, 1));
  return d.toISOString().slice(0,7);
}

  const cleaned = (raw||'')

    .replace(/\s{2,}/g, ' ')
    .trim();
  return cleaned || raw;
}

function parseCategory(raw){
  const c = (raw||'').trim();
  if(!c) return null;
  const m = c.match(/^(\d+)\.\s*(.+)$/);
  if(m) return { code: parseInt(m[1],10), name: m[2].trim(), numbered:true };
  return { code: null, name: c, numbered:false };
}

// plugin per le etichette dentro le barre dei grafici: registrato ma disattivato di default,

if(typeof Chart !== 'undefined' && typeof ChartDataLabels !== 'undefined'){

function contrastTextColor(bg){
  // sceglie testo chiaro o scuro in base alla luminosità dello sfondo, per restare leggibile su qualunque colore di categoria
  if(!bg || bg.indexOf('rgba')===0) return '#211D16';
  const hex = bg.replace('#','');
  const r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
  const luminance = (0.299*r + 0.587*g + 0.114*b)/255;
  return luminance > 0.58 ? '#211D16' : '#FBF8F0';
}

  investAmount: 0,            // importo (EUR) che voglio investire ora: viene ripartito tra gli ETF
  maxShiftPct: 25,            // scostamento massimo RELATIVO al target (es. target 60% e shift 25% -> range 45-75%)
  targetMonthsEmergency: 6,   // n. mesi di spesa media NECESSARIE da tenere nel Fondo Emergenza

  async init(){
    await this.loadData();
    this.loadBackupMeta();
    this.syncAllRecurrences(); // estende le ricorrenze fino al nuovo orizzonte se sono passati mesi dall'ultima apertura
    this.renderSidebar();
    this.render();
  },

  STORAGE_KEY: 'libroMastroFinanceData',

  budgets:{},   // categoria -> [{from:'aaaa-mm', amount, set:'aaaa-mm'}]: storico dei budget, ogni voce vale dal mese 'from'
  relOpen:false,
  txOpen:false, _clOpen:new Set(),
  _txv:0, _idx:null,
  idx(){
    const tx = this.transactions, c = this._idx;
    if(c && c.v===this._txv && c.arr===tx && c.len===tx.length) return c;
    const byYm = new Map(), byWallet = new Map(), walletSum = new Map();
    tx.forEach(t=>{
      let a = byYm.get(t.ym); if(!a){ a = []; byYm.set(t.ym, a); } a.push(t);
      if(t.wallet){
        let b = byWallet.get(t.wallet); if(!b){ b = []; byWallet.set(t.wallet, b); } b.push(t);
        walletSum.set(t.wallet, (walletSum.get(t.wallet)||0) + t.amount);
      }
    });
    return (this._idx = { v:this._txv, arr:tx, len:tx.length, byYm, byWallet, walletSum });
  },
  collapseLong(force){
    const main = document.getElementById('main'); if(!main) return;
    if(force) main.querySelectorAll('[data-cl]').forEach(el=>{ el.classList.remove('cl-text','cl-closed'); el.removeAttribute('data-cl'); el.removeAttribute('title'); });
    main.querySelectorAll('.page-desc,.stat-sub,.label-note').forEach(el=>{
      if(el.dataset.cl || el.closest('summary') || el.querySelector('input,button,select,textarea')) return;
      if(el.offsetParent===null) return; // nascosto (details chiuso): si valuta quando viene aperto
      const cs = getComputedStyle(el);
      if(cs.display==='inline') return;
      const lh = parseFloat(cs.lineHeight) || (parseFloat(cs.fontSize)||13)*1.3;
      el.dataset.cl = '1';
      if(el.getBoundingClientRect().height / lh <= 3.3) return;
      el.classList.add('cl-text');
      if(!this._clOpen.has((el.textContent||'').trim().slice(0,60))) el.classList.add('cl-closed');
      el.title = 'Clicca per espandere / comprimere';
    });
  },
  /* ---- budget mensile per categoria (con storico) ---- */
  budgetFor(cat, ym){
    const list = this.budgets[cat]; if(!list) return null;
    let v = null; for(const e of list){ if(e.from<=ym) v = e.amount; }
    return v>0 ? v : null;
  },
  setBudget(cat, value){
    const amount = Math.max(0, this.parseNum(value));
    const list = this.budgets[cat] || (this.budgets[cat] = []);
    const cur = todayYm(), last = list[list.length-1];
    if(!last) list.push({ from:'0000-00', amount, set:cur });          // primo budget: vale anche per i mesi passati
    else if(last.set===cur) last.amount = amount;                        // correzione nello stesso mese
    else if(amount!==last.amount) list.push({ from:cur, amount, set:cur }); // modifica: vale dal mese in corso, il passato non cambia
    this.saveData();
    this.render();
    this.showToast('Budget aggiornato: vale dal mese in corso, i mesi passati restano invariati.');
  },
  budgetRowsHTML(){
    const cats = this.knownCategories(), cur = todayYm();
    if(!cats.length) return '<div class="stat-sub">Nessuna categoria di spesa ancora.</div>';
    return cats.map(c=>{
      const b = this.budgetFor(c, cur), list = this.budgets[c]||[], last = list[list.length-1];
      const since = last && last.from!=='0000-00' ? ` <span class="stat-sub">· dal ${this.monthLabel(last.from)}</span>` : '';
      return `<div class="field-row"><label>${categoryStyle(c,0).emoji} ${this.esc(c)}${since}</label><input class="mono" aria-label="Budget mensile ${this.esc(c)}" placeholder="nessun budget" value="${b?String(b).replace('.',','):''}" onchange="App.setBudget('${c.replace(/'/g,"\\'")}', this.value)"></div>`;
    }).join('');
  },
  yearBudgetSeries(year, cat){ return Array.from({length:12}, (_,i)=> this.budgetFor(cat, `${year}-${String(i+1).padStart(2,'0')}`)); },
  budgetSummary(year, cat, data){
    const bud = this.yearBudgetSeries(year, cat);
    if(!bud.some(b=>b!==null)) return ' · nessun budget impostato (Dati &amp; import)';
    const over = [];
    data.forEach((v,i)=>{ if(bud[i]!==null && v>bud[i]+0.005) over.push(`${MESI_ABBR[i]} (+${fmtEUR0.format(v-bud[i])})`); });
    return ' · linea rossa = budget · ' + (over.length ? `<strong style="color:#B3261E;">sopra budget: ${over.join(', ')}</strong>` : 'budget sempre rispettato');
  },

  /* ---- confronti ---- */
  cmpCell(label, cur, prev, upIsGood){
    const d = cur-prev, pct = prev ? d/Math.abs(prev)*100 : null, good = upIsGood ? d>=0 : d<=0;
    return `<div class="card"><div class="stat-label">${label}</div><div class="stat-value mono" style="font-size:22px;">${fmtEUR.format(cur)}</div><div class="stat-sub"><span class="delta ${good?'pos':'neg'}">${d>=0?'▲':'▼'} ${fmtEUR0.format(Math.abs(d))}${pct===null?'':' ('+fmtPct(pct)+')'}</span> vs ${fmtEUR0.format(prev)}</div></div>`;
  },
  periodTotals(year, k){
    let inc = 0, exp = 0; const cat = new Map();
    for(let m=1; m<=k; m++){
      this.monthTx(`${year}-${String(m).padStart(2,'0')}`).forEach(t=>{
        if(!this.isOperational(t.wallet)) return;
        if(t.type==='Income') inc += t.amount;
        else if(t.type==='Expense'){ const a = Math.abs(t.amount), n = t.category ? t.category.name : 'Senza categoria'; exp += a; cat.set(n, (cat.get(n)||0)+a); }
      });
    }
    return { inc, exp, cat };
  },
  yearCompareHTML(year, y){
    const py = String(parseInt(year,10)-1), k = y.isCurrent ? y.monthsElapsed : 12;
    const note = (m)=> `<div class="section-title"><span>Confronto con ${py}</span><span class="rule"></span></div><div class="card"><div class="stat-sub">${m}</div></div>`; // anno in corso: stessi mesi completati dell'anno prima
    if(!k) return note('Nessun mese completato quest\'anno: il confronto sarà disponibile dal prossimo mese.');
    if(!this.getYears().includes(py)) return note(`Nessun dato per il ${py}: il confronto compare quando ci sono movimenti dell'anno precedente.`);
    const a = this.periodTotals(year,k), b = this.periodTotals(py,k);
    if(!(b.inc || b.exp)) return note(`Nel ${py} non ci sono entrate o uscite nei portafogli operativi per gli stessi mesi.`);
    const rows = Array.from(new Set([...a.cat.keys(), ...b.cat.keys()])).map(c=>{ const cur = a.cat.get(c)||0, prev = b.cat.get(c)||0; return { c, cur, prev, d:cur-prev }; })
      .sort((p,q)=>Math.abs(q.d)-Math.abs(p.d)).slice(0,8);
    return `<div class="section-title"><span>Confronto con ${py}</span><span class="stat-sub" style="font-weight:500;">· ${y.isCurrent ? 'Gennaio–'+MESI_IT[k-1] : 'anno intero'}</span><span class="rule"></span></div>
      <div class="grid grid-3">${this.cmpCell('Entrate', a.inc, b.inc, true)}${this.cmpCell('Uscite', a.exp, b.exp, false)}${this.cmpCell('Saldo', a.inc-a.exp, b.inc-b.exp, true)}</div>
      <div class="card" style="margin-top:18px;"><div class="stat-label" style="margin-bottom:8px;">Categorie con la variazione maggiore (uscite)</div>
      ${rows.map(x=>`<div class="ydb-row"><span>${x.d>0?'▲':'▼'} ${this.esc(x.c)}</span><span class="mono" style="color:${x.d>0?'var(--brick)':'var(--sage)'}">${x.d>0?'+':'−'}${fmtEUR0.format(Math.abs(x.d))} · ${fmtEUR0.format(x.cur)} vs ${fmtEUR0.format(x.prev)}</span></div>`).join('')}</div>`;
  },
  monthCompareHTML(ym){
    if(!this.monthHasActivity(ym)) return '';
    const [yy, mm] = ym.split('-'), prevYm = `${parseInt(yy,10)-1}-${mm}`, s = this.monthSummary(ym);
    let head;
    if(this.monthHasActivity(prevYm)){
      const p = this.monthSummary(prevYm);
      head = `<div class="grid grid-3">${this.cmpCell('Entrate', s.totalIncome, p.totalIncome, true)}${this.cmpCell('Uscite', s.totalExpense, p.totalExpense, false)}${this.cmpCell('Saldo', s.totalIncome-s.totalExpense, p.totalIncome-p.totalExpense, true)}</div>`;
    } else head = `<div class="stat-sub">Nessun dato per ${this.monthLabel(prevYm)}: confronto con lo stesso mese dell'anno prima non disponibile.</div>`;
    const hist = []; let cur = addMonthsToYm(ym,-1);
    for(let i=0;i<12;i++){ if(this.monthHasActivity(cur)) hist.push(cur); cur = addMonthsToYm(cur,-1); }
    const hs = hist.map(h=>this.monthSummary(h)).filter(x=>x.totalExpense>0);
    let alerts;
    if(hs.length<3) alerts = `<div class="stat-sub">Servono almeno 3 mesi precedenti con spese per confrontare le categorie con la media.</div>`;
    else {
      const tot = new Map(); hs.forEach(x=>x.expenseCats.forEach(c=>tot.set(c.name, (tot.get(c.name)||0)+c.total)));
      const list = s.expenseCats.map(c=>({ name:c.name, cur:c.total, avg:(tot.get(c.name)||0)/hs.length })).filter(x=>x.avg>0 && x.cur>x.avg*1.3 && x.cur-x.avg>=10).sort((a,b)=>(b.cur-b.avg)-(a.cur-a.avg));
      alerts = list.length ? list.map(x=>`<div class="ydb-row"><span>▲ ${this.esc(x.name)}</span><span class="mono" style="color:var(--brick)">${fmtEUR0.format(x.cur)} vs media ${fmtEUR0.format(x.avg)} (${fmtPct((x.cur/x.avg-1)*100)})</span></div>`).join('') : `<div class="stat-sub">Nessuna categoria supera la media di oltre il 30%.</div>`;
    }
    return `<div class="section-title"><span>Confronti</span><span class="rule"></span></div>${head}<div class="card" style="margin-top:18px;"><div class="stat-label" style="margin-bottom:8px;">Categorie sopra la propria media (oltre +30%) · media degli ultimi ${hs.length} mesi</div>${alerts}</div>`;
  },

  /* ---- composizione del patrimonio per portafoglio ---- */
  walletSeries(key){
    const ws = this.orderedWallets().filter(w=>this.isIncludedInTotal(w));
    const run = {}; ws.forEach(w=> run[w] = this.openingBalances[w]||0);
    const byDay = new Map();
    [...this.transactions].sort((a,b)=>a.date-b.date).forEach(t=>{ if(t.wallet in run) run[t.wallet] += t.amount; byDay.set(t.dateStr, {...run}); });
    let pts = Array.from(byDay.entries()).map(([d,v])=>({ d, v }));
    const cutoff = this.periodCutoffDate(key);
    if(cutoff){
      const cs = cutoff.toISOString().slice(0,10);
      pts = pts.filter(p=>p.d>=cs);
      if(!pts.length || pts[0].d!==cs){ const base = {}; ws.forEach(w=> base[w] = this.walletBalanceBeforePeriod(w,key)); pts.unshift({ d:cs, v:base }); }
    }
    return { ws, pts };
  },
  mountCompositionChart(){
    const { ws, pts } = this.walletSeries(this.totalPeriod);
    if(!pts.length || !ws.length) return;
    const fb = ['#7A6F5E','#7A5E6F','#5E7A6F','#8B6F47'];
    const keyColor = [['FONDO EMERGENZA','#2E7D4F'], ['SCALABLE','#C0392B'], ['FONDAPI','#2F6DB5']]; // verde, rosso, blu
    const groups = [], op = ws.filter(w=>this.isOperational(w));
    if(op.length) groups.push({ label:'OPERATIVI', ws:op, color:'#B8860B' }); // oro
    const nm = (w)=> displayWalletName(w).toUpperCase();
    const rank = (w)=>{ const i = keyColor.findIndex(k=>nm(w).includes(k[0])); return i<0 ? 99 : i; };
    let fi = 0;
    ws.filter(w=>!this.isOperational(w)).sort((a,b)=>rank(a)-rank(b)).forEach(w=>{
      const k = keyColor.find(x=>nm(w).includes(x[0]));
      groups.push({ label:displayWalletName(w), ws:[w], color: k ? k[1] : fb[fi++ % fb.length] });
    });
    const tick = { color:'#4A443A', font:{ family:'IBM Plex Mono', size:11 } };
    this.mountChart('composition', 'chart-composition', {
      type:'line',
      data:{ labels: pts.map(p=>fmtDateIT(p.d)), datasets: groups.map(g=>({ label:g.label, data: pts.map(p=>g.ws.reduce((x,w)=>x+(p.v[w]||0),0)), borderColor:g.color, backgroundColor:g.color+'CC', fill:true, tension:0.2, pointRadius:0, borderWidth:1 })) },
      options:{
        responsive:true, maintainAspectRatio:false, interaction:{ mode:'index', intersect:false },
        plugins:{
          legend:{ position:'top', labels:{ color:'#4A443A', font:{ family:'Inter', size:11.5 }, boxWidth:12 } },
          tooltip:{ callbacks:{ label:(c)=> `${c.dataset.label}: ${fmtEUR.format(c.parsed.y)}`, footer:(items)=> 'Totale: '+fmtEUR.format(items.reduce((x,i)=>x+i.parsed.y,0)) } }
        },
        scales:{ x:{ ticks:{ ...tick, maxTicksLimit:8 }, grid:{ display:false } }, y:{ stacked:true, ticks:{ ...tick, callback:(v)=>fmtEUR0.format(v) }, grid:{ color:'rgba(33,29,22,0.08)' } } }
      }
    });
  },
  /* ---- affidabilita' della previsione di liquidita' ---- */
  forecastReliability(lf){
    const months = this.avgMonths(12, true), n = months.length, series = this.recurringSeries();
    const cv = (arr)=>{ if(arr.length<3) return null; const m = arr.reduce((a,b)=>a+b,0)/arr.length; if(!(m>0)) return 9; return Math.sqrt(arr.reduce((a,b)=>a+(b-m)**2,0)/arr.length)/m; };
    const cvR = (c)=> c===null ? 0.3 : (c<=0.15 ? 1 : c<=0.30 ? 0.7 : c<=0.5 ? 0.4 : 0.15);
    const cvT = (c)=> c===null ? 'servono almeno 3 mesi' : `variabilità mensile ${Math.round(c*100)}%`;
    const cvInc = cv(months.map(ym=>this.monthSummary(ym).totalIncome));
    const cvVar = cv(months.map(ym=>this.variableExpenseOfMonth(ym, series)));
    let last = null; for(let i=this.transactions.length-1; i>=0; i--){ if(!this.transactions[i].manual){ last = this.transactions[i]; break; } }
    const days = last ? Math.floor((Date.now()-last.date.getTime())/864e5) : null;
    const freshR = days===null ? 0 : days<=7 ? 1 : days<=21 ? 0.6 : days<=45 ? 0.27 : 0;
    const plannedMonths = lf.rows.filter(x=>x.planned>0).length, hasFixed = series.length>0 || plannedMonths>0;
    const pac = this.investAmount||0;
    const recentTr = this.transactions.filter(t=>this.isScalableWallet(t.wallet) && t.type==='Incoming Transfer' && t.date.getTime() > Date.now()-100*864e5).length;
    const factors = [
      { w:35, r:Math.min(1, n/12), label:'Storico', txt:`${n} mesi completati su 12` },
      { w:20, r:cvR(cvInc), label:'Stabilità delle entrate', txt:cvT(cvInc) },
      { w:20, r:cvR(cvVar), label:'Stabilità della spesa variabile', txt:cvT(cvVar) },
      { w:15, r:freshR, label:'Aggiornamento dati', txt: last ? `ultimo movimento ${fmtDateIT(last.dateStr)} (${days===0?'oggi':days+' gg fa'})` : 'nessun movimento' },
      { w:5, r:hasFixed?1:0.4, label:'Impegni fissi', txt: hasFixed ? `${series.length} ricorrenze attive · ${plannedMonths} mesi su 12 con pagamenti previsti` : 'nessun pagamento previsto inserito: la stima non conta spese fisse future' },
      { w:5, r:(pac>0 || !recentTr) ? 1 : 0, label:'PAC', txt: pac>0 ? `${fmtEUR0.format(pac)}/mese (INVESTI €)` : (recentTr ? 'INVESTI € non impostato ma hai versato verso Scalable di recente: stima ottimistica' : 'nessun versamento periodico rilevato') }
    ];
    const score = Math.round(factors.reduce((a,x)=>a+x.w*x.r, 0));
    return { score, level: score>=75 ? 'Alta' : score>=50 ? 'Media' : 'Bassa', factors };
  },
  reliabilityHTML(lf){
    const q = this.forecastReliability(lf);
    const cls = q.level==='Alta' ? 'ok' : q.level==='Media' ? 'nd' : 'out';
    const col = (x)=> x>=0.75 ? 'var(--sage)' : x>=0.4 ? 'var(--brass)' : 'var(--brick)';
    return `<details class="year-detail" ${this.relOpen?'open':''} ontoggle="App.relOpen=this.open" style="margin-top:16px; padding-top:14px; border-top:1px dashed var(--line-strong);">
      <summary style="font-size:13.5px; font-weight:600;">Affidabilità della previsione <span class="rb-badge ${cls}" style="margin-left:6px;">${q.level} · ${q.score}/100</span> <span class="caret">▸</span></summary>
      <div style="margin-top:12px;">
        ${q.factors.map(x=>`<div class="ydb-row"><span><span style="color:${col(x.r)};">●</span> ${x.label} <span class="stat-sub">· peso ${x.w}</span></span><span style="flex-shrink:1; text-align:right;">${x.txt}</span></div>`).join('')}
        <div class="label-note" style="padding-left:2px; margin-top:8px;">Il punteggio è una somma pesata: storico (35), stabilità di entrate (20) e spesa variabile (20), aggiornamento dei dati (15), impegni fissi (5) e PAC (5). Misura quanto i dati a disposizione sono adatti a una stima solida, non la probabilità che il valore reale coincida con la previsione. Più mesi e più regolarità aumentano il punteggio; un import vecchio o un PAC non impostato lo abbassano.</div>
      </div>
    </details>`;
  },
  /* ---- investiti = trasferimenti in ingresso verso il portafoglio SCALABLE ---- */
  investedIn(ym){
    const tr = this.monthTx(ym).filter(t=>this.isScalableWallet(t.wallet));
    const inn = tr.filter(t=>t.type==='Incoming Transfer' && t.amount>0).reduce((x,t)=>x+t.amount, 0);
    const out = tr.filter(t=>t.type==='Outgoing Transfer' && t.amount<0).reduce((x,t)=>x+t.amount, 0); // negativo
    return (inn>0 && out<0) ? inn+out : inn;
  },
  investedYearStats(year, monthsElapsed){
    const nowYm = todayYm(); let total = 0, completed = 0;
    for(let m=1; m<=12; m++){ const ym = `${year}-${String(m).padStart(2,'0')}`, v = this.investedIn(ym); total += v; if(ym<nowYm) completed += v; }
    return { total, avg: monthsElapsed ? completed/monthsElapsed : 0 };
  },
  investedLine(total, avg){
    if(!this.findWalletByKeyword('SCALABLE')) return '';
    return `<div class="stat-sub" title="Trasferimenti in ingresso verso Scalable; se nello stesso mese ci sono anche trasferimenti in uscita, vengono sottratti">Investiti: <strong class="mono">${fmtEUR.format(total)}</strong></div>${avg===undefined ? '' : `<div class="stat-sub">Media: ${fmtEUR.format(avg)}</div>`}`;
  },
  savingsRate(inc, exp){ return inc>0 ? fmtPct((inc-exp)/inc*100) : '—'; },

  /* ---- prelievi contanti = somma dei trasferimenti in ENTRATA verso il portafoglio CONTANTI (E BUONI) ---- */
  isCashWallet(wallet){ return displayWalletName(wallet||'').toUpperCase().includes('CONTANTI'); },
  hasCashWallet(){ return this.wallets.some(w=>this.isCashWallet(w)); },
  cashWithdrawnIn(ym){
    return this.monthTx(ym).filter(t=>this.isCashWallet(t.wallet) && t.type==='Incoming Transfer' && t.amount>0).reduce((x,t)=>x+t.amount, 0);
  },
  cashWithdrawnYear(year){
    let tot = 0;
    for(let m=1; m<=12; m++) tot += this.cashWithdrawnIn(`${year}-${String(m).padStart(2,'0')}`);
    return tot;
  },
  cashLine(total){
    if(!this.hasCashWallet()) return '';
    return `<div class="stat-sub" title="Somma dei trasferimenti in entrata verso il portafoglio Contanti e Buoni">Prelievi contanti totali: <strong class="mono">${fmtEUR.format(total)}</strong></div>`;
  },
  monthLabelsHTML(s){
    const txs = s.expenseCats.flatMap(c=>c.txs);
    const list = this.labelTotals(txs).sort((a,b)=>b.total-a.total);
    if(!list.length) return '<div class="stat-sub" style="padding:10px 2px;">Nessuna uscita etichettata questo mese.</div>';
    return list.map(l=>{
      const pct = s.totalExpense ? l.total/s.totalExpense*100 : 0;
      return `<div class="ledger-row expense"><span class="ledger-name">${this.esc(l.label)}</span><span class="ledger-leader"></span><span class="ledger-pct">${pct.toFixed(0)}%</span><span class="ledger-amt">−${fmtEUR.format(l.total)}</span></div>`;
    }).join('') + `<div class="label-note" style="padding-left:2px;">Un movimento con più etichette viene conteggiato per intero in ciascuna: le percentuali non sommano necessariamente al 100%.</div>`;
  },

  /* ---- lista movimenti ---- */
  txRowHTML(t, full){
    const lab = t.labels.map(l=>labelName(l)).join(', ');
    const meta = [full && t.category ? t.category.name : '', full && t.type!=='Expense' && t.type!=='Income' ? t.type : '', displayWalletName(t.wallet||''), lab].filter(Boolean).map(x=>this.esc(x)).join(' · ');
    return `<div class="tx-row"><span class="tx-date mono">${fmtDateIT(t.dateStr)}</span><span class="tx-note">${this.esc(t.note||'—')}${t.manual?' <em>(manuale)</em>':''}<span class="stat-sub" style="display:block;">${meta}</span></span><span class="tx-amt mono ${t.amount<0?'neg':'pos'}">${t.amount<0?'−':'+'}${fmtEUR.format(Math.abs(t.amount))}</span></div>`;
  },
  txListHTML(txs){
    return `<div class="tx-list">${txs.slice().sort((a,b)=>b.date-a.date).map(t=>this.txRowHTML(t,false)).join('')}</div>`;
  },
  txResultsHTML(ym, q){
    const s = (q||'').trim().toLowerCase();
    let list = this.monthTx(ym).slice().sort((a,b)=>b.date-a.date);
    if(s) list = list.filter(t=>[t.note, t.category?t.category.name:'', t.wallet||'', t.type, t.labels.map(l=>labelName(l)).join(' '), Math.abs(t.amount).toFixed(2), Math.abs(t.amount).toFixed(2).replace('.',',')].join(' ').toLowerCase().includes(s));
    if(!list.length) return '<div class="stat-sub" style="padding:6px 2px;">Nessun movimento trovato.</div>';
    const head = list.length>300 ? `<div class="stat-sub">Mostrati 300 di ${list.length}: restringi la ricerca.</div>` : (s ? `<div class="stat-sub">${list.length} risultati</div>` : '');
    return head + list.slice(0,300).map(t=>this.txRowHTML(t,true)).join('');
  },
  filterTx(ym, q){ const el = document.getElementById('tx-results'); if(el) el.innerHTML = this.txResultsHTML(ym, q); },

  /* ---- rendimento annualizzato (XIRR) sui flussi verso/da Scalable ---- */
  xirr(){
    const w = this.findWalletByKeyword('SCALABLE'); if(!w) return null;
    const flows = this.transactions.filter(t=>t.wallet===w && (t.type==='Incoming Transfer'||t.type==='Outgoing Transfer')).map(t=>({ d:t.date.getTime(), a:-t.amount }));
    const V = this.investments.reduce((x,i)=>x+i.currentValue,0);
    if(!flows.length || !(V>0) || !flows.some(f=>f.a<0)) return null;
    const t0 = Math.min(...flows.map(f=>f.d));
    if(Date.now()-t0 < 90*864e5) return null; // sotto ~3 mesi annualizzare non ha senso
    flows.push({ d:Date.now(), a:V });
    const npv = (rate)=> flows.reduce((x,f)=> x + f.a/Math.pow(1+rate, (f.d-t0)/31557600000), 0);
    let lo = -0.99, hi = 10;
    if(npv(lo)*npv(hi) > 0) return null;
    for(let i=0;i<100;i++){ const m = (lo+hi)/2; if(npv(lo)*npv(m) <= 0) hi = m; else lo = m; }
    return (lo+hi)/2*100;
  },
  xirrHTML(){
    const x = this.xirr();
    return x===null ? '' : ` · <span title="Rendimento annualizzato (XIRR) calcolato sui trasferimenti verso/da Scalable e sul valore attuale degli ETF">Annualizzato <strong>${fmtPct(x)}</strong></span>`;
  },

  exportBackup(){
    const payload = this.buildPayload();
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const now = new Date();
    const dd = String(now.getDate()).padStart(2,'0');
    const mm = String(now.getMonth()+1).padStart(2,'0');
    const yy = String(now.getFullYear()).slice(-2);
    const stamp = `${dd}.${mm}.${yy}`;
    const fileName = `BackupPatrimonio_${APP_VERSION}_${stamp}.json`;
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    this.backupMeta.exportName = fileName;
    this.backupMeta.exportDate = `${now.getFullYear()}-${mm}-${dd}`;
    this.saveBackupMeta();
    if(this.route.page==='import') this.renderImport(); // aggiorna subito le info mostrate nella sezione Backup
    this.showToast('Backup scaricato.');
  },

  askConfirm(message, okLabel, onOk, title){
    // modale interno alla pagina: a differenza di confirm() del browser non puo' essere bloccato
    // ("impedisci altre finestre di dialogo", anteprime/iframe), quindi la conferma compare sempre
    const old = document.getElementById('confirm-modal'); if(old) old.remove();
    const ov = document.createElement('div');
    ov.className = 'modal-overlay'; ov.id = 'confirm-modal';
    ov.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h3 class="modal-title" id="confirm-title">${this.esc(title||'Conferma')}</h3>
      <p class="modal-msg">${this.esc(message)}</p>
      <div class="modal-actions">
        <button class="btn ghost small" data-act="no">Annulla</button>
        <button class="btn small" data-act="yes">${this.esc(okLabel||'Conferma')}</button>
      </div></div>`;
    const close = ()=>{ ov.remove(); document.removeEventListener('keydown', onKey, true); };
    const onKey = (e)=>{ if(e.key==='Escape') close(); };
    ov.addEventListener('click', (e)=>{
      if(e.target===ov){ close(); return; }
      const b = e.target.closest('button[data-act]'); if(!b) return;
      const yes = b.dataset.act==='yes';
      close();
      if(yes) onOk();
    });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(ov);
    const yesBtn = ov.querySelector('[data-act="yes"]'); if(yesBtn) yesBtn.focus();
  },

  /* ---------------- CSV IMPORT ---------------- */
  handleFiles(fileList, mode){
    const files = Array.from(fileList);
    if(!files.length) return;
    let remaining = files.length;
    const allRows = [];
    files.forEach(file=>{
      Papa.parse(file, {
        header:true,
        skipEmptyLines:true,
        complete: (res)=>{
          allRows.push(...res.data);
          remaining--;
          if(remaining===0) this.finishImport(allRows, files.map(f=>f.name), mode);
        },
        error: ()=>{
          remaining--;
          if(remaining===0) this.finishImport(allRows, files.map(f=>f.name), mode);
        }
      });
    });
  },

  txKey(t){
    // chiave univoca per riconoscere lo stesso movimento tra import diversi
    const catKey = t.category ? `${t.category.code}|${t.category.name}` : '—';
    return [t.date.toISOString(), t.wallet, t.type, catKey, t.amount.toFixed(2), t.note].join('::');
  },

  finishImport(rows, fileNames, mode){
    const parsed = [];
    rows.forEach(row=>{
      if(!row || !row.Date || !row.Wallet) return;
      const rawDate = String(row.Date).trim(); const d = new Date(rawDate); const dm = /^(\d{4})-(\d{2})-(\d{2})/.exec(rawDate); const dateStr = dm ? dm[0] : (isNaN(d.getTime()) ? '' : localYmd(d));
      if(isNaN(d.getTime())) return;
      const amount = parseFloat(row.Amount);
      if(isNaN(amount)) return;
      const labelsRaw = (row.Labels||'').trim();
      const labels = labelsRaw ? labelsRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
      parsed.push({
        date: d,
        dateStr,
        ym: dateStr.slice(0,7),
        wallet: (row.Wallet||'').trim(),
        type: (row.Type||'').trim(),
        category: parseCategory(row['Category name']),
        amount: amount,
        note: (row.Note||'').trim(),
        labels: labels
      });
    });
    if(!parsed.length){
      this.showToast('Nessuna transazione valida trovata nei file caricati.');
      return;
    }

    const prevKeys = new Set(this.transactions.map(t=>this.txKey(t)));
    let addedCount, skippedCount;
    if(mode === 'replace'){
      const keptManual = this.transactions.filter(t=>t.manual); // i movimenti manuali non fanno parte del CSV: li preservo sempre
      this.transactions = [...parsed, ...keptManual];
      addedCount = parsed.length;
      skippedCount = 0;
    } else {
      const map = new Map();
      this.transactions.forEach(t => map.set(this.txKey(t), t));
      addedCount = 0; skippedCount = 0;
      parsed.forEach(t=>{
        const k = this.txKey(t);
        if(map.has(k)){ skippedCount++; }
        else { map.set(k, t); addedCount++; }
      });
      this.transactions = Array.from(map.values());
    }

    this.transactions.sort((a,b)=> a.date-b.date);
    this.wallets = Array.from(new Set(this.transactions.filter(t=>!t.manual).map(t=>t.wallet))).sort();
    this.wallets.forEach(w=>{
      if(!(w in this.openingBalances)) this.openingBalances[w] = 0;
      if(!(w in this.operational)) this.operational[w] = this.guessOperational(w);
    });
    const matchedPlanned = this.reconcilePlannedPayments();
    const newPending = this.collectScalableTransfers(prevKeys);
    const nProp = this.pendingProposals().length;
    const scalableNote = (newPending ? ` ${newPending} ${newPending===1?'trasferimento':'trasferimenti'} verso Scalable da confermare.` : '') + (nProp ? ` ${nProp} ${nProp===1?'abbinamento':'abbinamenti'} di pagamenti previsti da confermare.` : '');
    this.lastCsvImport = { at: new Date().toISOString(), files: fileNames, mode, added: addedCount, skipped: skippedCount };
    this.saveData();
    this.renderSidebar();
    this.navigate(newPending ? 'invreview' : 'home');
    if(mode === 'replace'){
      const keptManual = this.transactions.filter(t=>t.manual).length;
      this.showToast(`Dati sostituiti: ${addedCount} movimenti caricati da ${fileNames.length} file.${keptManual?` ${keptManual} movimenti manuali mantenuti.`:''}${matchedPlanned?` ${matchedPlanned} pagamenti previsti segnati come pagati.`:''}${scalableNote}`);
    } else {
      this.showToast(`Aggiunti ${addedCount} nuovi movimenti${skippedCount ? ` (${skippedCount} già presenti, ignorati)` : ''}.${matchedPlanned?` ${matchedPlanned} pagamenti previsti segnati come pagati.`:''}${scalableNote}`);
    }
  },

  /* ---------------- COMPUTATIONS ---------------- */
  /* ---------------- WALLET OPERATIVI vs RISPARMIO ---------------- */
  guessOperational(wallet){
    const norm = wallet.toUpperCase();
    const keywords = ['BBVA','REVOLUT','CONTANTI','BUON'];
    return keywords.some(k=> norm.includes(k));
  },
  isOperational(wallet){
    return this.operational[wallet] !== false;
  },
  setOperational(wallet, checked){
    this.operational[wallet] = checked;
    this.saveData();
    this.renderImport();
    this.showToast('Preferenza portafoglio aggiornata.');
  },
  isIncludedInTotal(wallet){
    return this.totalIncludedWallets[wallet] !== false;
  },
  setTotalIncluded(wallet, checked){
    this.totalIncludedWallets[wallet] = checked;
    this.saveData();
    this.render();
  },
  setTotalIncludedOperational(checked){
    // i portafogli operativi si abilitano/disabilitano tutti insieme, come un unico gruppo
    this.wallets.filter(w=>this.isOperational(w)).forEach(w=> this.totalIncludedWallets[w] = checked);
    this.saveData();
    this.render();
  },
  isInvestmentWallet(wallet){
    // portafogli di investimento (es. Scalable, Fondapi): mostrati in una sezione separata da quelli liquidi
    const name = displayWalletName(wallet).toUpperCase();
    return ['SCALABLE','FONDAPI'].some(k => name.includes(k));
  },
  investedWalletStats(wallet){
    // Investito netto = trasferimenti in entrata/uscita (+ per Fondapi anche le entrate con categoria TFR, che li' non sempre passano come transfer)
    // Interessi generati = somma netta (entrate - uscite) della categoria "Interessi", meno le uscite con categoria "Tasse", su tutto lo storico del portafoglio, esclusi dall'investito
    const isFondapi = displayWalletName(wallet).toUpperCase().includes('FONDAPI');
    const txs = this.transactions.filter(t=>t.wallet===wallet);
    const transferNet = txs.filter(t=> t.type==='Incoming Transfer' || t.type==='Outgoing Transfer').reduce((s,t)=>s+t.amount,0);
    const tfrNet = isFondapi ? txs.filter(t=> t.type==='Income' && t.category && t.category.name.trim().toUpperCase()==='TFR').reduce((s,t)=>s+t.amount,0) : 0;
    const invested = transferNet + tfrNet;
    const interestGross = txs.filter(t=> t.category && t.category.name.trim().toUpperCase()==='INTERESSI' && (t.type==='Income'||t.type==='Expense')).reduce((s,t)=>s+t.amount,0);
    const taxesNet = txs.filter(t=> t.category && t.category.name.trim().toUpperCase()==='TASSE' && (t.type==='Income'||t.type==='Expense')).reduce((s,t)=>s+t.amount,0);
    const interest = interestGross + taxesNet; // le tasse sono uscite (importo negativo): sommarle equivale a sottrarle
    return { invested, interest, taxes: taxesNet };
  },

  grossInvestedScalable(){
    // stesso valore mostrato come "Investito" nella card Scalable in Panoramica (lordo, prima delle commissioni)
    const w = this.findWalletByKeyword('SCALABLE');
    return w ? this.investedWalletStats(w).invested : null;
  },

  orderedWallets(){
    // ordina i portafogli secondo WALLET_ORDER (per parola chiave contenuta nel nome, senza emoji);
    // quelli non riconosciuti restano in fondo, in ordine alfabetico
    const priority = (w) => {
      const name = displayWalletName(w).toUpperCase();
      const idx = this.WALLET_ORDER.findIndex(k => name.includes(k));
      return idx === -1 ? this.WALLET_ORDER.length : idx;
    };
    return [...this.wallets].sort((a,b)=>{
      const pa = priority(a), pb = priority(b);
      if(pa !== pb) return pa - pb;
      return a.localeCompare(b);
    });
  },

  walletBalance(wallet){
    const open = this.openingBalances[wallet] || 0;
    const sum = this.idx().walletSum.get(wallet) || 0;
    return open + sum;
  },

  totalPatrimonio(){
    return this.wallets.filter(w=>this.isIncludedInTotal(w)).reduce((s,w)=> s + this.walletBalance(w), 0);
  },

  periodCutoffDate(key){
    // data di riferimento per il confronto "prima" del periodo scelto; null per 'all' (si usa il saldo di apertura, non una data)
    const now = this.transactions.length ? this.transactions[this.transactions.length-1].date : new Date();
    if(key==='all') return null;
    if(key==='90d'){ const d = new Date(now); d.setDate(d.getDate()-90); return d; }
    if(key==='ytd') return new Date(Date.UTC(now.getFullYear(),0,1,23,59,59,999)); // fine del 1 gennaio: include i movimenti datati 1 gennaio (es. i saldi di partenza inseriti nel CSV)
    const d = new Date(now); d.setDate(d.getDate()-30); return d;
  },
  periodShortLabel(key){
    return { '30d':'30gg', '90d':'90gg', 'ytd':'da inizio anno', 'all':'da sempre' }[key] || '30gg';
  },
  walletBalanceBeforePeriod(wallet, key){
    const cutoff = this.periodCutoffDate(key);
    return cutoff===null ? (this.openingBalances[wallet]||0) : this.walletBalanceAt(wallet, cutoff);
  },
  totalPeriodDelta(key){
    // confronta il Patrimonio totale attuale con quello a inizio periodo; 'all' usa i saldi di apertura (inizio di tutto lo storico)
    const total = this.totalPatrimonio();
    const included = this.wallets.filter(w=>this.isIncludedInTotal(w));
    const base = included.reduce((s,w)=> s + this.walletBalanceBeforePeriod(w, key), 0);
    const delta = total - base;
    // con base vicina a zero (saldi di apertura non impostati, o storico troppo corto) la % non ha senso: null invece di un fuorviante 0%
    const pct = Math.abs(base) >= 0.005 ? (delta/Math.abs(base))*100 : null;
    return { total, base, delta, pct };
  },
  setTotalPeriod(value){
    this.totalPeriod = value;
    this.render();
  },
  walletBalanceAt(wallet, cutoffDate){
    const open = this.openingBalances[wallet] || 0;
    const sum = (this.idx().byWallet.get(wallet)||[]).filter(t=>t.date<=cutoffDate).reduce((s,t)=>s+t.amount,0);
    return open + sum;
  },

  /* ---------------- OBIETTIVI DI RISPARMIO (Portafoglio Operativo virtuale + Fondo Emergenza) ---------------- */
  findWalletByKeyword(keyword){
    return this.wallets.find(w => displayWalletName(w).toUpperCase().includes(keyword));
  },
  operationalWalletTotal(){
    return this.wallets.filter(w=>this.isOperational(w)).reduce((s,w)=> s + this.walletBalance(w), 0);
  },
  operationalWalletTotalBeforePeriod(key){
    return this.wallets.filter(w=>this.isOperational(w)).reduce((s,w)=> s + this.walletBalanceBeforePeriod(w, key), 0);
  },
  operationalWalletTotalAt(cutoffDate){
    return this.wallets.filter(w=>this.isOperational(w)).reduce((s,w)=> s + this.walletBalanceAt(w, cutoffDate), 0);
  },
  rollingMonths(windowSize){
    // ultimi N mesi (calendario) fino a quello in corso incluso, solo quelli con movimenti nei portafogli OPERATIVI
    // (un mese con soli movimenti in un portafoglio di risparmio, es. il Fondo Emergenza, non deve diluire la media)
    const nowYm = todayYm();
    const startYm = addMonthsToYm(nowYm, -(windowSize-1));
    const opMonths = new Set(this.transactions.filter(t=>this.isOperational(t.wallet)).map(t=>t.ym));
    return Array.from(opMonths).filter(ym => ym>=startYm && ym<=nowYm).sort();
  },
  rollingAvgExpense(windowSize){
    const months = this.avgMonths(windowSize, true); // solo mesi completati (come riepilogo annuo): il mese in corso e' parziale
    if(!months.length) return { avg:0, hasData:false, monthsUsed:0 };
    const total = months.reduce((s,ym)=> s + this.monthSummary(ym).totalExpense, 0);
    return { avg: total/months.length, hasData:true, monthsUsed: months.length };
  },
  rollingAvgExpenseByLabel(windowSize, label){
    const months = this.avgMonths(windowSize, true); // solo mesi completati
    if(!months.length) return { avg:0, hasData:false, monthsUsed:0 };
    let total = 0;
    months.forEach(ym=>{
      const txs = this.monthTx(ym).filter(t=> this.isOperational(t.wallet) && t.type==='Expense');
      const entry = this.labelTotals(txs).find(l=>l.label===label);
      if(entry) total += entry.total;
    });
    return { avg: total/months.length, hasData:true, monthsUsed: months.length };
  },
  setTargetMonths(key, value){
    const n = Math.max(0, this.parseNum(value));
    this[key] = n;
    this.saveData();
    this.render();
  },

  /* ---------------- STIMA LIQUIDITA' 12 MESI (netta, con impegni previsti) ---------------- */
  avgMonths(windowSize, completedOnly){
    // mesi su cui calcolare le medie; con completedOnly il mese in corso (ancora parziale) e' escluso
    if(!completedOnly) return this.rollingMonths(windowSize);
    const nowYm = todayYm();
    return this.rollingMonths(windowSize+1).filter(ym=> ym<nowYm);
  },
  rollingAvgIncome(windowSize, completedOnly){
    const months = this.avgMonths(windowSize, completedOnly);
    if(!months.length) return { avg:0, hasData:false, monthsUsed:0 };
    const total = months.reduce((s,ym)=> s + this.monthSummary(ym).totalIncome, 0);
    return { avg: total/months.length, hasData:true, monthsUsed: months.length };
  },
  recurringSeries(){
    // una voce per serie ricorrente attiva: categoria, importo attuale, frequenza e (per le annuali) mese di scadenza
    const bySeries = new Map();
    Object.keys(this.plannedPayments).sort().forEach(ym=>{
      (this.plannedPayments[ym]||[]).forEach(p=>{
        if(!p.recurrence || !p.category || !p.seriesId) return;
        bySeries.set(p.seriesId, { cat:p.category.trim().toLowerCase(), amount:Math.abs(p.amount)||0, recurrence:p.recurrence, month:ym.split('-')[1] }); // l'ultima occorrenza vince: ha l'importo piu' recente
      });
    });
    return Array.from(bySeries.values());
  },
  variableExpenseOfMonth(ym, series){
    // spesa "libera" di un mese: per ogni categoria si toglie SOLO la quota coperta da un pagamento ricorrente previsto
    // (importo della serie, al massimo quanto speso davvero); l'eccedenza resta
    const mm = ym.split('-')[1];
    const spendByCat = new Map();
    this.monthTx(ym).filter(t=> this.isOperational(t.wallet) && t.type==='Expense').forEach(t=>{
      const c = (t.category ? t.category.name : '').trim().toLowerCase();
      spendByCat.set(c, (spendByCat.get(c)||0) + Math.abs(t.amount));
    });
    const fixedByCat = new Map();
    series.forEach(sr=>{
      if(sr.recurrence==='yearly' && sr.month!==mm) return;
      fixedByCat.set(sr.cat, (fixedByCat.get(sr.cat)||0) + sr.amount);
    });
    let total = 0;
    spendByCat.forEach((spent, c)=>{ total += spent - Math.min(spent, fixedByCat.get(c)||0); });
    return total;
  },
  rollingAvgVariableExpense(windowSize, completedOnly){
    const months = this.avgMonths(windowSize, completedOnly);
    if(!months.length) return { avg:0, hasData:false, monthsUsed:0 };
    const series = this.recurringSeries();
    const total = months.reduce((s,ym)=> s + this.variableExpenseOfMonth(ym, series), 0);
    return { avg: total/months.length, hasData:true, monthsUsed: months.length };
  },
  liquidityForecast(){
    const WINDOW = 12; // mesi di storico usati per le medie mobili
    const HORIZON = 12; // mesi futuri da proiettare
    const varExp = this.rollingAvgVariableExpense(WINDOW, true); // solo mesi completati: il mese in corso e' parziale e falserebbe la media
    const avgInc = this.rollingAvgIncome(WINDOW, true);
    const hasData = varExp.hasData && avgInc.hasData;
    const netBaseline = varExp.avg - avgInc.avg; // fabbisogno "di fondo" mensile, prima degli impegni fissi del mese
    const opStart = this.operationalWalletTotal();
    const fondoWallet = this.findWalletByKeyword('FONDO EMERGENZA');
    const fondoStart = fondoWallet ? this.walletBalance(fondoWallet) : 0;
    const combinedStart = opStart + fondoStart;
    if(!hasData){
      return { hasData:false, monthsUsed: Math.min(varExp.monthsUsed, avgInc.monthsUsed), varExp, avgInc, netBaseline, opStart, fondoStart, combinedStart, rows:[], total12:0, projectedOp:opStart, projectedCombined:combinedStart };
    }
    const nowYm = todayYm();
    // mese in corso: quanto gia' speso/incassato e' nel saldo attuale, quindi conta solo il residuo rispetto alla media
    // (se hai gia' speso piu' della media il residuo di spesa e' 0; se hai gia' incassato piu' della media il residuo di entrata e' 0)
    const spentNow = this.variableExpenseOfMonth(nowYm, this.recurringSeries());
    const incomeNow = this.monthSummary(nowYm).totalIncome;
    const baseNow = Math.max(0, varExp.avg - spentNow) - Math.max(0, avgInc.avg - incomeNow);
    let runOp = opStart, runCombined = combinedStart, cur = nowYm, total12 = 0;
    const pac = Math.max(0, this.investAmount||0); // PAC mensile = campo INVESTI € della pagina Investimenti
    const pacDone = this.transactions.filter(t=>t.ym===nowYm && this.isScalableWallet(t.wallet) && t.type==='Incoming Transfer').reduce((x,t)=>x+t.amount,0);
    const pacNow = Math.max(0, pac - pacDone); // nel mese in corso conta solo la parte non ancora versata
    const rows = [];
    for(let i=0;i<HORIZON;i++){
      const planned = this.monthPlannedTotal(cur); // impegni fissi non pagati previsti per questo mese specifico
      const pacM = i===0 ? pacNow : pac;
      const need = (i===0 ? baseNow : netBaseline) + planned + pacM;
      runOp -= need; runCombined -= need; total12 += need;
      rows.push({ ym:cur, planned, pac:pacM, need, runOp, runCombined, partial: i===0 });
      cur = addMonthsToYm(cur,1);
    }
    return { hasData:true, monthsUsed: Math.min(varExp.monthsUsed, avgInc.monthsUsed), varExp, avgInc, netBaseline, opStart, fondoStart, combinedStart, rows, total12, projectedOp: runOp, projectedCombined: runCombined };
  },
  mountLiquidityChart(){
    const lf = this.liquidityForecast();
    if(!lf.hasData || !lf.rows.length) return;
    this.mountChart('liquidity', 'chart-liquidity', {
      type:'line',
      data:{
        labels: lf.rows.map(r=>this.monthLabelShort(r.ym)),
        datasets:[
          { label:'Operativo', data: lf.rows.map(r=>r.runOp), borderColor:'#963C31', backgroundColor:'rgba(150,60,49,0.08)', fill:false, tension:0.2, pointRadius:2, borderWidth:2.5 },
          { label:'Operativo + Fondo Emergenza', data: lf.rows.map(r=>r.runCombined), borderColor:'#5F7A67', backgroundColor:'rgba(95,122,103,0.1)', fill:true, tension:0.2, pointRadius:2, borderWidth:2.5 },
          { label:'Soglia zero', data: new Array(lf.rows.length).fill(0), borderColor:'#4A443A', borderDash:[5,4], borderWidth:1.25, pointRadius:0, fill:false }
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{ position:'top', labels:{ color:'#4A443A', font:{family:'Inter',size:11.5}, boxWidth:12 } },
          tooltip:{ callbacks:{ label:(c)=> `${c.dataset.label}: ${fmtEUR.format(c.parsed.y)}` } }
        },

        }
      }
    });
  },

  patrimonioSeries(){
    // punto per ogni giorno con movimenti: totale patrimonio a fine giornata (valore cumulato)
    if(!this.transactions.length) return [];
    const running = {};
    const inc = new Set(this.wallets.filter(w=>this.isIncludedInTotal(w))); let total = 0; inc.forEach(w=>{ total += this.openingBalances[w]||0; });
    const byDay = new Map(); // dateStr -> running snapshot after that day's txs
    const sorted = [...this.transactions].sort((a,b)=>a.date-b.date);
    sorted.forEach(t=>{
      if(inc.has(t.wallet)) total += t.amount;
      
      byDay.set(t.dateStr, total);
    });
    return Array.from(byDay.entries()).map(([dateStr,total])=>({dateStr,total}));
  },
  patrimonioSeriesForPeriod(key){
    const full = this.patrimonioSeries();
    if(key==='all' || !full.length) return full;
    const cutoff = this.periodCutoffDate(key);
    if(!cutoff) return full;
    const cutoffStr = cutoff.toISOString().slice(0,10);
    const filtered = full.filter(p=> p.dateStr >= cutoffStr);
    // ancoro il primo punto al saldo di inizio periodo (lo stesso usato per la % nella card Patrimonio totale),
    // cosi' il grafico parte dallo stesso riferimento anche se quel giorno non ha movimenti propri
    if(!filtered.length || filtered[0].dateStr !== cutoffStr){
      filtered.unshift({ dateStr: cutoffStr, total: this.totalPeriodDelta(key).base });
    }
    return filtered;
  },

  getMonths(){
    const set = this.idx().byYm.keys();
    return Array.from(set).sort().reverse();
  },

  allMonths(){
    // lista continua e cronologica (ascendente) di mesi: dal primo mese con dati (o oggi) fino ad almeno 12 mesi nel futuro, senza buchi
    const nowYm = todayYm();
    const dataMonths = this.getMonths();
    let minYm = dataMonths.length ? dataMonths[dataMonths.length-1] : nowYm;
    let maxYm = dataMonths.length ? dataMonths[0] : nowYm;
    if(minYm > nowYm) minYm = nowYm;
    const horizon = addMonthsToYm(nowYm, 12);
    if(horizon > maxYm) maxYm = horizon;
    const out = [];
    let cur = minYm, guard = 0;
    while(cur <= maxYm && guard < 400){ out.push(cur); cur = addMonthsToYm(cur,1); guard++; }
    return out; // ascendente
  },

  monthHasActivity(ym){ return this.monthTx(ym).length > 0; },
  monthPlanned(ym){ return this.plannedPayments[ym] || []; },
  monthPlannedTotal(ym){ return this.monthPlanned(ym).filter(p=>!p.paid).reduce((s,p)=>s+p.amount,0); },
  monthPlannedPaidTotal(ym){ return this.monthPlanned(ym).filter(p=>p.paid).reduce((s,p)=>s+p.amount,0); },

  addPlanned(ym){
    if(!this.plannedPayments[ym]) this.plannedPayments[ym] = [];
    this.plannedPayments[ym].push({ id: uid(), seriesId:null, recurrence:null, name:'Nuovo pagamento', category:'', amount:0, paid:false, paidDate:null, approx:false });
    this.saveData();
    this.render();
  },
  updatePlanned(ym, id, field, value){
    const item = (this.plannedPayments[ym]||[]).find(p=>p.id===id);
    if(!item) return;
    item[field] = field==='amount' ? this.parseNum(value) : value;
    if(field!=='paid'){ item.paid = false; item.paidDate = null; item.paidKey = null; item.paidAmount = null; item.proposal = null; } // un valore modificato a mano non è più un match automatico verificato
    if(item.recurrence && (field==='name' || field==='category' || field==='amount')){
      this.generateForward(item, ym); // propaga la modifica alle occorrenze future già generate
    }
    this.saveData();
    this.render();
  },
  togglePlannedPaid(ym, id, checked){
    const item = (this.plannedPayments[ym]||[]).find(p=>p.id===id);
    if(!item) return;
    item.paid = checked;
    if(!checked) item.paidDate = null;
    item.paidKey = null; item.paidAmount = null; item.proposal = null; // spunta manuale: nessun movimento associato
    this.saveData();
    this.render();
  },
  removePlanned(ym, id){
    this.plannedPayments[ym] = (this.plannedPayments[ym]||[]).filter(p=>p.id!==id);
    this.saveData();
    this.render();
  },

  /* ---------------- RICORRENZA PAGAMENTI PREVISTI ---------------- */
  toggleRecurrence(ym, id, newType){
    const item = (this.plannedPayments[ym]||[]).find(p=>p.id===id);
    if(!item) return;
    if(!item.seriesId) item.seriesId = uid();
    item.recurrence = newType; // 'monthly' | 'yearly' | null
    this.pruneFutureSeries(item.seriesId, ym, newType);
    if(newType) this.generateForward(item, ym);
    this.saveData();
    this.render();
  },
  pruneFutureSeries(seriesId, originYm, newType){
    // rimuove dai mesi futuri le occorrenze non pagate della serie che non rispettano più il criterio scelto
    Object.keys(this.plannedPayments).forEach(ym=>{
      if(ym<=originYm) return;
      this.plannedPayments[ym] = (this.plannedPayments[ym]||[]).filter(p=>{
        if(p.seriesId!==seriesId || p.paid) return true;
        if(!newType) return false;
        if(newType==='monthly') return true;
        const om = originYm.split('-')[1], tm = ym.split('-')[1];
        return tm===om;
      });
    });
  },
  generateForward(item, fromYm){
    // crea/aggiorna le occorrenze future della serie fino all'orizzonte visibile (allMonths)
    if(!item.recurrence) return;
    const om = fromYm.split('-')[1];
    this.allMonths().forEach(ym=>{
      if(ym<=fromYm) return;
      const include = item.recurrence==='monthly' ? true : (ym.split('-')[1]===om);
      if(!include) return;
      if(!this.plannedPayments[ym]) this.plannedPayments[ym] = [];
      const existing = this.plannedPayments[ym].find(p=>p.seriesId===item.seriesId);
      if(existing){
        if(!existing.paid){ existing.name=item.name; existing.category=item.category; existing.amount=item.amount; existing.recurrence=item.recurrence; existing.approx=!!item.approx; }
      }else{
        this.plannedPayments[ym].push({ id:uid(), seriesId:item.seriesId, recurrence:item.recurrence, name:item.name, category:item.category, amount:item.amount, paid:false, paidDate:null, approx:!!item.approx });
      }
    });
  },
  syncAllRecurrences(){
    Object.keys(this.plannedPayments).forEach(ym=>{
      (this.plannedPayments[ym]||[]).forEach(item=>{
        if(item.recurrence) this.generateForward(item, ym);
      });
    });
  },

  knownCategories(){
    const set = new Set();
    this.transactions.forEach(t=>{ if(t.category && t.type==='Expense') set.add(t.category.name); });
    return Array.from(set).sort();
  },
  knownIncomeCategories(){
    const set = new Set();
    this.transactions.forEach(t=>{ if(t.category && t.type==='Income') set.add(t.category.name); });
    return Array.from(set).sort();
  },

  /* ---------------- MOVIMENTI MANUALI (recupero dati mancanti dal CSV) ---------------- */
  canAddManual(ym){
    // consentito solo nei mesi passati (non il mese in corso, non futuri) che hanno già dei movimenti importati
    return ym < todayYm() && this.monthHasActivity(ym);
  },
  monthManualTx(ym){
    return this.transactions.filter(t=>t.manual && t.ym===ym).sort((a,b)=>a.date-b.date);
  },
  addManualTransaction(ym){

    const dateStr = `${ym}-01`;
    this.transactions.push({
      id: uid(), manual: true,
      date: new Date(dateStr+'T00:00:00.000Z'), dateStr, ym,
      wallet: null, type:'Expense', category: null, amount: 0, note:'', labels: []
    });
    this.transactions.sort((a,b)=>a.date-b.date);
    this.saveData();
    this.render();
  },
  updateManualCategory(id, value){
    const t = this.transactions.find(x=>x.id===id);
    if(!t) return;
    const name = value.trim();
    t.category = name ? { code:null, name, numbered:false } : null;

    this.render();
  },
  updateManualField(id, field, value){
    const t = this.transactions.find(x=>x.id===id);
    if(!t) return;
    if(field==='amount'){
      const abs = Math.abs(this.parseNum(value));
      t.amount = t.type==='Expense' ? -abs : abs;
    } else if(field==='type'){
      t.type = value;
      t.amount = value==='Expense' ? -Math.abs(t.amount) : Math.abs(t.amount);
    } else if(field==='note'){
      t.note = value;
    }
    this.saveData();
    this.render();
  },
  toggleManualLabel(id, label, checked){
    const t = this.transactions.find(x=>x.id===id);
    if(!t) return;
    if(checked){ if(!t.labels.includes(label)) t.labels.push(label); }
    else { t.labels = t.labels.filter(l=>l!==label); }
    this.saveData();
    this.render();
  },
  removeManualTransaction(id){
    this.transactions = this.transactions.filter(t=>t.id!==id);
    this.saveData();
    this.render();
  },

  setPlannedApprox(ym, id, checked){
    const item = (this.plannedPayments[ym]||[]).find(p=>p.id===id);
    if(!item) return;
    item.approx = checked;
    if(item.recurrence) this.generateForward(item, ym); // il flag vale per tutta la serie
    const n = this.reconcilePlannedPayments(); // riapplico subito: un movimento gia' importato puo' essere abbinato adesso
    this.saveData();
    this.render();
    if(n) this.showToast(`${n} ${n===1?'pagamento previsto segnato':'pagamenti previsti segnati'} come pagato.`);
  },
  setMatchParam(key, value){
    const v = Math.min(100, Math.max(0, parseFloat(String(value).replace(',','.')) || 0));
    this[key] = v;
    const n = this.reconcilePlannedPayments(); // riapplico subito con la nuova soglia
    this.saveData();
    this.renderImport();
    this.showToast(n ? `Soglia aggiornata: ${n} ${n===1?'pagamento previsto segnato':'pagamenti previsti segnati'} come pagato.` : 'Soglia aggiornata.');
  },
  pendingProposals(){
    const out = [];
    Object.keys(this.plannedPayments).sort().forEach(ym=>{
      (this.plannedPayments[ym]||[]).forEach(p=>{ if(!p.paid && p.proposal) out.push({ ym, item:p }); });
    });
    return out;
  },
  acceptProposal(ym, id, updateAmount){
    const p = (this.plannedPayments[ym]||[]).find(x=>x.id===id);
    if(!p || !p.proposal) return;
    const pr = p.proposal;
    p.paid = true; p.paidDate = pr.dateStr; p.paidKey = pr.key; p.paidAmount = pr.amount; p.proposal = null;
    if(updateAmount && p.recurrence){ p.amount = pr.amount; this.generateForward(p, ym); } // aggiorna l'importo anche nelle occorrenze future
    this.saveData();
    this.render();
  },
  dismissProposal(ym, id){
    const p = (this.plannedPayments[ym]||[]).find(x=>x.id===id);
    if(!p || !p.proposal) return;
    p.dismissed = [...(p.dismissed||[]), p.proposal.key]; // quel movimento non verra' piu' riproposto per questo pagamento
    p.proposal = null;
    this.saveData();
    this.render();
  },
  reconcilePlannedPayments(){
    // dopo un import: per ogni pagamento previsto non ancora pagato cerca un movimento reale della stessa categoria nello stesso mese.
    // 1) importo identico -> pagato in automatico (per tutti)
    // 2) flag "Circa" -> pagato in automatico se l'importo e' entro la tolleranza
    // 3) altrimenti, se c'e' un movimento della stessa categoria con importo diverso ma non lontano, lo propone (da confermare a mano)
    let matched = 0;
    const tol = this.PLANNED_APPROX_TOL_PCT/100, win = Math.max(this.PLANNED_PROPOSAL_WINDOW_PCT, this.PLANNED_APPROX_TOL_PCT)/100; // la soglia proposte non scende sotto la tolleranza
    Object.keys(this.plannedPayments).forEach(ym=>{
      const items = this.plannedPayments[ym];
      if(!items || !items.length) return;
      items.forEach(p=>{ if(!p.paid) p.proposal = null; }); // le proposte si ricalcolano da zero a ogni passaggio
      const reserved = new Set(items.filter(p=>p.paid && p.paidKey).map(p=>p.paidKey)); // movimenti gia' usati da un pagamento pagato
      const monthTxs = this.transactions
        .filter(t=> t.ym===ym && this.isOperational(t.wallet) && t.type==='Expense')
        .map(t=>({ t, key:this.txKey(t) }))
        .filter(x=> !reserved.has(x.key));
      const used = new Set();
      const catOf = (t)=> t.category ? t.category.name.trim().toLowerCase() : '';
      const markPaid = (p, i)=>{
        const { t, key } = monthTxs[i];
        used.add(i);
        p.paid = true; p.paidDate = t.dateStr; p.paidKey = key; p.paidAmount = Math.abs(t.amount); p.proposal = null;
        matched++;
      };
      const closest = (p)=>{
        const cat = p.category.trim().toLowerCase();
        let best = -1, bestDiff = Infinity;
        monthTxs.forEach((x,i)=>{
          if(used.has(i) || catOf(x.t)!==cat || (p.dismissed||[]).includes(x.key)) return;
          const d = Math.abs(Math.abs(x.t.amount) - Math.abs(p.amount));
          if(d < bestDiff){ best = i; bestDiff = d; }
        });
        return { i:best, diff:bestDiff };
      };
      const pending = items.filter(p=> !p.paid && p.category && p.amount);
      pending.forEach(p=>{ // 1) importo identico
        const c = closest(p);
        if(c.i>-1 && c.diff<0.01) markPaid(p, c.i);
      });
      pending.filter(p=>!p.paid && p.approx).forEach(p=>{ // 2) "Circa": tolleranza automatica
        const c = closest(p);
        if(c.i>-1 && c.diff <= Math.abs(p.amount)*tol) markPaid(p, c.i);
      });
      pending.filter(p=>!p.paid).forEach(p=>{ // 3) proposta da confermare
        const c = closest(p);
        if(c.i>-1 && c.diff <= Math.abs(p.amount)*win){
          const { t, key } = monthTxs[c.i];
          used.add(c.i);
          p.proposal = { amount:Math.abs(t.amount), dateStr:t.dateStr, key };
        }
      });
    });
    return matched;
  },

  futureCommitments(){

    const entries = Object.keys(this.plannedPayments)
      .filter(ym => ym >= nowYm)

      .sort((a,b)=> a.ym.localeCompare(b.ym));

    return { total, entries };
