  /* ---------------- RIEPILOGO ANNUO: grafico + classifica categorie ---------------- */
  compactEUR(v){
    if(!v) return '';
    if(v>=10000) return Math.round(v/1000)+'k';
    if(v>=1000) return (v/1000).toFixed(1).replace('.',',')+'k';
    return String(Math.round(v));
  },
  yearCatTotals(year){
    const mc = this.yearCtx[year].mc;
    return mc.categories.map(c=>({ name:c, total: mc.data[c].reduce((x,v)=>x+v,0) }));
  },
  yearChartSummary(year){
    const { mc, y } = this.yearCtx[year];
    const sel = this.yearSel[year];
    if(!sel) return `Totale uscite ${year}: <strong class="mono">${fmtEUR.format(y.totalExpense)}</strong> · media mensile <strong class="mono">${fmtEUR.format(y.avgExpense)}</strong> · il numero sopra ogni barra è il totale del mese`;
    const cat = y.expenseCats.find(c=>c.name===sel);
    const i = mc.categories.indexOf(sel);
    const st = categoryStyle(sel, i);
    const tot = mc.data[sel].reduce((x,v)=>x+v,0);
    const pct = y.totalExpense ? tot/y.totalExpense*100 : 0;
    return `${st.emoji} <strong>${this.esc(sel)}</strong> · totale <strong class="mono">${fmtEUR.format(tot)}</strong> (${pct.toFixed(0)}% delle uscite) · media mensile <strong class="mono">${fmtEUR.format(cat?cat.avg:0)}</strong> · la linea tratteggiata è la media${this.budgetSummary(year, sel, mc.data[sel])}`;
  },
  yearRankHTML(year){
    const { y } = this.yearCtx[year];
    const sel = this.yearSel[year];
    const list = this.yearCatTotals(year);
    const max = Math.max(...list.map(c=>c.total), 1);
    const grand = list.reduce((x,c)=>x+c.total,0) || 1;
    const avgOf = (name)=>{ const c = y.expenseCats.find(z=>z.name===name); return c ? c.avg : 0; };
    const row = (idx, emoji, name, total, color, barPct, pct, avg)=>`
      <button class="rank-row ${((sel===null||sel===undefined) ? idx===-1 : sel===name) ? 'active' : ''}" aria-pressed="${((sel===null||sel===undefined) ? idx===-1 : sel===name)}" onclick="App.selectYearCat(${year}, ${idx})">
        <span class="rank-name">${emoji} ${this.esc(name)}</span>
        <span class="rank-bar"><span style="width:${barPct}%; background:${color};"></span></span>
        <span class="rank-amt">${fmtEUR0.format(total)}</span>
        <span class="rank-pct">${pct}</span>
        <span class="rank-avg">${avg}</span>
      </button>`;
    return row(-1, '📊', 'Tutte le categorie', grand, '#4A443A', 100, '100%', fmtEUR0.format(y.avgExpense)+'/mese')
      + list.map((c,i)=>{ const st = categoryStyle(c.name, i); return row(i, st.emoji, c.name, c.total, st.color, c.total/max*100, Math.round(c.total/grand*100)+'%', fmtEUR0.format(avgOf(c.name))+'/mese'); }).join('');
  },
  selectYearCat(year, idx){
    const { mc } = this.yearCtx[year];
    const name = idx>=0 ? mc.categories[idx] : null;
    this.yearSel[year] = (name && this.yearSel[year]===name) ? null : name; // secondo click sulla stessa categoria = torna a "tutte"
    const sum = document.getElementById('yc-sum-'+year); if(sum) sum.innerHTML = this.yearChartSummary(year);
    const rank = document.getElementById('rank-'+year); if(rank) rank.innerHTML = this.yearRankHTML(year);
    this.drawYearChart(year);
    const cv = document.getElementById('chart-cat-'+year);
    if(cv) cv.scrollIntoView({ behavior:'smooth', block:'center' });
  },
  avgLabelPlugin: {
    // disegna a canvas, con lo STESSO font, sia il totale sopra ogni mese sia l'etichetta "Media X EUR", appoggiata
    // subito dopo la fine della riga tratteggiata (non piu' lontana nel margine): un unico percorso di disegno
    // evita che i due testi abbiano un font leggermente diverso, come capitava usando anche il plugin datalabels.
    id:'avgLineLabel',
    afterDraw(chart){
      const opt = chart.options.plugins && chart.options.plugins.avgLineLabel;
      if(!opt) return;
      const { ctx, chartArea, scales } = chart;
      const font = opt.font || '600 13px "IBM Plex Mono", monospace';
      ctx.save();
      ctx.font = font;
      ctx.fillStyle = '#211D16';
      if(Array.isArray(opt.monthTotals) && scales.x){
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        opt.monthTotals.forEach((v,i)=>{
          if(!(v>0)) return;
          const x = scales.x.getPixelForValue(i);
          const y = scales.y.getPixelForValue(v) - 8;
          ctx.fillText(App.compactEUR(v), x, y);
        });
      }
      if(opt.value){
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        const lineEndX = scales.x ? scales.x.getPixelForValue(scales.x.ticks.length-1) : chartArea.right;
        ctx.fillText('Media '+fmtEUR0.format(opt.value), lineEndX + 6, scales.y.getPixelForValue(opt.value));
      }
      ctx.restore();
    }
  },
  drawYearChart(year){
    const ctx = this.yearCtx[year]; if(!ctx || !ctx.mc.hasData) return;
    const { mc, y } = ctx;
    const sel = this.yearSel[year] || null;
    const cv = document.getElementById('chart-cat-'+year); if(!cv) return;
    const wrap = cv.closest('.chart-wrap');
    const key = 'cat-'+year;
    if(this.charts[key]){ try{ this.charts[key].destroy(); }catch(e){} delete this.charts[key]; }
    const isNarrow = window.innerWidth <= 860;
    const tickFont = { family:'IBM Plex Mono', size:11 };
    const yScaleBase = { beginAtZero:true, grace:'8%', ticks:{ color:'#211D16', font:tickFont, callback:(v)=>fmtEUR0.format(v) }, grid:{ color:'rgba(33,29,22,0.12)' } };

    if(sel){
      // ---- categoria isolata: un'unica serie mese per mese + linea della media
      if(wrap) wrap.style.height = (isNarrow ? 300 : 360)+'px';
      const st = categoryStyle(sel, mc.categories.indexOf(sel));
      const cat = y.expenseCats.find(c=>c.name===sel);
      const avg = cat ? cat.avg : 0;
      const bud = this.yearBudgetSeries(year, sel), isOver = (i)=> bud[i]!==null && mc.data[sel][i] > bud[i]+0.005;
      this.mountChart(key, 'chart-cat-'+year, {
        type:'bar',
        data:{ labels: MESI_ABBR, datasets:[
          { type:'bar', label:`${st.emoji} ${sel}`, data: mc.data[sel], backgroundColor: st.color, borderColor: mc.data[sel].map((_,i)=> isOver(i) ? '#B3261E' : st.color), borderWidth: mc.data[sel].map((_,i)=> isOver(i) ? 3 : 0), borderRadius:4, categoryPercentage:0.8,
            datalabels:{ display:(c)=> c.dataset.data[c.dataIndex] > 0, anchor:'end', align:'top', clamp:false, color:'#211D16', font:{ family:'IBM Plex Mono', size:11, weight:600 }, formatter:(v)=> this.compactEUR(v) } },
          ...(bud.some(b=>b!==null) ? [{ type:'line', label:'Budget', data:bud, stepped:'middle', borderColor:'#B3261E', borderWidth:2.5, pointRadius:0, fill:false, datalabels:{ display:false } }] : []),
          { type:'line', label:'Media mensile', data: new Array(12).fill(avg), borderColor:'#4A443A', borderDash:[6,4], borderWidth:1.5, pointRadius:0, fill:false,
            datalabels:{ display:false } }
        ]},
        plugins: [App.avgLabelPlugin],
        options:{
          responsive:true, maintainAspectRatio:false, layout:{ padding:{ top:22, right: isNarrow?58:72 } },
          plugins:{
            avgLineLabel:{ value: avg, font:'600 11.5px "IBM Plex Mono", monospace' },
            legend:{ display:false }, tooltip:{ callbacks:{
            title:(items)=> MESI_IT[items[0].dataIndex] + ' ' + year,
            label:(c)=> `${c.dataset.label}: ${fmtEUR.format(c.parsed.y)}` } } },
          scales:{ x:{ ticks:{ color:'#4A443A', font:tickFont }, grid:{ display:false } }, y: yScaleBase }
        }
      });
      return;
    }

    // ---- tutte le categorie: barre per mese con categorie ordinate dalla spesa piu' alta, totale del mese sopra ogni barra
    const floatData = {};
    const monthTotals = new Array(12).fill(0);
    mc.categories.forEach(cat => floatData[cat] = new Array(12).fill(null));
    for(let m=0; m<12; m++){
      const entries = mc.categories.map(cat=>({ cat, value: mc.data[cat][m] })).filter(e=>e.value>0).sort((a,b)=>b.value-a.value);
      let base = 0;
      entries.forEach(e=>{ floatData[e.cat][m] = [base, base+e.value]; base += e.value; });
      monthTotals[m] = base;
    }
    // altezza dinamica: ogni segmento che pesa almeno il 3% del suo mese ha almeno MIN_SEG_PX pixel, cosi l'emoji ci sta
    const MIN_SEG_PX = 13, MIN_PCT = 3;
    const maxTotal = Math.max(...monthTotals);
    let plotNeeded = 0;
    for(let m=0; m<12; m++){
      mc.categories.forEach(cat=>{
        const amt = mc.data[cat][m];
        if(amt>0 && monthTotals[m] && (amt/monthTotals[m]*100) >= MIN_PCT) plotNeeded = Math.max(plotNeeded, MIN_SEG_PX*maxTotal/amt);
      });
    }
    const baseH = isNarrow ? 340 : 420, maxH = isNarrow ? 720 : 860;
    if(wrap) wrap.style.height = Math.min(maxH, Math.max(baseH, Math.ceil(plotNeeded+110)))+'px';

    this.mountChart(key, 'chart-cat-'+year, {
      type:'bar',
      data:{
        labels: MESI_ABBR,
        datasets: [
          ...mc.categories.map((cat,i)=>{
            const st = categoryStyle(cat, i);
            return { type:'bar', label:`${st.emoji} ${cat}`, data: floatData[cat], backgroundColor: st.color, borderColor:'#FBF8F0', borderWidth:1, borderRadius:2, categoryPercentage:0.86, barPercentage:0.95 };
          }),
          // serie "tecnica" invisibile: serve solo a scrivere il totale del mese sopra la barra
          { type:'line', label:'Totale mese', data: monthTotals, showLine:false, pointRadius:0, pointHoverRadius:0, order:-1,
            datalabels:{ display:false } }, // il numero e' disegnato dal plugin avgLineLabel, con lo stesso font di "Media ..."
          { type:'line', label:'Media mensile uscite', data: new Array(12).fill(y.avgExpense), borderColor:'#4A443A', borderDash:[6,4], borderWidth:1.5, pointRadius:0, pointHoverRadius:0, fill:false, order:-1,
            datalabels:{ display:false } } // l'etichetta "Media ..." e' disegnata a parte dal plugin avgLineLabel qui sotto, fuori dall'area delle barre
        ]
      },
      plugins: [App.avgLabelPlugin],
      options:{
        responsive:true, maintainAspectRatio:false, layout:{ padding:{ top:30, right: isNarrow?58:72 } },
        plugins:{
          avgLineLabel:{ value: y.avgExpense, monthTotals, font:'600 13px "IBM Plex Mono", monospace' },
          legend:{ display:true, labels:{ color:'#211D16', font:{family:'Inter',size:12,weight:600}, boxWidth:16,
            filter:(item)=> item.text==='Media mensile uscite' } },
          tooltip:{
            filter:(item)=> Array.isArray(item.raw),
            callbacks:{
              title:(items)=> MESI_IT[items[0].dataIndex] + ' ' + year,
              label:(c)=>{
                const amt = c.raw[1]-c.raw[0];
                const pct = monthTotals[c.dataIndex] ? amt/monthTotals[c.dataIndex]*100 : 0;
                return `${c.dataset.label}: ${fmtEUR.format(amt)} (${pct.toFixed(0)}%)`;
              },
              footer:(items)=>{
                if(!items.length) return '';
                const tot = monthTotals[items[0].dataIndex];
                const diff = tot - y.avgExpense;
                return `Totale mese: ${fmtEUR.format(tot)}\nvs media (${fmtEUR.format(y.avgExpense)}): ${diff>=0?'+':''}${fmtEUR.format(diff)}`;
              },
              footerColor:'#F6EEDA'
            }
          },
          datalabels:{
            display:true, clamp:true,
            color:'#FBF8F0',
            font:{ family:'Inter', size:11, weight:700 },
            textAlign:'center',
            textStrokeColor:'rgba(33,29,22,0.55)',
            textStrokeWidth:2,
            formatter:(value, c)=>{
              if(!Array.isArray(value) || c.dataset.label==='Totale mese' || c.dataset.label==='Media mensile uscite') return '';
              const amt = value[1]-value[0];
              if(amt<=0) return '';
              const yScale = c.chart.scales.y;
              const h = yScale ? Math.abs(yScale.getPixelForValue(value[0]) - yScale.getPixelForValue(value[1])) : 0;
              const pct = monthTotals[c.dataIndex] ? Math.round(amt/monthTotals[c.dataIndex]*100) : 0;
              if(h < 13) return '';
              const emoji = c.dataset.label.split(' ')[0];
              return emoji+' '+pct+'%'; // emoji e percentuale sempre insieme, su un'unica riga
            }
          }
        },
        scales:{ x:{ stacked:true, ticks:{ color:'#4A443A', font:tickFont }, grid:{ display:false } }, y: yScaleBase }
      }
    });
  },

        return `<tr><td><strong class="mono">${this.esc(p.ticker||p.short||p.name)}</strong></td><td class="num mono">${fmtEUR.format(p.cost)}</td><td class="num mono">${fmtEUR.format(p.value)}</td><td class="num mono ${p.value>=p.cost?'gain-pos':'gain-neg'}">${(p.value>=p.cost?'+':'−')+fmtEUR.format(Math.abs(p.value-p.cost))}<div>${pct(p.value,p.cost)}</div></td><td class="num mono">${cw.toFixed(1).replace('.',',')}%</td><td class="num mono">${tgp==null?'—':tgp.toFixed(1).replace('.',',')+'%'}</td><td class="num"><input class="mono" aria-label="Target ${this.esc(p.ticker||p.short||p.name)} (percentuale del comparto)" placeholder="—" value="${tv==null?'':String(tv).replace('.',',')}" onchange="App.setInvTarget('${p.isin}', this.value)"></td><td class="num mono ${dv===null?'':(ok?'gain-pos':'gain-neg')}" title="Scarto rispetto al target sull'intero portafoglio: positivo = sopra, negativo = sotto">${dv===null?'—':(dv>=0?'+':'−')+fmtEUR0.format(Math.abs(dv))}</td><td class="num mono">${p.ter!=null ? String(p.ter).replace('.',',')+'%' : `<input class="mono" aria-label="TER ${this.esc(p.ticker||p.short||p.name)} (percentuale)" placeholder="TER %" value="${tr==null?'':String(tr).replace('.',',')}" onchange="App.setInvTer('${p.isin}', this.value)">`}</td><td class="num mono">${fmtEUR.format(p.value*(tr||0)/100)}</td></tr>`; }).join('')}

      return { head, body };

    const posParts = this.CLS.map(classTable).filter(Boolean);
    const posHTML = `<details class="card year-detail" ${this.posOpen?'open':''} ontoggle="App.posOpen=this.open"><summary><div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px 28px; flex-wrap:wrap;"><div style="min-width:0;">${posParts.map(x=>x.head).join('')}<div class="stat-sub" style="margin-top:6px;">tocca per i dettagli degli ETF <span class="caret">▸</span></div></div><div style="text-align:right;" title="Media dei TER degli ETF pesata sul valore di ciascuno"><div class="stat-label">TER ponderato annuo</div><div class="stat-value mono">${S.tot ? (S.annual/S.tot*100).toFixed(2).replace('.',',') : '0,00'}%</div><div class="stat-sub"><strong class="mono">${fmtEUR.format(S.annual)}</strong> all'anno${S.P.some(p=>this.terOf(p)==null) ? '<br>TER mancante per '+S.P.filter(p=>this.terOf(p)==null).length+' ETF' : ''}</div></div></div></summary><div style="margin-top:10px; padding-top:4px; border-top:1px dashed var(--line-strong);">${posParts.map(x=>x.body).join('')}</div></details>`;

    else pacBody = `<div class="table-scroll"><table class="inv-table pos-table pac-table"><thead><tr><th>ETF</th><th class="num">Peso ptf</th><th class="num">Target ptf</th><th class="num">PAC normale</th><th class="num">PAC ribilanciante</th><th class="num">Peso dopo</th></tr></thead><tbody>

    const pacHTML = `<div class="section-title"><span>PAC · quanto acquistare</span><span class="rule"></span></div><details class="card year-detail" ${this.pacOpen?'open':''} ontoggle="App.pacOpen=this.open"><summary><div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;"><div><div class="stat-label">Ripartizione del PAC</div><div class="stat-sub">tocca per aprire <span class="caret">▸</span></div></div><div class="stat-value mono" style="margin-top:0; font-size:22px;">${this.investAmount ? fmtEUR.format(this.investAmount) : '—'}</div></div></summary><div style="margin-top:12px; padding-top:10px; border-top:1px dashed var(--line-strong);">

      <div class="card">${this.invWaterfall(S) || '<div class="stat-sub">Scomposizione per periodo non presente nel backup.</div>'}</div>` + goalHTML + par + imp;

        <label class="btn" style="display:inline-block;">Aggiungi ai dati esistenti
          <input type="file" accept=".csv" multiple id="file-input-merge">
        </label>
        <p style="margin:14px 0 0; font-size:12px; color:var(--ink-soft);">${this.transactions.length} movimenti attualmente caricati${this.wallets.length? ' · portafogli: '+this.orderedWallets().map(w=>displayWalletName(w)).join(', ') : ''}</p>
        ${this.transactions.length ? `
        <p style="margin:18px 0 6px; font-size:12px; color:var(--ink-soft);">Se invece vuoi ripartire da zero con un nuovo set completo di file:</p>
        <label class="btn ghost small" style="display:inline-block;">Sostituisci tutti i dati
          <input type="file" accept=".csv" multiple id="file-input-replace">
        </label>` : ''}
      </div>

      <div class="card" style="margin-top:14px;">
        <div class="stat-label" style="margin-bottom:6px;">Abbinamento pagamenti previsti</div>
        <p class="stat-sub" style="margin-bottom:6px;">All'import cerco, per ogni pagamento previsto non ancora pagato, un movimento della stessa categoria nello stesso mese. Importo identico: abbinato in automatico. Con il flag "Circa": abbinato in automatico entro la tolleranza. Altrimenti, entro la soglia proposte, ti chiedo conferma.</p>
        <div class="field-row"><label>Tolleranza "Circa" (%) <span class="stat-sub">· abbinamento automatico</span></label><input class="mono" aria-label="Tolleranza Circa (%)" value="${String(this.PLANNED_APPROX_TOL_PCT).replace('.',',')}" onchange="App.setMatchParam('PLANNED_APPROX_TOL_PCT', this.value)"></div>
        <div class="field-row"><label>Soglia proposte (%) <span class="stat-sub">· oltre questa differenza non propongo nulla; non scende sotto la tolleranza</span></label><input class="mono" aria-label="Soglia proposte (%)" value="${String(this.PLANNED_PROPOSAL_WINDOW_PCT).replace('.',',')}" onchange="App.setMatchParam('PLANNED_PROPOSAL_WINDOW_PCT', this.value)"></div>
      </div>

      ${this.wallets.length ? `
      <div class="section-title"><span>Portafogli operativi</span><span class="rule"></span></div>
      <div class="card">
        <p class="stat-sub" style="margin-bottom:10px;">Entrate, uscite e categorie del riepilogo mensile vengono calcolate solo sui portafogli "operativi" (in genere conto corrente, carta, contanti). Escludi i portafogli di risparmio/investimento dove gli unici movimenti sono interessi o TFR: contano comunque nel patrimonio totale, ma non nel riepilogo mensile.</p>
        ${operationalRows}
      </div>

      <div class="section-title"><span>Budget mensile per categoria</span><span class="rule"></span></div>
      <div class="card">
        <p class="stat-sub" style="margin-bottom:10px;">Importo massimo mensile per ogni categoria di spesa. Compare come linea rossa nel grafico del Riepilogo annuo quando isoli la categoria, con i mesi sopra budget evidenziati. Il primo budget che imposti vale anche per i mesi passati; ogni modifica successiva vale dal mese in corso e non cambia i budget dei mesi già passati. Lascia vuoto (o 0) per nessun budget.</p>
        ${this.budgetRowsHTML()}
      </div>

      <div class="section-title"><span>Saldo di apertura per portafoglio</span><span class="rule"></span></div>
      <div class="card">
        <p class="stat-sub" style="margin-bottom:10px;">Il CSV di Spendee non contiene il saldo del conto, solo i movimenti. Imposta qui il saldo che ogni portafoglio aveva prima della prima transazione importata: da lì la dashboard calcola il saldo corrente e il suo andamento.</p>
        ${balanceRows}
      </div>` : ''}
    `;

    document.getElementById('file-input-merge').addEventListener('change', (e)=>{
      if(e.target.files.length) this.handleFiles(e.target.files, 'merge');
    });
    document.getElementById('file-input-backup').addEventListener('change', (e)=>{
      if(e.target.files.length) this.importBackupFile(e.target.files[0]);
      e.target.value = '';
    });
    const replaceInput = document.getElementById('file-input-replace');
    if(replaceInput){
      replaceInput.addEventListener('change', (e)=>{
        const files = Array.from(e.target.files); // copia subito: il modale e' asincrono e l'input viene svuotato dal browser
        e.target.value = '';
        if(!files.length) return;
        this.askConfirm(
          `Verranno azzerati tutti i movimenti importati da CSV in precedenza e sostituiti con quelli dei ${files.length} ${files.length===1?'file selezionato':'file selezionati'}. I movimenti manuali, i pagamenti previsti e i saldi di apertura restano invariati.`,
          'Sostituisci i dati',
          ()=> this.handleFiles(files, 'replace'),
          'Sostituire tutti i dati?'
        );
      });
    }
  },

  resetData(){
    this.askConfirm(
      'Verranno cancellati tutti i dati della dashboard: movimenti, portafogli, saldi di apertura, pagamenti previsti, budget, obiettivi, dati e parametri della pagina Investimenti. L\'operazione non si può annullare: scarica prima un backup se ti serve.',
      'Cancella tutto',
      ()=>{
        this.transactions = []; this.wallets = []; this.openingBalances = {}; this.operational = {}; this.totalIncludedWallets = {};
        this.plannedPayments = {}; this.plannedSkips = {}; this.budgets = {}; this.lastCsvImport = null;
        this.targetMonthsOperational = 2; this.targetMonthsEmergency = 6;
        this.PLANNED_APPROX_TOL_PCT = 10; this.PLANNED_PROPOSAL_WINDOW_PCT = 50;
        this.investAmount = 0; this.inv = null;
        this.invParams = { az:60, alt:10, shift:25, goal:0, goalStart:0, goalRate:5, goalYears:10 };
        this.invPeriod = ''; this.yearSel = {}; this.yearCtx = {}; this.yearlyActiveYear = null;
        this._txv++;
        try{ localStorage.removeItem(this.STORAGE_KEY); }catch(e){ console.warn('Reset: impossibile svuotare lo storage locale', e); }
        this.renderSidebar();
        this.navigate('import');
        this.showToast('Tutti i dati sono stati cancellati.');
      },
      'Cancellare tutti i dati?'
    );
  },

  setOpeningBalance(wallet, value){
    const v = this.parseNum(value);
    this.openingBalances[wallet] = v;
    this.saveData();
    this.renderImport();
    this.showToast('Saldo di apertura aggiornato.');
  }
};

window.App = App;
document.addEventListener('click', (e)=>{
  const el = e.target.closest && e.target.closest('.cl-text');
  if(!el || String(window.getSelection()).length) return;
  const k = (el.textContent||'').trim().slice(0,60);
  el.classList.toggle('cl-closed');
  if(el.classList.contains('cl-closed')) App._clOpen.delete(k); else App._clOpen.add(k);
});
document.addEventListener('toggle', (e)=>{ if(e.target && e.target.open) App.collapseLong(); }, true);
(function(){ let w = window.innerWidth, t; window.addEventListener('resize', ()=>{ clearTimeout(t); t = setTimeout(()=>{ if(window.innerWidth!==w){ w = window.innerWidth; App.collapseLong(true); if(App.route.page==='investments' && App.invParams.auto!==false) App.render(); } }, 200); }); })();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ App.collapseLong(true); Object.values(App.charts).forEach(c=>{ try{ c.resize(); c.update('none'); }catch(e){} }); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Tab'){ App._tabAt = Date.now(); App._tabDir = e.shiftKey ? -1 : 1; } }, true);

/* Tendina categorie: si chiude cliccando fuori (o esaudendo la selezione) o con Esc. */
document.addEventListener('mousedown', (e)=>{
  if(!App._catDD) return;
  if(e.target===App._catDDInput || App._catDD.contains(e.target)) return;
  App.closeCatPicker();
}, true);
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape' && App._catDD) App.closeCatPicker();
});

/* Campi numerici editabili: se il valore presente e' 0, al click/tap si svuota da solo per scrivere subito il nuovo numero;
   se esci senza scrivere nulla torna lo 0 originale. Vale per tutta la dashboard (delegato sul documento). */
(function(){
  const ZERO_RE = /^\s*[-+]?0+([.,]0+)?\s*$/;
  const isNumericField = (el)=> el && el.tagName==='INPUT' && ['text','number','tel',''].includes((el.getAttribute('type')||'').toLowerCase());
  document.addEventListener('focusin', (e)=>{
    const el = e.target;
    if(!isNumericField(el) || el.readOnly || el.disabled) return;
    if(ZERO_RE.test(el.value)){
      el.dataset.zeroOrig = el.value;
      el.value = '';
    }
  });
  document.addEventListener('focusout', (e)=>{
    const el = e.target;
    if(!el || !el.dataset || el.dataset.zeroOrig === undefined) return;
    if(el.value === '') el.value = el.dataset.zeroOrig; // niente scritto: ripristina lo 0
    delete el.dataset.zeroOrig;
  });
})();
document.addEventListener('DOMContentLoaded', ()=> App.init());
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
