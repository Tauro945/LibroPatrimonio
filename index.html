  yearlyDetailedSummary(year){
    const prefix = String(year);
    const nowYm = todayYm();
    const isCurrent = String(year)===nowYm.slice(0,4);
    const currentMonthNum = parseInt(nowYm.slice(5,7),10);
    const monthsElapsed = isCurrent ? Math.max(0, currentMonthNum-1) : 12; // mesi completati: esclude il mese in corso, ancora parziale
    const txs = this.transactions.filter(t=> t.ym.startsWith(prefix) && this.isOperational(t.wallet));
    const completedTxs = isCurrent ? txs.filter(t=> t.ym < nowYm) : txs; // sottoinsieme usato solo per le medie
    const expenses = txs.filter(t=>t.type==='Expense');
    const incomes = txs.filter(t=>t.type==='Income');
    const completedExpenses = completedTxs.filter(t=>t.type==='Expense');
    const completedIncomes = completedTxs.filter(t=>t.type==='Income');
    const totalExpense = expenses.reduce((s,t)=>s+Math.abs(t.amount),0);
    const totalIncome = incomes.reduce((s,t)=>s+t.amount,0);
    const completedTotalExpense = completedExpenses.reduce((s,t)=>s+Math.abs(t.amount),0);
    const completedTotalIncome = completedIncomes.reduce((s,t)=>s+t.amount,0);

    // totali per nome-categoria (e per categoria+etichetta) calcolati solo sui mesi completati, usati solo per le medie
    const catTotalsByName = (list)=>{
      const map = new Map();
      list.forEach(t=>{
        const name = t.category ? t.category.name : 'Senza categoria';
        map.set(name, (map.get(name)||0) + Math.abs(t.amount));
      });
      return map;
    };
    const catLabelTotalsByName = (list)=>{
      const map = new Map();
      list.forEach(t=>{
        const catName = t.category ? t.category.name : 'Senza categoria';
        if(!t.labels.length){
          const key = catName+'::Senza etichetta';
          map.set(key, (map.get(key)||0) + Math.abs(t.amount));
          return;
        }
        t.labels.forEach(l=>{
          const key = catName+'::'+labelName(l);
          map.set(key, (map.get(key)||0) + Math.abs(t.amount));
        });
      });
      return map;
    };
    const completedExpenseCatTotals = catTotalsByName(completedExpenses);
    const completedIncomeCatTotals = catTotalsByName(completedIncomes);
    const completedExpenseCatLabelTotals = catLabelTotalsByName(completedExpenses);

    const byCat = (list, catAvgMap, catLabelAvgMap)=>{
      const map = new Map();
      list.forEach(t=>{
        const name = t.category ? t.category.name : 'Senza categoria';
        if(!map.has(name)) map.set(name, { name, total:0, txs:[] });
        const e = map.get(name);
        e.total += Math.abs(t.amount);
        e.txs.push(t);
      });
      return Array.from(map.values()).sort((a,b)=>b.total-a.total).map(c=>{
        const avgTotal = catAvgMap.get(c.name) || 0;
        return {
          name: c.name, total: c.total, avg: monthsElapsed ? avgTotal/monthsElapsed : 0,
          labels: this.labelTotals(c.txs).sort((a,b)=>b.total-a.total).map(l=>{
            const labelAvgTotal = catLabelAvgMap.get(c.name+'::'+l.label) || 0;
            return {
              label: l.label, total: l.total, avg: monthsElapsed ? labelAvgTotal/monthsElapsed : 0,
              pct: c.total ? (l.total/c.total*100) : 0
            };
          })
        };
      });
    };

    const completedLabelTotalsExpenseMap = new Map(this.labelTotals(completedExpenses).map(l=>[l.label,l.total]));
    const completedLabelTotalsIncomeMap = new Map(this.labelTotals(completedIncomes).map(l=>[l.label,l.total]));
    const labelTotalsExpense = this.labelTotals(expenses).sort((a,b)=>b.total-a.total).map(l=>({
      label:l.label, total:l.total, avg: monthsElapsed ? (completedLabelTotalsExpenseMap.get(l.label)||0)/monthsElapsed : 0
    }));
    const labelTotalsIncome = this.labelTotals(incomes).sort((a,b)=>b.total-a.total).map(l=>({
      label:l.label, total:l.total, avg: monthsElapsed ? (completedLabelTotalsIncomeMap.get(l.label)||0)/monthsElapsed : 0
    }));

    return {
      year, isCurrent, monthsElapsed,
      totalIncome, totalExpense,
      avgIncome: monthsElapsed ? completedTotalIncome/monthsElapsed : 0,
      avgExpense: monthsElapsed ? completedTotalExpense/monthsElapsed : 0,
      expenseCats: byCat(expenses, completedExpenseCatTotals, completedExpenseCatLabelTotals),
      incomeCats: byCat(incomes, completedIncomeCatTotals, new Map()),
      labelTotalsExpense, labelTotalsIncome,
      hasData: txs.length>0
    };
  },

  labelTotals(txs){
    // somma per etichetta su una lista di transazioni (presenza multi-etichetta: importo intero a ciascuna etichetta presente)
    const map = new Map();
    txs.forEach(t=>{
      if(!t.labels.length){
        map.set('Senza etichetta', (map.get('Senza etichetta')||0) + Math.abs(t.amount));
        return;
      }
      t.labels.forEach(l=>{
        const name = labelName(l);
        map.set(name, (map.get(name)||0) + Math.abs(t.amount));
      });
    });
    return Array.from(map.entries()).map(([label,total])=>({label,total}));
  },

  yearCategoryBreakdown(year, type){
    const prefix = String(year);
    const txs = this.transactions.filter(t=> t.ym.startsWith(prefix) && this.isOperational(t.wallet) && t.type===type);
    const map = new Map();
    txs.forEach(t=>{
      const name = t.category ? t.category.name : 'Senza categoria';
      map.set(name, (map.get(name)||0) + Math.abs(t.amount));
    });
    return Array.from(map.entries()).map(([name,total])=>({name,total})).sort((a,b)=> b.total-a.total);

  yearLabelTxMap(year){
    // etichetta -> movimenti di uscita dell'anno che ne fanno parte (stessa logica di labelTotals: un movimento multi-etichetta compare in ciascuna)
    const map = new Map();
    this.transactions.filter(t=> t.ym.startsWith(String(year)) && this.isOperational(t.wallet) && t.type==='Expense').forEach(t=>{
      const names = t.labels.length ? t.labels.map(l=>labelName(l)) : ['Senza etichetta'];
      names.forEach(n=>{ if(!map.has(n)) map.set(n, []); map.get(n).push(t); });

  yearLabelBreakdown(year, type){

    const txs = this.transactions.filter(t=> t.ym.startsWith(prefix) && this.isOperational(t.wallet) && t.type===type);
    return this.labelTotals(txs).sort((a,b)=> b.total-a.total);
  },

  monthlyCategoryBreakdown(year){
    // matrice mese (1-12) x categoria di spesa, per il grafico a barre impilate del riepilogo annuo;
    // mostra sempre tutte le categorie reali che hanno movimenti (nessun raggruppamento in "Altro")
    const prefix = String(year);
    const txs = this.transactions.filter(t=> t.ym.startsWith(prefix) && this.isOperational(t.wallet) && t.type==='Expense');
    const totalsByCat = new Map();
    txs.forEach(t=>{
      const name = t.category ? t.category.name : 'Senza categoria';
      totalsByCat.set(name, (totalsByCat.get(name)||0) + Math.abs(t.amount));
    });
    const categories = Array.from(totalsByCat.entries()).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);

    const data = {};
    categories.forEach(c=> data[c] = new Array(12).fill(0));
    txs.forEach(t=>{
      const name = t.category ? t.category.name : 'Senza categoria';
      const monthIdx = parseInt(t.ym.split('-')[1],10)-1;
      data[name][monthIdx] += Math.abs(t.amount);
    });

    return { categories, data, hasData: txs.length>0 };
  },
  monthSummary(ym){
    const allTxs = this.monthTx(ym);
    const txs = allTxs.filter(t=> this.isOperational(t.wallet));
    const expenses = txs.filter(t=>t.type==='Expense');
    const incomes = txs.filter(t=>t.type==='Income');
    const transfersIn = txs.filter(t=>t.type==='Incoming Transfer');
    const transfersOut = txs.filter(t=>t.type==='Outgoing Transfer');
    const totalExpense = expenses.reduce((s,t)=>s+Math.abs(t.amount),0);
    const totalIncome = incomes.reduce((s,t)=>s+t.amount,0);
    const netFlow = allTxs.filter(t=>!t.manual).reduce((s,t)=>s+t.amount,0);
    const nonOpWallets = this.wallets.filter(w=>!this.isOperational(w));
    const nonOpFlow = allTxs.filter(t=>!this.isOperational(t.wallet)).reduce((s,t)=>s+t.amount,0);

    const byCat = (list)=>{
      const map = new Map();
      list.forEach(t=>{
        const key = t.category ? `${t.category.numbered?String(t.category.code).padStart(2,'0'):'—'}::${t.category.name}` : '::Senza categoria';
        if(!map.has(key)) map.set(key, { code:t.category?t.category.code:null, numbered:t.category?t.category.numbered:false, name:t.category?t.category.name:'Senza categoria', total:0, txs:[] });
        const entry = map.get(key);
        entry.total += Math.abs(t.amount);
        entry.txs.push(t);
      });
      return Array.from(map.values()).sort((a,b)=> b.total-a.total);
    };

    return {
      ym, totalExpense, totalIncome, netFlow, nonOpWallets, nonOpFlow,
      transferIn: transfersIn.reduce((s,t)=>s+t.amount,0),
      transferOut: transfersOut.reduce((s,t)=>s+Math.abs(t.amount),0),
      expenseCats: byCat(expenses),
      incomeCats: byCat(incomes)
    };
  },

  labelBreakdown(catTxs){
    // ritorna [{label, total, pct}] rispetto al totale della categoria (presenza multi-etichetta: somma per ogni etichetta presente)
    const catTotal = catTxs.reduce((s,t)=>s+Math.abs(t.amount),0);
    const map = new Map();
    catTxs.forEach(t=>{
      if(!t.labels.length){
        const k = '—senza etichetta';
        map.set(k, (map.get(k)||0) + Math.abs(t.amount));
        return;
      }
      t.labels.forEach(l=>{
        const name = labelName(l);
        map.set(name, (map.get(name)||0) + Math.abs(t.amount));
      });
    });
    const arr = Array.from(map.entries()).map(([label,total])=>({label,total,pct: catTotal? (total/catTotal*100):0}));
    arr.sort((a,b)=>{
      const ia = LABEL_ORDER.indexOf(a.label), ib = LABEL_ORDER.indexOf(b.label);
      if(ia===-1 && ib===-1) return b.total-a.total;
      if(ia===-1) return 1;
      if(ib===-1) return -1;
      return ia-ib;
    });
    return arr;
  },

  /* ---------------- INVESTMENTS ---------------- */
  addInvestment(cls){
    this.investments.push({ id: uid(), name:'Nuovo ETF', assetClass: cls||'', targetPct:0, invested:0, currentValue:0 });
    this.saveData();
    this.render();

  updateInvestment(id, field, value){

  setAssetClass(id, value){

    if(!inv) return;
    inv.assetClass = value;

  },
  allocationData(){
    // pesi calcolati sul VALORE ATTUALE (non sull'investito): e' l'allocazione reale del portafoglio oggi
    const totalValue = this.investments.reduce((s,i)=>s+i.currentValue,0);
    const rows = [...ASSET_CLASSES, ''].map(cls=>{
      const list = this.investments.filter(i=>(i.assetClass||'')===cls);
      const value = list.reduce((s,i)=>s+i.currentValue,0);
      return { cls, label: cls || 'Non assegnato', value, count:list.length, pct: totalValue ? value/totalValue*100 : 0 };
    });
    return { totalValue, rows };
  },
  clampPct(v){ return Math.min(100, Math.max(0, Number(v)||0)); },
  setAllocParam(key, value){
    this[key] = this.clampPct(parseFloat(String(value).replace(',','.')));
    this.saveData();
    this.refreshInvTotals();
  },
  setInvTarget(id, value){
    const inv = this.investments.find(i=>i.id===id);
    if(!inv) return;
    inv.targetPct = this.clampPct(parseFloat(String(value).replace(',','.')));
    this.saveData();
    this.refreshInvTotals();
  },
  allocTargets(){
    // E = quota azionaria su 100 (obbligazionaria = 100-E); poi gli alternativi A tolgono spazio in modo proporzionale a entrambe
    const E = this.clampPct(this.targetEquityPct), A = this.clampPct(this.targetAltPct);
    const f = 1 - A/100;
    return { 'Azionaria': E*f, 'Obbligazionaria': (100-E)*f, 'Alternativi': A };
  },
  rebalStatus(cur, target, allowZero){
    // shift RELATIVO: range = target*(1-shift) ... target*(1+shift)
    if(!(target>0) && !(allowZero && target===0)) return { state:'nd', lo:null, hi:null };
    const sh = this.clampPct(this.maxShiftPct)/100;
    const lo = target*(1-sh), hi = target*(1+sh);
    const eps = 0.05; // tolleranza di arrotondamento (0,05 punti percentuali)
    const state = cur < lo-eps ? 'under' : (cur > hi+eps ? 'over' : 'ok');
    return { state, lo, hi };
  },
  rbBadge(state, compact){
    if(compact){
      if(state==='ok') return '<span class="rb-badge ok">Nel range</span>';
      if(state==='over') return '<span class="rb-badge out">▲ Sopra</span>';
      if(state==='under') return '<span class="rb-badge out">▼ Sotto</span>';
      return '<span class="rb-badge nd">Senza target</span>';
    }
    if(state==='ok') return '<span class="rb-badge ok">Nel range</span>';
    if(state==='over') return '<span class="rb-badge out">Sopra · ribilancia</span>';
    if(state==='under') return '<span class="rb-badge out">Sotto · ribilancia</span>';
    return '<span class="rb-badge nd">Target non impostato</span>';
  },
  rbMove(cur, target, totalValue){
    const diff = (target-cur)/100*totalValue;
    if(Math.abs(diff)<1) return '—';
    return diff>0 ? `<span style="color:var(--sage)">Compra ${fmtEUR0.format(diff)}</span>` : `<span style="color:var(--brick)">Vendi ${fmtEUR0.format(-diff)}</span>`;
  },
  fmtPct1(v){ return v.toFixed(1).replace('.',',')+'%'; },
  rbRange(st){ return st.lo===null ? '—' : `${this.fmtPct1(st.lo)} – ${this.fmtPct1(st.hi)}`; },
  etfEffTarget(inv){
    // target dell'ETF sul portafoglio totale = target nella classe x target della classe (es. 45% di 60% = 27%)
    if(!inv.assetClass) return null;
    return (inv.targetPct||0)/100 * this.allocTargets()[inv.assetClass];
  },
  etfClassWeight(inv){
    // peso dell'ETF dentro la propria classe (0-100): e' il valore confrontato col target ETF, che e' espresso nella classe
    if(!inv.assetClass) return null;
    const classValue = this.investments.filter(i=>i.assetClass===inv.assetClass).reduce((x,i)=>x+i.currentValue,0);
    return classValue ? inv.currentValue/classValue*100 : 0;
  },
  allocDerivedHTML(){
    const T = this.allocTargets();
    return ASSET_CLASSES.map(c=>`<span><span class="alloc-dot" style="background:${ASSET_CLASS_COLORS[c]};"></span>${c}: <strong class="mono" style="margin-left:5px;">${this.fmtPct1(T[c])}</strong></span>`).join('');
  },
  allocationHTML(){
    const a = this.allocationData(), T = this.allocTargets();
    if(!this.investments.length || !a.totalValue){
      return `<div class="stat-sub" style="padding:6px 2px;">Inserisci il valore attuale degli ETF e assegna a ciascuno una classe per vedere allocazione e stato di ribilanciamento.</div>`;
    }
    const rows = a.rows.filter(r=>r.cls!=='' || r.value>0).map(r=>{
      const isCls = r.cls!=='';
      const dot = `<span class="alloc-dot" style="background:${ASSET_CLASS_COLORS[r.cls]};"></span>`;
      if(!isCls){
        return `<tr><td>${dot}${r.label}</td><td class="num mono">${fmtEUR.format(r.value)}</td><td class="num mono">${this.fmtPct1(r.pct)}</td><td class="num">—</td><td class="num">—</td><td>—</td><td class="num">—</td></tr>`;
      }
      const st = this.rebalStatus(r.pct, T[r.cls], true);
      return `<tr>
        <td><strong>${dot}${r.label}</strong></td>
        <td class="num mono">${fmtEUR.format(r.value)}</td>
        <td class="num mono"><strong>${this.fmtPct1(r.pct)}</strong></td>
        <td class="num mono">${this.fmtPct1(T[r.cls])}</td>
        <td class="num mono">${this.rbRange(st)}</td>
        <td>${this.rbBadge(st.state)}</td>
        <td class="num mono">${(st.state==='over'||st.state==='under') ? this.rbMove(r.pct, T[r.cls], a.totalValue) : '—'}</td>
      </tr>`;
    }).join('');
    const unassigned = a.rows.find(r=>r.cls==='' && r.value>0);
    return `<div class="table-scroll"><table class="inv-table">
        <thead><tr><th>Classe</th><th class="num">Valore</th><th class="num">Attuale</th><th class="num">Target</th><th class="num">Range</th><th>Stato</th><th class="num">Per tornare al target</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      ${unassigned ? `<div class="label-note" style="padding-left:2px;">Alcuni ETF non hanno una classe assegnata: sono esclusi dal confronto con i target.</div>` : ''}`;
  },
  setInvestAmount(value){
    this.investAmount = Math.max(0, this.parseNum(value));
    this.saveData();
    this.refreshInvTotals();
  },
  investPlan(){
    const a = this.allocationData();
    const V = a.totalValue, X = this.investAmount || 0;
    const ordered = ASSET_CLASSES.flatMap(c => this.investments.filter(i=>i.assetClass===c));
    const rows = ordered.map(inv=>{
      const eff = this.etfEffTarget(inv) || 0;
      const w = V ? inv.currentValue/V*100 : 0;
      const st = this.rebalStatus(w, eff, false);
      return { inv, eff, state: st.state, simple: X*eff/100, need:0, reb:null };
    });
    // ribilanciante: solo gli ETF SOTTO il range ricevono soldi; l'obiettivo e' il target sul portafoglio dopo l'investimento (V+X)
    const under = rows.filter(r=>r.state==='under');
    under.forEach(r=>{ r.need = Math.max(0, r.eff/100*(V+X) - r.inv.currentValue); });
    const S = under.reduce((x,r)=>x+r.need,0);
    const scale = S > X ? (S ? X/S : 0) : 1;
    under.forEach(r=>{ r.reb = r.need*scale; });
    const allocated = under.reduce((x,r)=>x+r.reb,0);
    return { rows, X, V, allocated, leftover: X-allocated, scaled: S>X, underCount: under.length };
  },
  investCalcHTML(){
    if(!this.investments.length) return '';
    const X = this.investAmount || 0;
    if(!(X>0)){
      return `<div class="label-note" style="padding-left:2px;">Inserisci un importo in "INVESTI €" per vedere quanto destinare a ogni ETF.</div>`;
    }
    const pl = this.investPlan();
    const rows = pl.rows.map(r=>{
      let reb;
      if(r.state==='under') reb = `<strong>${fmtEUR.format(r.reb)}</strong>`;
      else if(r.state==='over') reb = '<span class="stat-sub">Non comprare</span>';
      else reb = '—';
      return `<tr>
        <td><span class="alloc-dot" style="background:${ASSET_CLASS_COLORS[r.inv.assetClass]};"></span><strong>${r.inv.name}</strong></td>
        <td style="text-align:center;">${this.rbBadge(r.state, true)}</td>
        <td class="num mono">${r.eff>0 ? this.fmtPct1(r.eff) : '—'}</td>
        <td class="num mono">${fmtEUR.format(r.simple)}</td>
        <td class="num mono">${reb}</td>
      </tr>`;
    }).join('');
    const totSimple = pl.rows.reduce((x,r)=>x+r.simple,0);
    let extra = '';
    if(!pl.underCount) extra = 'Nessun ETF è sotto il range: il metodo ribilanciante non assegna nulla.';
    else if(pl.scaled) extra = 'I soldi non bastano per portare tutti gli ETF sotto range al target: gli importi ribilancianti sono ridotti in proporzione.';
    else if(pl.leftover > 1) extra = `Il metodo ribilanciante lascia ${fmtEUR.format(pl.leftover)} non assegnati: gli ETF sotto range hanno già raggiunto il target. Puoi destinarli con il metodo semplice.`;
    return `<div class="table-scroll"><table class="inv-table">
        <thead><tr><th>ETF</th><th style="text-align:center;">Stato</th><th class="num">Target tot.</th><th class="num">Semplice</th><th class="num">Ribilanciante</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td colspan="3" style="padding:8px 10px; font-weight:700;">Totale</td><td class="num mono" style="padding:8px 10px; font-weight:700;">${fmtEUR.format(totSimple)}</td><td class="num mono" style="padding:8px 10px; font-weight:700;">${fmtEUR.format(pl.allocated)}</td></tr></tfoot>
      </table></div>
      <div class="label-note" style="padding-left:2px;"><strong>Semplice</strong>: INVESTI € × target tot. di ogni ETF, senza guardare cosa hai già. <strong>Ribilanciante</strong>: mostrato solo per gli ETF fuori range; per i sottopesati è quanto serve per portarli al target sul portafoglio dopo l'investimento (valore attuale + INVESTI €), per quelli sopra range non si compra nulla.${extra ? ' '+extra : ''}</div>`;
  },
  etfDyn(inv, a){
    // celle "calcolate" della riga ETF: target sul totale (target in classe x target classe), peso attuale, range, stato, importo
    const w = a.totalValue ? inv.currentValue/a.totalValue*100 : 0;
    const weight = `<strong>${this.fmtPct1(w)}</strong>`;
    const eff = this.etfEffTarget(inv);
    if(eff===null) return { eff:'—', weight, range:'—', status:'—', move:'—' };
    const st = this.rebalStatus(w, eff, false);
    return {
      eff: eff>0 ? `<strong>${this.fmtPct1(eff)}</strong>` : '—',
      weight,
      range: this.rbRange(st),
      status: this.rbBadge(st.state, true),
      move: (st.state==='over'||st.state==='under') ? this.rbMove(w, eff, a.totalValue) : '—'
    };
  },
  etfNotesHTML(){
    return `<div class="label-note" style="padding-left:2px;">Target sul totale = target in classe × target della classe (es. 45% di una classe al 60% = 27%). Il range usa lo shift relativo su quel valore; il peso attuale è sul valore totale del portafoglio. ▲ Sopra = sovrappesato (vendi/non versare), ▼ Sotto = sottopesato (compra).</div>`;
  },
  etfSecInfoHTML(cls){
    const a = this.allocationData(), T = this.allocTargets();
    const row = a.rows.find(r=>r.cls===cls);
    const list = this.investments.filter(i=>i.assetClass===cls);

    const sumBadge = !list.length ? '' : (Math.abs(sum-100)<=0.05
      ? '<span class="rb-badge ok">Somma target 100%</span>'
      : `<span class="rb-badge out">Somma target ${this.fmtPct1(sum)} ≠ 100%</span>`);
    return `<span class="stat-sub">${fmtEUR0.format(row.value)} · attuale ${this.fmtPct1(row.pct)} · target ${this.fmtPct1(T[cls])}</span> ${sumBadge}`;
  },
  etfRowHTML(inv, aData){
    const g = inv.currentValue - inv.invested;
    const gp = inv.invested ? (g/inv.invested*100) : 0;
    const d = this.etfDyn(inv, aData);
    const gc = g>=0 ? 'gain-pos' : 'gain-neg';
    const unassigned = !inv.assetClass;
    const statusCell = unassigned
      ? `<select aria-label="Classe di attivo" onchange="App.setAssetClass('${inv.id}', this.value)"><option value="">— classe —</option>${ASSET_CLASSES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>`
      : d.status;
    return `
      <div class="etf-row">
        <input class="etf-name" aria-label="Nome ETF" value="${inv.name.replace(/"/g,'&quot;')}" onchange="App.updateInvestment('${inv.id}','name',this.value)">
        <input class="mono tcl" aria-label="Target dentro la classe (percentuale)" title="Target dentro la classe (%)" value="${String(inv.targetPct||0).replace('.',',')}" onchange="App.setInvTarget('${inv.id}', this.value)">
        <input class="mono" aria-label="Investito" value="${inv.invested}" onchange="App.updateInvestment('${inv.id}','invested',this.value); App.refreshInvTotals();">
        <input class="mono" aria-label="Valore attuale" value="${inv.currentValue}" onchange="App.updateInvestment('${inv.id}','currentValue',this.value); App.refreshInvTotals();">
        <span class="r mono ${gc}" id="inv-gainbox-${inv.id}"><span id="inv-gain-${inv.id}">${g>=0?'+':''}${fmtEUR0.format(g)}</span> <span id="inv-gainpct-${inv.id}">(${fmtPct(gp)})</span></span>
        <span class="c mono" id="inv-weight-${inv.id}">${d.weight}</span>
        <span class="c mono" id="inv-range-${inv.id}">${d.range}</span>
        <span class="c" id="inv-status-${inv.id}">${statusCell}</span>
        <span class="c mono" id="inv-eff-${inv.id}">${d.eff}</span>
        <span class="r mono" id="inv-move-${inv.id}">${d.move}</span>
        <button class="btn danger" title="Rimuovi ETF" aria-label="Rimuovi ETF" onclick="App.removeInvestment('${inv.id}')">✕</button>
      </div>`;
  },
  etfSectionsHTML(aData){
    const head = `<div class="etf-head"><div>ETF</div><div class="r" title="Target dentro la classe (%)">Cl. %</div><div class="r">Investito</div><div class="r">Valore</div><div class="r">Guadagno</div><div class="c">Peso</div><div class="c">Range</div><div class="c">Stato</div><div class="c">Target tot.</div><div class="r">Per tornare</div><div></div></div>`;
    const sec = (cls)=>{
      const list = this.investments.filter(i=>(i.assetClass||'')===cls);
      const color = ASSET_CLASS_COLORS[cls];
      if(cls===''){
        if(!list.length) return '';
        return `<div class="etf-sec">
          <div class="etf-sec-head"><span class="alloc-dot" style="background:${color};"></span><strong>Da assegnare a una classe</strong><span class="stat-sub">scegli la classe nel menu della colonna Stato: l'ETF si sposta nella sua sezione</span></div>
          ${list.map(i=>this.etfRowHTML(i, aData)).join('')}
        </div>`;
      }
      return `<div class="etf-sec">
        <div class="etf-sec-head">
          <span class="alloc-dot" style="background:${color};"></span><strong style="font-family:'Fraunces',serif; font-size:15px;">${cls}</strong>
          <span id="inv-sec-info-${cls}">${this.etfSecInfoHTML(cls)}</span>
          <span class="spacer"></span>
          <button class="btn ghost small" onclick="App.addInvestment('${cls}')">+ Aggiungi ETF</button>
        </div>
        ${list.length ? list.map(i=>this.etfRowHTML(i, aData)).join('') : `<div class="etf-empty">Nessun ETF in questa classe.</div>`}
      </div>`;
    };
    return `<div class="etf-scroll"><div class="etf-inner">${head}${[...ASSET_CLASSES,''].map(sec).join('')}</div></div>`;
  },
  allocChartData(){
    const a = this.allocationData(), T = this.allocTargets();
    const pieRows = a.rows.filter(r=>r.value>0);
    return {
      pieLabels: pieRows.map(r=>r.label),
      pieValues: pieRows.map(r=>r.value),
      pieColors: pieRows.map(r=>ASSET_CLASS_COLORS[r.cls]),
      barLabels: ASSET_CLASSES,
      current: ASSET_CLASSES.map(c=>a.rows.find(r=>r.cls===c).pct),
      target: ASSET_CLASSES.map(c=>T[c]),
      colors: ASSET_CLASSES.map(c=>ASSET_CLASS_COLORS[c])
    };
  },
  /* ---------------- TRASFERIMENTI VERSO SCALABLE -> ripartizione sugli ETF ---------------- */
  isScalableWallet(wallet){
    return displayWalletName(wallet||'').toUpperCase().includes('SCALABLE');
  },
  parseNum(v){
    const str = String(v).trim();
    if(!str) return 0;
    const n = str.includes(',') ? parseFloat(str.replace(/[.\s]/g,'').replace(',','.')) : (/^-?\d{1,3}(\.\d{3})+$/.test(str) ? parseFloat(str.replace(/\./g,'')) : parseFloat(str));
    return Number.isFinite(n) ? n : 0;
  },
  defaultSplit(amount){
    // ripartisce l'importo in proporzione al TARGET TOT di ogni ETF (normalizzato: la somma dei target tot puo' non essere esattamente 100)
    const list = this.investments.map(i=>({ id:i.id, eff:this.etfEffTarget(i)||0 })).filter(x=>x.eff>0);
    const split = {};
    this.investments.forEach(i=> split[i.id] = 0);
    const tot = list.reduce((x,e)=>x+e.eff,0);
    if(!tot || !amount) return split;
    const cents = Math.round(amount*100);
    let acc = 0;
    list.forEach((e,idx)=>{
      const c = idx===list.length-1 ? cents-acc : Math.round(cents*e.eff/tot);
      acc += c;
      split[e.id] = c/100;
    });
    return split;
  },
  collectScalableTransfers(prevKeys){
    // dopo un import: mette "in attesa" i trasferimenti sul portafoglio Scalable (entrata e uscita) che non erano
    // gia' presenti prima dell'import e non sono mai stati proposti: lo storico gia' caricato resta contabilizzato
    const processedBefore = new Set(this.processedTransfers);
    let n = 0;
    this.transactions.forEach(t=>{
      if(t.manual || !this.isScalableWallet(t.wallet)) return;
      const isIn = t.type==='Incoming Transfer' && t.amount>0;
      const isOut = t.type==='Outgoing Transfer' && t.amount<0;
      if(!isIn && !isOut) return;
      const key = this.txKey(t);
      if(prevKeys.has(key) || processedBefore.has(key)) return;
      this.processedTransfers.push(key);
      this.pendingInvestments.push({ id:uid(), key, date:t.dateStr, amount:t.amount, note:t.note||'', dir: isIn?'in':'out', mode:'ignore' });
      n++;
    });
    if(n){
      this.pendingInvestments.sort((a,b)=> a.date.localeCompare(b.date));
      this.pendingSplit = this.defaultSplit(this.pendNet());
      if(!this.pendingOut) this.pendingOut = {};
    }
    return n;
  },
  esc(v){ return String(v==null?'':v).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); },

  /* ---------------- TENDINA CATEGORIE (mostra tutte le voci, senza scrollbar interna) ---------------- */
  openCatPicker(inputEl, listType){
    this.closeCatPicker();
    const cats = listType==='income' ? this.knownIncomeCategories() : this.knownCategories();
    if(!cats.length) return;
    const dd = document.createElement('div');
    dd.className = 'cat-dropdown';
    const renderItems = (filter)=>{
      const f = (filter||'').trim().toLowerCase();
      const shown = f ? cats.filter(c=>c.toLowerCase().includes(f)) : cats;
      dd.innerHTML = shown.length
        ? shown.map(c=>`<div class="cat-dropdown-item">${this.esc(c)}</div>`).join('')
        : `<div class="cat-dropdown-empty">Nessuna categoria trovata</div>`;
    };
    renderItems('');
    const rect = inputEl.getBoundingClientRect();
    dd.style.left = Math.round(window.scrollX + rect.left)+'px';
    dd.style.top = Math.round(window.scrollY + rect.bottom + 4)+'px';
    dd.style.minWidth = Math.round(rect.width)+'px';
    document.body.appendChild(dd);
    this._catDD = dd;
    this._catDDInput = inputEl;
    dd.addEventListener('mousedown', (e)=>{
      const item = e.target.closest('.cat-dropdown-item');
      if(!item) return;
      e.preventDefault();
      inputEl.value = item.textContent;
      inputEl.dispatchEvent(new Event('change'));
      this.closeCatPicker();
    });
    this._catDDFilter = ()=> renderItems(inputEl.value);
    inputEl.addEventListener('input', this._catDDFilter);
  },
  closeCatPicker(){
    if(this._catDDInput && this._catDDFilter) this._catDDInput.removeEventListener('input', this._catDDFilter);
    if(this._catDD) this._catDD.remove();
    this._catDD = null; this._catDDInput = null; this._catDDFilter = null;
  },
  pendDir(p){ return p.dir || (p.amount<0 ? 'out' : 'in'); },
  pendNet(){ return this.pendIncTotal(); }, // solo le entrate verso Scalable vengono ripartite in automatico
  pendIncTotal(){ return this.pendingInvestments.filter(p=>this.pendDir(p)==='in').reduce((x,p)=>x+p.amount,0); },
  pendOutTotal(){ return this.pendingInvestments.filter(p=>this.pendDir(p)==='out').reduce((x,p)=>x+Math.abs(p.amount),0); },
  ensurePendSplit(){
    if(!this.pendingSplit || typeof this.pendingSplit!=='object') this.pendingSplit = this.defaultSplit(this.pendNet());
    if(!this.pendingOut || typeof this.pendingOut!=='object') this.pendingOut = {};
  },
  pendEtfList(){
    return ASSET_CLASSES.flatMap(c => this.investments.filter(i=>i.assetClass===c));
  },
  pendAssigned(){
    return this.pendEtfList().reduce((x,e)=> x + (Number(this.pendingSplit[e.id])||0), 0);
  },
  pendOutAssigned(){
    return this.pendEtfList().reduce((x,e)=> x + (Number(this.pendingOut[e.id])||0), 0);
  },
  resetPendSplit(){
    this.pendingSplit = this.defaultSplit(this.pendNet());
    this.saveData();
    this.render();
  },
  setPendAmount(invId, value){
    this.ensurePendSplit();
    this.pendingSplit[invId] = Math.round(this.parseNum(value)*100)/100;
    this.saveData();
    this.refreshInvReview();
  },
  setPendOut(invId, value){
    this.ensurePendSplit();
    this.pendingOut[invId] = Math.round(Math.abs(this.parseNum(value))*100)/100; // si inserisce l'importo sottratto come numero positivo
    this.saveData();
    this.refreshInvReview();
  },
  diffBadge(assigned, total){
    const diff = Math.round((assigned-total)*100)/100;
    return Math.abs(diff) < 0.005
      ? '<span class="rb-badge ok">Quadra col totale</span>'
      : `<span class="rb-badge out">Differenza ${diff>0?'+':''}${fmtEUR.format(diff)}</span>`;
  },
  refreshInvReview(){
    this.pendEtfList().forEach(e=>{
      const add = Number(this.pendingSplit[e.id])||0, out = Number(this.pendingOut[e.id])||0;
      const el = document.getElementById('pend-after-'+e.id);
      if(el) el.textContent = fmtEUR.format(e.invested + add - out);
      const mk = document.getElementById('pend-outmark-'+e.id);
      if(mk) mk.textContent = out ? ' −'+fmtEUR.format(out) : '';
    });
    const aEl = document.getElementById('pend-assigned'); if(aEl) aEl.textContent = fmtEUR.format(this.pendAssigned());
    const dEl = document.getElementById('pend-diff'); if(dEl) dEl.innerHTML = this.diffBadge(this.pendAssigned(), this.pendNet());
    const oEl = document.getElementById('pend-out-assigned'); if(oEl) oEl.textContent = fmtEUR.format(this.pendOutAssigned());
    const odEl = document.getElementById('pend-out-diff'); if(odEl) odEl.innerHTML = this.diffBadge(this.pendOutAssigned(), this.pendOutTotal());
  },
  confirmPending(){
    this.ensurePendSplit();
    const msgs = [];
    if(this.pendNet()>0 && Math.abs(this.pendAssigned()-this.pendNet()) >= 0.005) msgs.push(`ripartizione dei versamenti: assegnati ${fmtEUR.format(this.pendAssigned())} su ${fmtEUR.format(this.pendNet())}`);
    if(this.pendOutTotal()>0 && Math.abs(this.pendOutAssigned()-this.pendOutTotal()) >= 0.005) msgs.push(`prelievi: assegnati ${fmtEUR.format(this.pendOutAssigned())} su ${fmtEUR.format(this.pendOutTotal())}`);
    if(msgs.length){
      this.askConfirm(`Le somme non quadrano (${msgs.join('; ')}). Confermare comunque?`, 'Conferma comunque', ()=>this._applyPending());
      return;
    }
    this._applyPending();
  },
  _applyPending(){
    this.pendEtfList().forEach(e=>{
      const delta = (Number(this.pendingSplit[e.id])||0) - (Number(this.pendingOut[e.id])||0);
      if(delta) e.invested = Math.round((e.invested+delta)*100)/100;
    });
    this.pendingInvestments = [];
    this.pendingSplit = null;
    this.pendingOut = null;
    this.saveData();
    this.renderSidebar();
    this.navigate('investments');
    this.showToast('Importi aggiornati negli ETF. Aggiorna ora il valore di ogni ETF e premi "Salva aggiornamento".');
  },
  discardPending(){
    this.askConfirm('Scartare tutti i trasferimenti in attesa? Non verranno applicati agli ETF e non saranno più riproposti.', 'Scarta tutto', ()=>this._doDiscard());
  },
  _doDiscard(){
    this.pendingInvestments = [];
    this.pendingSplit = null;
    this.pendingOut = null;
    this.saveData();
    this.renderSidebar();
    this.navigate('investments');
  },
  renderInvReview(){

    const fmtDate = (ds)=> new Date(ds+'T00:00:00').toLocaleDateString('it-IT',{ day:'2-digit', month:'short', year:'numeric' });
    const listRows = (arr, sign)=> arr.map(p=>`<div class="ydb-row"><span>${fmtDate(p.date)}${p.note?' · '+this.esc(p.note):''}</span><span class="mono">${sign}${fmtEUR.format(Math.abs(p.amount))}</span></div>`).join('');

      </div>

        <div class="card"><div class="stat-label">Prelevati da Scalable</div><div class="stat-value mono ${outTotal?'brick':''}">${outTotal?'−':''}${fmtEUR.format(outTotal)}</div><div class="stat-sub">${outgoing.length ? outgoing.length+(outgoing.length===1?' trasferimento':' trasferimenti')+' in uscita' : 'nessun prelievo rilevato'}</div></div>
        <div class="card"><div class="stat-label">Versamenti da ripartire</div><div class="stat-value mono" style="color:var(--green)">${fmtEUR.format(net)}</div><div class="stat-sub">tra gli ETF, secondo Target tot.</div></div>
      </div>

      ${incoming.length ? `<details class="card" style="margin-top:18px;"><summary style="cursor:pointer; font-size:13.5px; font-weight:600;">Dettaglio dei trasferimenti in entrata <span class="caret">▸</span></summary><div style="margin-top:10px;">${listRows(incoming,'')}</div></details>` : ''}

    const date = localYmd(new Date());

  /* ================= RENDER: DISPATCH ================= */
  render(){
    const snap = this._focusSnap();
    this._renderInner();
    this._focusRestore(snap);
    this.collapseLong();
  },
  _focusSel:'input:not([type=file]):not([type=hidden]),select,textarea,button',
  _focusSnap(){
    const main = document.getElementById('main'), a = document.activeElement;
    if(!main || !a || !main.contains(a) || !a.matches('input,select,textarea')) return null;
    const i = Array.from(main.querySelectorAll(this._focusSel)).indexOf(a);
    if(i<0) return null;
    return { i, tab: (Date.now()-(this._tabAt||0) < 500) ? this._tabDir : 0, y: window.scrollY };
  },
  _focusRestore(s){
    if(!s) return;
    const apply = ()=>{
      const list = Array.from(document.getElementById('main').querySelectorAll(this._focusSel));
      const el = list[Math.max(0, Math.min(list.length-1, s.i + s.tab))];
      if(el && (s.tab || !el.classList.contains('cat-input'))) el.focus({ preventScroll:true }); // niente refocus sui campi categoria: riaprirebbe la tendina
      window.scrollTo(0, s.y);
    };
    if(s.tab) setTimeout(apply, 0); else apply(); // con Tab aspetto che il browser finisca di spostare il focus
  },
  _renderInner(){
    Object.values(this.charts).forEach(c=>{ try{c.destroy();}catch(e){} });
    this.charts = {};
    const main = document.getElementById('main');
    if(!this.transactions.length && this.route.page!=='import' && this.route.page!=='month' && this.route.page!=='investments' && this.route.page!=='yearly' && this.route.page!=='invreview'){
      main.innerHTML = this.emptyStateHTML();
      return;
    }
    if(this.route.page==='home') return this.renderHome();
    if(this.route.page==='month') return this.renderMonth(this.route.month);
    if(this.route.page==='yearly') return this.renderYearly();
    if(this.route.page==='investments') return this.renderInvestments();
    if(this.route.page==='invreview') return this.renderInvReview();
    if(this.route.page==='import') return this.renderImport();
  },

  mountChart(key, canvasId, config){
    const canvas = document.getElementById(canvasId);
    if(!canvas) return;
    const wrap = canvas.closest('.chart-wrap');
    if(typeof Chart === 'undefined'){
      if(wrap) wrap.innerHTML = '<div class="chart-error">Impossibile caricare la libreria dei grafici (Chart.js) da internet. Controlla la connessione e ricarica la pagina; se il problema persiste, apri il file direttamente nel browser invece che in anteprima.</div>';
      console.error('Chart.js non è disponibile: lo script non si è caricato.');
      return;
    }
    try{
      if(this.charts[key]){ try{ this.charts[key].destroy(); }catch(e){} delete this.charts[key]; } // riapertura/re-mount: la canvas va liberata prima
      const ys = config.options && config.options.scales && config.options.scales.y;
      if(ys) ys.afterFit = (sc)=>{ sc.width = Math.max(sc.width, 60); }; // spazio minimo per i numeri, anche se il font non e' ancora caricato
      this.charts[key] = new Chart(canvas, config);
    }catch(err){
      console.error('Errore nella creazione del grafico "'+key+'":', err);
      if(wrap) wrap.innerHTML = '<div class="chart-error">Non è stato possibile disegnare questo grafico. Apri la console del browser (F12) per il dettaglio dell\'errore.</div>';
    }
  },

              <span class="delta ${totalDelta.delta>=0?'pos':'neg'}" title="${totalDelta.pct===null?'Percentuale non disponibile: il saldo a inizio periodo è 0 (saldi di apertura non impostati, o storico troppo corto)':''}">${totalDelta.delta>=0?'▲':'▼'} ${totalDelta.pct===null ? fmtEUR0.format(Math.abs(totalDelta.delta)) : fmtPct(totalDelta.pct)}</span>
              <select class="cat-input" aria-label="Periodo di confronto" style="width:auto; padding:2px 6px; font-size:12px;" onclick="event.stopPropagation()" onchange="App.setTotalPeriod(this.value)">
                <option value="30d" ${this.totalPeriod==='30d'?'selected':''}>30gg</option>
                <option value="90d" ${this.totalPeriod==='90d'?'selected':''}>90gg</option>
                <option value="ytd" ${this.totalPeriod==='ytd'?'selected':''}>Anno</option>
                <option value="all" ${this.totalPeriod==='all'?'selected':''}>Totale</option>
              </select>
              <span class="caret">▸</span>
            </div>
          </summary>
          ${this.totalToggleHTML()}
        </details>
        <details class="card year-detail">
          <summary>
            <div class="stat-label">Entrate · ${currentYear}</div>
            <div class="stat-value mono" style="color:var(--sage)">${yearSum.hasData ? fmtEUR.format(yearSum.totalIncome) : '—'}</div>
            <div class="stat-sub">${yearSum.hasData ? yearSum.incomeCatCount+' categorie' : 'nessun dato per quest\'anno'} ${yearSum.hasData?'<span class="caret">▸</span>':''}</div>
          </summary>
          ${yearSum.hasData ? yearDetailBodySingle(incomeCatList) : ''}
        </details>
        <details class="card year-detail">
          <summary>
            <div class="stat-label">Uscite · ${currentYear}</div>
            <div class="stat-value mono brick">${yearSum.hasData ? fmtEUR.format(yearSum.totalExpense) : '—'}</div>
            <div class="stat-sub">${yearSum.hasData ? yearSum.expenseCatCount+' categorie' : 'nessun dato per quest\'anno'} ${yearSum.hasData?'<span class="caret">▸</span>':''}</div>
          </summary>
          ${yearSum.hasData ? yearDetailBody(expenseCatList, expenseLabelList) : ''}
        </details>
        <div class="card">
          <div class="stat-label">Impegni futuri</div>
          <div class="stat-value mono ${commitments.total?'brick':''}">${commitments.total ? '−'+fmtEUR.format(commitments.total) : fmtEUR.format(0)}</div>
          <div class="stat-sub">${commitments.entries.length ? commitments.entries.length+(commitments.entries.length===1?' mese con pagamenti previsti':' mesi con pagamenti previsti') : 'nessun pagamento previsto'}</div>
        </div>
      </div>

      <div class="section-title"><span>Andamento del patrimonio</span><span class="stat-sub" style="font-weight:500;">· ${periodLbl}</span><span class="rule"></span></div>
      <div class="card">
        ${!series.length ? `<div class="stat-sub" style="padding:6px 2px;">Nessun movimento in questo periodo.</div>` : `<div class="chart-wrap tall"><canvas id="chart-patrimonio" role="img" aria-label="Grafico: andamento del patrimonio nel tempo"></canvas></div>`}
      </div>

      <div class="section-title"><span>Portafogli</span><span class="rule"></span></div>
      ${hasInvest ? `
      <div class="wallet-top-grid">
        <div class="wallet-col-title with-total"><span>Liquidità</span><span class="wct-total">${fmtEUR.format(opTotal + liquidNonOpTotal)}</span></div>
        <div class="wallet-col-title with-total"><span>Investimenti</span><span class="wct-total">${fmtEUR.format(investTotal)}</span></div>
        ${topPairsHTML}
      </div>
      ${(extraLiquidCards || extraInvestedCards) ? `
      <div class="wallet-cols" style="margin-top:18px;">
        <div class="wallet-col">${extraLiquidCards}</div>
        <div class="wallet-col">${extraInvestedCards}</div>
      </div>` : ''}
      ` : `<div class="wallet-col">${virtualCardHTML}${fondoCardHTML}${extraLiquidCards}</div>`}

      <div class="section-title"><span>Composizione del patrimonio</span><span class="stat-sub" style="font-weight:500;">· ${periodLbl}</span><span class="rule"></span></div>
      <div class="card"><div class="chart-wrap"><canvas id="chart-composition" role="img" aria-label="Grafico: composizione del patrimonio per portafoglio"></canvas></div></div>

      <div class="section-title"><span>Impegni futuri</span><span class="rule"></span></div>
      ${proposals.length ? `<div class="planned-warning" style="display:flex; align-items:center; gap:8px 10px; flex-wrap:wrap;">
        <span>⚠ ${proposals.length} ${proposals.length===1?'abbinamento':'abbinamenti'} tra pagamenti previsti e movimenti importati da confermare:</span>
        ${proposalMonths.map(([ym,n])=>`<button class="btn ghost small" onclick="App.navigate('month','${ym}')">${this.monthLabel(ym)} (${n})</button>`).join('')}
      </div>` : ''}
      ${commitments.entries.length ? `
      <details class="card year-detail" style="padding:14px 20px;" ${this.commitmentsOpen?'open':''} ontoggle="App.commitmentsOpen=this.open">
        <summary>
          <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
            <div>
              <div class="stat-label">Totale pagamenti fissi previsti</div>
              <div class="stat-sub">${commitments.entries.length} ${commitments.entries.length===1?'mese con pagamenti':'mesi con pagamenti'} · clicca per la lista <span class="caret">▸</span></div>
            </div>
            <div class="stat-value mono brick" style="margin-top:0; font-size:24px;">${fmtEUR.format(commitments.total)}</div>
          </div>
        </summary>
        <div class="ledger" style="margin-top:12px; padding-top:8px; border-top:1px dashed var(--line-strong);">
          ${commitments.entries.map(e=>`
            <details class="ledger-row">
              <summary>
                <span class="ledger-name">${this.monthLabel(e.ym)}</span>
                <span class="ledger-leader"></span>
                <span class="ledger-amt">${fmtEUR.format(e.total)}</span>
                <span class="caret">▸</span>
              </summary>
              <div class="label-breakdown">
                ${this.monthPlanned(e.ym).filter(p=>!p.paid).map(p=>`
                  <div class="label-chip-row">
                    <span style="flex:1; font-size:13px; font-weight:500;">${this.esc(p.name)}${p.category ? ' · '+this.esc(p.category) : ''}</span>
                    <span class="label-amt mono">${fmtEUR.format(p.amount)}</span>
                  </div>
                `).join('')}
              </div>
            </details>`).join('')}
        </div>
      </details>
      ` : `<div class="card"><div class="stat-sub" style="padding:6px 2px;">Nessun pagamento fisso previsto. Aggiungine uno da una pagina di un mese futuro (li trovi nella sidebar contrassegnati "futuro").</div></div>`}

      <div class="section-title"><span>Liquidità · previsione 12 mesi</span><span class="rule"></span></div>
      <div class="card">
        ${!lf.hasData ? `
          <div class="stat-sub" style="padding:6px 2px;">Serve almeno un mese completo di spese ed entrate registrate per stimare la liquidità futura.</div>
        ` : `
          <div class="grid grid-3" style="align-items:start;">
            <div>
              <div class="stat-label">Liquidità attuale</div>
              <div class="stat-value mono" style="font-size:24px;">${fmtEUR.format(lf.combinedStart)}</div>
              <div class="stat-sub">Operativo + Fondo Emergenza</div>
            </div>
            <div>
              <div class="stat-label">Stimata tra 12 mesi</div>
              <div class="stat-value mono" style="font-size:24px; color:${lf.projectedCombined>=0?'var(--green)':'var(--brick)'}">${fmtEUR.format(lf.projectedCombined)}</div>
              <div class="stat-sub">al netto di entrate/uscite medie e impegni fissi previsti e PAC</div>
            </div>
            <div>
              <div class="stat-label">Variazione stimata</div>
              <div class="stat-value mono" style="font-size:24px;"><span class="delta ${(lf.projectedCombined-lf.combinedStart)>=0?'pos':'neg'}">${(lf.projectedCombined-lf.combinedStart)>=0?'▲':'▼'} ${fmtEUR0.format(Math.abs(lf.projectedCombined-lf.combinedStart))}</span></div>
              <div class="stat-sub">nei prossimi 12 mesi · medie su ${lf.monthsUsed} mesi completati</div>
            </div>
          </div>
          ${this.reliabilityHTML(lf)}
          <details class="year-detail" ${this.liquidityDetailOpen?'open':''} ontoggle="App.liquidityDetailOpen=this.open; if(this.open) App.mountLiquidityChart();" style="margin-top:16px; padding-top:14px; border-top:1px dashed var(--line-strong);">
            <summary style="font-size:13.5px; font-weight:600;">Dettaglio mese per mese <span class="caret">▸</span></summary>
            <div style="margin-top:16px;">
              <div class="stat-sub" style="margin-bottom:10px;">Spesa variabile media: <strong class="mono">${fmtEUR0.format(lf.varExp.avg)}</strong>/mese (al netto degli importi già coperti da pagamenti ricorrenti previsti) · Entrate medie: <strong class="mono">${fmtEUR0.format(lf.avgInc.avg)}</strong>/mese.</div>
              <div class="chart-wrap tall"><canvas id="chart-liquidity" role="img" aria-label="Grafico: previsione della liquidità nei prossimi 12 mesi"></canvas></div>
              <div class="table-scroll" style="margin-top:16px;">
                <table class="inv-table">
                  <thead><tr><th>Mese</th><th class="num">Impegni fissi</th><th class="num">PAC</th><th class="num">Fabbisogno netto</th><th class="num">Residuo Operativo</th><th class="num">Residuo Op.+Fondo</th></tr></thead>
                  <tbody>
                    ${lf.rows.map(r=>`<tr>
                      <td>${this.monthLabel(r.ym)}${r.partial ? ' <span class="stat-sub">· in corso (solo il residuo)</span>' : ''}</td>
                      <td class="num mono">${r.planned ? fmtEUR.format(r.planned) : '—'}</td>
                      <td class="num mono">${r.pac ? fmtEUR.format(r.pac) : '—'}</td>
                      <td class="num mono">${r.need>=0?'':'+'}${fmtEUR.format(Math.abs(r.need))}${r.need>=0?'':' (surplus)'}</td>
                      <td class="num mono" style="color:${r.runOp<0?'var(--brick)':'var(--ink)'};">${fmtEUR.format(r.runOp)}</td>
                      <td class="num mono" style="color:${r.runCombined<0?'var(--brick)':'var(--ink)'};"><strong>${fmtEUR.format(r.runCombined)}</strong></td>
                    </tr>`).join('')}
                  </tbody>
                </table>
              </div>
              <div class="label-note" style="padding-left:2px;">"Fabbisogno netto" = spesa variabile media − entrate medie + impegni fissi previsti di quel mese + PAC (l'importo di INVESTI € nella pagina Investimenti; nel mese in corso si toglie quanto hai già trasferito verso Scalable). Le medie usano solo i mesi completati. Per il mese in corso conta solo il residuo: quanto hai già speso o incassato è già nel saldo attuale, quindi se spendi più (o meno) del previsto la stima si aggiorna al prossimo import. "Residuo" è la liquidità cumulata che resterebbe partendo da oggi. La stima non conta gli investimenti (Scalable, Fondapi): non sono liquidità pronta.</div>
            </div>
          </details>
        `}
      </div>
    `;

    if(series.length) this.mountChart('patrimonio', 'chart-patrimonio', {
      type:'line',
      data:{
        labels: series.map(p=>fmtDateIT(p.dateStr)),
        datasets:[{
          label:'Patrimonio',
          data: series.map(p=>p.total),
          borderColor:'#A97F3F',
          backgroundColor:'rgba(169,127,63,0.12)',
          fill:true, tension:0.25, pointRadius:0, borderWidth:2.5
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{ mode:'index', intersect:false },
        plugins:{ legend:{display:false}, tooltip:{
          intersect:false,
          callbacks:{ label:(c)=> fmtEUR.format(c.parsed.y) }
        }},
        scales:{
          x:{ ticks:{ maxTicksLimit:8, color:'#4A443A', font:{family:'IBM Plex Mono',size:11} }, grid:{ display:false } },
          y:{ ticks:{ color:'#4A443A', font:{family:'IBM Plex Mono',size:11}, callback:(v)=>fmtEUR0.format(v) }, grid:{ color:'rgba(33,29,22,0.08)' } }
        }
      }
    });
    this.mountCompositionChart();
    if(lf.hasData && this.liquidityDetailOpen) this.mountLiquidityChart();
  },

  /* ================= RENDER: MONTH ================= */
  renderMonth(ym){
    const main = document.getElementById('main');
    if(!ym){ main.innerHTML = this.emptyStateHTML(); return; }
    const s = this.monthSummary(ym);
    const allMonthsAsc = this.allMonths();
    const idx = allMonthsAsc.indexOf(ym);
    const prev = idx>0 ? allMonthsAsc[idx-1] : null;
    const next = idx<allMonthsAsc.length-1 ? allMonthsAsc[idx+1] : null;
    const nowYm = todayYm();
    const isFuture = ym > nowYm;
    const isEmpty = !this.monthHasActivity(ym);
    const planned = this.monthPlanned(ym);
    const plannedTotal = this.monthPlannedTotal(ym);
    const plannedPaidTotal = this.monthPlannedPaidTotal(ym);

    const catRow = (cat, type)=>{
      const pct = (type==='expense'? s.totalExpense : s.totalIncome) ? (cat.total/(type==='expense'?s.totalExpense:s.totalIncome)*100) : 0;
      const breakdown = type==='expense' ? this.labelBreakdown(cat.txs) : null;
      return `
        <details class="ledger-row ${type}">
          <summary>
            <span class="ledger-name">${cat.name}</span>
            <span class="ledger-leader"></span>
            <span class="ledger-pct">${pct.toFixed(0)}%</span>
            <span class="ledger-amt">${type==='expense'?'−':''}${fmtEUR.format(cat.total)}</span>
            <span class="caret">▸</span>
          </summary>
          ${type==='expense' ? `<div class="label-breakdown">
            ${breakdown.map(b=>`
              <div class="label-chip-row">
                <span class="label-chip">${b.label}</span>
                <span class="label-bar-track"><span class="label-bar-fill" style="width:${b.pct}%"></span></span>
                <span class="label-amt mono">${fmtEUR.format(b.total)}</span>
              </div>
            `).join('')}
          </div>
          <div class="label-note">Un movimento con più etichette viene conteggiato per intero in ciascuna: le percentuali per etichetta non sommano necessariamente al 100%.</div>` : ''}
          ${this.txListHTML(cat.txs)}
        </details>
      `;
    };

    const walletRows = this.orderedWallets().map(w=>{
      const txs = this.transactions.filter(t=>t.wallet===w && t.ym===ym);
      const net = txs.reduce((s2,t)=>s2+t.amount,0);
      const op = this.isOperational(w);
      return `<div class="wm-row">
        <span class="wm-badge ${op?'op':'nonop'}">${op?'Operativo':'Escluso'}</span>
        <span class="wm-name">${displayWalletName(w)}</span>
        <span class="wm-amt mono ${net>0?'gain-pos':(net<0?'gain-neg':'')}">${txs.length ? (net>=0?'+':'')+fmtEUR.format(net) : '— nessun movimento'}</span>
      </div>`;
    }).join('');

    const paidNote = (p)=> (p.paid && p.paidAmount && Math.abs(p.paidAmount-Math.abs(p.amount))>=0.01)
      ? `<div class="stat-sub" style="text-align:right; margin-top:3px;">importo reale ${fmtEUR.format(p.paidAmount)}</div>` : '';
    const proposalHTML = (p)=> (!p.paid && p.proposal) ? `
      <div style="margin-top:7px; font-size:12px; text-align:right; line-height:1.4;">
        <span style="color:var(--brick); font-weight:600;">Trovato ${fmtEUR.format(p.proposal.amount)}</span> il ${fmtDateIT(p.proposal.dateStr)}
        <div style="display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; margin-top:5px;">
          <button class="btn small" onclick="App.acceptProposal('${ym}','${p.id}',false)">Conferma</button>
          ${p.recurrence ? `<button class="btn ghost small" onclick="App.acceptProposal('${ym}','${p.id}',true)">Conferma e aggiorna importo</button>` : ''}
          <button class="btn ghost small" onclick="App.dismissProposal('${ym}','${p.id}')">Ignora</button>
        </div>
      </div>` : '';
    const plannedRows = planned.length ? planned.map(p=>`
      <tr class="${p.paid?'planned-paid':''}">
        <td><input class="name-input" aria-label="Descrizione pagamento" value="${p.name.replace(/"/g,'&quot;')}" onchange="App.updatePlanned('${ym}','${p.id}','name',this.value)"></td>
        <td><input class="cat-input" aria-label="Categoria" placeholder="categoria" value="${(p.category||'').replace(/"/g,'&quot;')}" onfocus="App.openCatPicker(this,'expense')" onclick="App.openCatPicker(this,'expense')" onchange="App.updatePlanned('${ym}','${p.id}','category',this.value)"></td>
        <td class="num"><input aria-label="Importo" value="${p.amount}" onchange="App.updatePlanned('${ym}','${p.id}','amount',this.value)">
          <label class="rec-toggle" style="justify-content:flex-end; margin-top:4px;" title="Importo indicativo: all'import abbino in automatico un movimento della stessa categoria anche se differisce di poco (tolleranza ${this.PLANNED_APPROX_TOL_PCT}%)"><input type="checkbox" style="width:auto; padding:0; margin:0;" ${p.approx?'checked':''} onchange="App.setPlannedApprox('${ym}','${p.id}', this.checked)"> Circa</label>
        </td>
        <td>
          <label class="rec-toggle"><input type="checkbox" ${p.recurrence==='monthly'?'checked':''} onchange="App.toggleRecurrence('${ym}','${p.id}', this.checked?'monthly':null)"> Mensile</label>
          <label class="rec-toggle"><input type="checkbox" ${p.recurrence==='yearly'?'checked':''} onchange="App.toggleRecurrence('${ym}','${p.id}', this.checked?'yearly':null)"> Annuale</label>
        </td>
        <td class="num">
          <label class="paid-toggle" title="${p.paid?('Segnato pagato'+(p.paidDate?' automaticamente il '+p.paidDate:'')):'Segna come già pagato'}">
            <input type="checkbox" ${p.paid?'checked':''} onchange="App.togglePlannedPaid('${ym}','${p.id}', this.checked)">
            ${p.paid?'Pagato':'Da pagare'}
          </label>
          ${paidNote(p)}${proposalHTML(p)}
        </td>
        <td class="num"><button class="btn danger" onclick="App.removePlanned('${ym}','${p.id}')">Rimuovi</button></td>
      </tr>`).join('') : `<tr><td colspan="6" class="stat-sub" style="padding:12px 10px;">Nessun pagamento fisso previsto per questo mese.</td></tr>`;
    const categoryOptions = this.knownCategories().map(c=>`<option value="${c.replace(/"/g,'&quot;')}"></option>`).join('');
    const incomeCategoryOptions = this.knownIncomeCategories().map(c=>`<option value="${c.replace(/"/g,'&quot;')}"></option>`).join('');

    const canManual = this.canAddManual(ym);
    const manualTx = canManual ? this.monthManualTx(ym) : [];
    const manualRows = manualTx.length ? manualTx.map(t=>`
      <tr>
        <td>
          <select aria-label="Tipo di movimento" onchange="App.updateManualField('${t.id}','type', this.value)">
            <option value="Expense" ${t.type==='Expense'?'selected':''}>Uscita</option>
            <option value="Income" ${t.type==='Income'?'selected':''}>Entrata</option>
          </select>
        </td>
        <td><input class="cat-input" aria-label="Categoria" placeholder="categoria" value="${(t.category?t.category.name:'').replace(/"/g,'&quot;')}" onfocus="App.openCatPicker(this,'${t.type==='Income'?'income':'expense'}')" onclick="App.openCatPicker(this,'${t.type==='Income'?'income':'expense'}')" onchange="App.updateManualCategory('${t.id}', this.value)"></td>
        <td>
          <div style="display:flex; flex-wrap:wrap; gap:3px 10px; max-width:260px;">
            ${LABEL_ORDER.map(l=>`<label class="rec-toggle" style="font-size:12px;"><input type="checkbox" ${t.labels.includes(l)?'checked':''} onchange="App.toggleManualLabel('${t.id}','${l}', this.checked)"> ${l}</label>`).join('')}
          </div>
        </td>
        <td class="num"><input aria-label="Importo" value="${Math.abs(t.amount)}" onchange="App.updateManualField('${t.id}','amount', this.value)"></td>
        <td><input class="name-input" aria-label="Nota" placeholder="nota" value="${(t.note||'').replace(/"/g,'&quot;')}" onchange="App.updateManualField('${t.id}','note', this.value)"></td>
        <td class="num"><button class="btn danger" onclick="App.removeManualTransaction('${t.id}')">Rimuovi</button></td>
      </tr>`).join('') : `<tr><td colspan="6" class="stat-sub" style="padding:12px 10px;">Nessun movimento manuale aggiunto per questo mese.</td></tr>`;

    main.innerHTML = `
      <div class="page-head">
        <div class="eyebrow">Registro mensile ${isFuture?' · pianificazione':''}</div>
        <h1 class="page-title">${this.monthLabel(ym)}</h1>
        ${isEmpty ? `<div class="page-desc"><span class="empty-flag">Nessun movimento registrato in questo mese${isFuture?' (mese futuro)':''}.</span></div>` : ''}
        <div style="margin-top:14px; display:flex; gap:10px;">
          ${prev?`<button class="btn ghost small" onclick="App.navigate('month','${prev}')">‹ ${this.monthLabel(prev)}</button>`:''}
          ${next?`<button class="btn ghost small" onclick="App.navigate('month','${next}')">${this.monthLabel(next)} ›</button>`:''}
        </div>
      </div>

      <div class="grid grid-3">
        <div class="card">
          <div class="stat-label">Entrate</div>
          <div class="stat-value mono" style="color:var(--sage)">${fmtEUR.format(s.totalIncome)}</div>
        </div>
        <div class="card">
          <div class="stat-label">Uscite</div>
          <div class="stat-value mono brick">${fmtEUR.format(s.totalExpense)}</div>
          ${this.investedLine(this.investedIn(ym))}
        </div>
        <div class="card">
          <div class="stat-label">Saldo del mese</div>
          <div class="stat-value mono" style="color:${s.totalIncome-s.totalExpense>=0?'var(--green)':'var(--brick)'}">${fmtEUR.format(s.totalIncome-s.totalExpense)}</div>
          <div class="stat-sub">Tasso di risparmio: <strong class="mono">${this.savingsRate(s.totalIncome, s.totalExpense)}</strong></div>
          <div class="stat-sub">Variazione patrimonio totale (tutti i portafogli, incl. trasferimenti): ${fmtEUR.format(s.netFlow)}</div>
        </div>
      </div>

      <div class="section-title"><span>Portafogli questo mese</span><span class="rule"></span></div>
      <div class="card">
        <div class="wallet-month-grid">${walletRows || '<div class="stat-sub">Nessun portafoglio importato ancora.</div>'}</div>
        <div class="label-note" style="padding:10px 2px 0;">I portafogli "Escluso" (interessi/TFR) non entrano nelle entrate/uscite/categorie qui sotto, ma il loro movimento è comunque incluso nel patrimonio totale in Panoramica.</div>
      </div>

      <div class="section-title"><span>Categorie</span><span class="rule"></span></div>
      <div class="grid grid-2">
        <div class="card">
          <div class="stat-label" style="margin-bottom:10px;">Uscite per categoria</div>
          <div class="ledger">
            ${s.expenseCats.length ? s.expenseCats.map(c=>catRow(c,'expense')).join('') : '<div class="stat-sub" style="padding:10px 2px;">Nessuna uscita registrata questo mese.</div>'}
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:18px; min-width:0;">

        <datalist id="categories-datalist">${categoryOptions}</datalist>

        <datalist id="categories-datalist-expense">${categoryOptions}</datalist>

  /* ---------------- RIEPILOGO ANNUO: grafico + classifica categorie ---------------- */
  compactEUR(v){
    if(!v) return '';
    if(v>=10000) return Math.round(v/1000)+'k';
    if(v>=1000) return (v/1000).toFixed(1).replace('.',',')+'k';
    return String(Math.round(v));
  },
  yearCatTotals(year){
    const mc = this.yearCtx[year].mc;
    return mc.categories.map(c=>({ name:c, total: mc.data[c].reduce((x,v)=>x+v,0) }));
  },
  yearChartSummary(year){
    const { mc, y } = this.yearCtx[year];
    const sel = this.yearSel[year];
    if(!sel) return `Totale uscite ${year}: <strong class="mono">${fmtEUR.format(y.totalExpense)}</strong> · media mensile <strong class="mono">${fmtEUR.format(y.avgExpense)}</strong> · il numero sopra ogni barra è il totale del mese`;
    const cat = y.expenseCats.find(c=>c.name===sel);
    const i = mc.categories.indexOf(sel);
    const st = categoryStyle(sel, i);
    const tot = mc.data[sel].reduce((x,v)=>x+v,0);
    const pct = y.totalExpense ? tot/y.totalExpense*100 : 0;
    return `${st.emoji} <strong>${this.esc(sel)}</strong> · totale <strong class="mono">${fmtEUR.format(tot)}</strong> (${pct.toFixed(0)}% delle uscite) · media mensile <strong class="mono">${fmtEUR.format(cat?cat.avg:0)}</strong> · la linea tratteggiata è la media${this.budgetSummary(year, sel, mc.data[sel])}`;
  },
  yearRankHTML(year){
    const { y } = this.yearCtx[year];
    const sel = this.yearSel[year];
    const list = this.yearCatTotals(year);
    const max = Math.max(...list.map(c=>c.total), 1);
    const grand = list.reduce((x,c)=>x+c.total,0) || 1;
    const avgOf = (name)=>{ const c = y.expenseCats.find(z=>z.name===name); return c ? c.avg : 0; };
    const row = (idx, emoji, name, total, color, barPct, pct, avg)=>`
      <button class="rank-row ${((sel===null||sel===undefined) ? idx===-1 : sel===name) ? 'active' : ''}" aria-pressed="${((sel===null||sel===undefined) ? idx===-1 : sel===name)}" onclick="App.selectYearCat(${year}, ${idx})">
        <span class="rank-name">${emoji} ${this.esc(name)}</span>
        <span class="rank-bar"><span style="width:${barPct}%; background:${color};"></span></span>
        <span class="rank-amt">${fmtEUR0.format(total)}</span>
        <span class="rank-pct">${pct}</span>
        <span class="rank-avg">${avg}</span>
      </button>`;
    return row(-1, '📊', 'Tutte le categorie', grand, '#4A443A', 100, '100%', fmtEUR0.format(y.avgExpense)+'/mese')
      + list.map((c,i)=>{ const st = categoryStyle(c.name, i); return row(i, st.emoji, c.name, c.total, st.color, c.total/max*100, Math.round(c.total/grand*100)+'%', fmtEUR0.format(avgOf(c.name))+'/mese'); }).join('');
  },
  selectYearCat(year, idx){
    const { mc } = this.yearCtx[year];
    const name = idx>=0 ? mc.categories[idx] : null;
    this.yearSel[year] = (name && this.yearSel[year]===name) ? null : name; // secondo click sulla stessa categoria = torna a "tutte"
    const sum = document.getElementById('yc-sum-'+year); if(sum) sum.innerHTML = this.yearChartSummary(year);
    const rank = document.getElementById('rank-'+year); if(rank) rank.innerHTML = this.yearRankHTML(year);
    this.drawYearChart(year);
    const cv = document.getElementById('chart-cat-'+year);
    if(cv) cv.scrollIntoView({ behavior:'smooth', block:'center' });
  },
  avgLabelPlugin: {
    // disegna a canvas, con lo STESSO font, sia il totale sopra ogni mese sia l'etichetta "Media X EUR", appoggiata
    // subito dopo la fine della riga tratteggiata (non piu' lontana nel margine): un unico percorso di disegno
    // evita che i due testi abbiano un font leggermente diverso, come capitava usando anche il plugin datalabels.
    id:'avgLineLabel',
    afterDraw(chart){
      const opt = chart.options.plugins && chart.options.plugins.avgLineLabel;
      if(!opt) return;
      const { ctx, chartArea, scales } = chart;
      const font = opt.font || '600 13px "IBM Plex Mono", monospace';
      ctx.save();
      ctx.font = font;
      ctx.fillStyle = '#211D16';
      if(Array.isArray(opt.monthTotals) && scales.x){
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        opt.monthTotals.forEach((v,i)=>{
          if(!(v>0)) return;
          const x = scales.x.getPixelForValue(i);
          const y = scales.y.getPixelForValue(v) - 8;
          ctx.fillText(App.compactEUR(v), x, y);
        });
      }
      if(opt.value){
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        const lineEndX = scales.x ? scales.x.getPixelForValue(scales.x.ticks.length-1) : chartArea.right;
        ctx.fillText('Media '+fmtEUR0.format(opt.value), lineEndX + 6, scales.y.getPixelForValue(opt.value));
      }
      ctx.restore();
    }
  },
  drawYearChart(year){
    const ctx = this.yearCtx[year]; if(!ctx || !ctx.mc.hasData) return;
    const { mc, y } = ctx;
    const sel = this.yearSel[year] || null;
    const cv = document.getElementById('chart-cat-'+year); if(!cv) return;
    const wrap = cv.closest('.chart-wrap');
    const key = 'cat-'+year;
    if(this.charts[key]){ try{ this.charts[key].destroy(); }catch(e){} delete this.charts[key]; }
    const isNarrow = window.innerWidth <= 860;
    const tickFont = { family:'IBM Plex Mono', size:11 };
    const yScaleBase = { beginAtZero:true, grace:'8%', ticks:{ color:'#211D16', font:tickFont, callback:(v)=>fmtEUR0.format(v) }, grid:{ color:'rgba(33,29,22,0.12)' } };

    if(sel){
      // ---- categoria isolata: un'unica serie mese per mese + linea della media
      if(wrap) wrap.style.height = (isNarrow ? 300 : 360)+'px';
      const st = categoryStyle(sel, mc.categories.indexOf(sel));
      const cat = y.expenseCats.find(c=>c.name===sel);
      const avg = cat ? cat.avg : 0;
      const bud = this.yearBudgetSeries(year, sel), isOver = (i)=> bud[i]!==null && mc.data[sel][i] > bud[i]+0.005;
      this.mountChart(key, 'chart-cat-'+year, {
        type:'bar',
        data:{ labels: MESI_ABBR, datasets:[
          { type:'bar', label:`${st.emoji} ${sel}`, data: mc.data[sel], backgroundColor: st.color, borderColor: mc.data[sel].map((_,i)=> isOver(i) ? '#B3261E' : st.color), borderWidth: mc.data[sel].map((_,i)=> isOver(i) ? 3 : 0), borderRadius:4, categoryPercentage:0.8,
            datalabels:{ display:(c)=> c.dataset.data[c.dataIndex] > 0, anchor:'end', align:'top', clamp:false, color:'#211D16', font:{ family:'IBM Plex Mono', size:11, weight:600 }, formatter:(v)=> this.compactEUR(v) } },
          ...(bud.some(b=>b!==null) ? [{ type:'line', label:'Budget', data:bud, stepped:'middle', borderColor:'#B3261E', borderWidth:2.5, pointRadius:0, fill:false, datalabels:{ display:false } }] : []),
          { type:'line', label:'Media mensile', data: new Array(12).fill(avg), borderColor:'#4A443A', borderDash:[6,4], borderWidth:1.5, pointRadius:0, fill:false,
            datalabels:{ display:false } }
        ]},
        plugins: [App.avgLabelPlugin],
        options:{
          responsive:true, maintainAspectRatio:false, layout:{ padding:{ top:22, right: isNarrow?58:72 } },
          plugins:{
            avgLineLabel:{ value: avg, font:'600 11.5px "IBM Plex Mono", monospace' },
            legend:{ display:false }, tooltip:{ callbacks:{
            title:(items)=> MESI_IT[items[0].dataIndex] + ' ' + year,
            label:(c)=> `${c.dataset.label}: ${fmtEUR.format(c.parsed.y)}` } } },
          scales:{ x:{ ticks:{ color:'#4A443A', font:tickFont }, grid:{ display:false } }, y: yScaleBase }
        }
      });
      return;
    }

    // ---- tutte le categorie: barre per mese con categorie ordinate dalla spesa piu' alta, totale del mese sopra ogni barra
    const floatData = {};
    const monthTotals = new Array(12).fill(0);
    mc.categories.forEach(cat => floatData[cat] = new Array(12).fill(null));
    for(let m=0; m<12; m++){
      const entries = mc.categories.map(cat=>({ cat, value: mc.data[cat][m] })).filter(e=>e.value>0).sort((a,b)=>b.value-a.value);
      let base = 0;
      entries.forEach(e=>{ floatData[e.cat][m] = [base, base+e.value]; base += e.value; });
      monthTotals[m] = base;
    }
    // altezza dinamica: ogni segmento che pesa almeno il 3% del suo mese ha almeno MIN_SEG_PX pixel, cosi l'emoji ci sta
    const MIN_SEG_PX = 13, MIN_PCT = 3;
    const maxTotal = Math.max(...monthTotals);
    let plotNeeded = 0;
    for(let m=0; m<12; m++){
      mc.categories.forEach(cat=>{
        const amt = mc.data[cat][m];
        if(amt>0 && monthTotals[m] && (amt/monthTotals[m]*100) >= MIN_PCT) plotNeeded = Math.max(plotNeeded, MIN_SEG_PX*maxTotal/amt);
      });
    }
    const baseH = isNarrow ? 340 : 420, maxH = isNarrow ? 720 : 860;
    if(wrap) wrap.style.height = Math.min(maxH, Math.max(baseH, Math.ceil(plotNeeded+110)))+'px';

    this.mountChart(key, 'chart-cat-'+year, {
      type:'bar',
      data:{
        labels: MESI_ABBR,
        datasets: [
          ...mc.categories.map((cat,i)=>{
            const st = categoryStyle(cat, i);
            return { type:'bar', label:`${st.emoji} ${cat}`, data: floatData[cat], backgroundColor: st.color, borderColor:'#FBF8F0', borderWidth:1, borderRadius:2, categoryPercentage:0.86, barPercentage:0.95 };
          }),
          // serie "tecnica" invisibile: serve solo a scrivere il totale del mese sopra la barra
          { type:'line', label:'Totale mese', data: monthTotals, showLine:false, pointRadius:0, pointHoverRadius:0, order:-1,
            datalabels:{ display:false } }, // il numero e' disegnato dal plugin avgLineLabel, con lo stesso font di "Media ..."
          { type:'line', label:'Media mensile uscite', data: new Array(12).fill(y.avgExpense), borderColor:'#4A443A', borderDash:[6,4], borderWidth:1.5, pointRadius:0, pointHoverRadius:0, fill:false, order:-1,
            datalabels:{ display:false } } // l'etichetta "Media ..." e' disegnata a parte dal plugin avgLineLabel qui sotto, fuori dall'area delle barre
        ]
      },
      plugins: [App.avgLabelPlugin],
      options:{
        responsive:true, maintainAspectRatio:false, layout:{ padding:{ top:30, right: isNarrow?58:72 } },
        plugins:{
          avgLineLabel:{ value: y.avgExpense, monthTotals, font:'600 13px "IBM Plex Mono", monospace' },
          legend:{ display:true, labels:{ color:'#211D16', font:{family:'Inter',size:12,weight:600}, boxWidth:16,
            filter:(item)=> item.text==='Media mensile uscite' } },
          tooltip:{
            filter:(item)=> Array.isArray(item.raw),
            callbacks:{
              title:(items)=> MESI_IT[items[0].dataIndex] + ' ' + year,
              label:(c)=>{
                const amt = c.raw[1]-c.raw[0];
                const pct = monthTotals[c.dataIndex] ? amt/monthTotals[c.dataIndex]*100 : 0;
                return `${c.dataset.label}: ${fmtEUR.format(amt)} (${pct.toFixed(0)}%)`;
              },
              footer:(items)=>{
                if(!items.length) return '';
                const tot = monthTotals[items[0].dataIndex];
                const diff = tot - y.avgExpense;
                return `Totale mese: ${fmtEUR.format(tot)}\nvs media (${fmtEUR.format(y.avgExpense)}): ${diff>=0?'+':''}${fmtEUR.format(diff)}`;
              },
              footerColor:'#F6EEDA'
            }
          },
          datalabels:{
            display:true, clamp:true,
            color:'#FBF8F0',
            font:{ family:'Inter', size:11, weight:700 },
            textAlign:'center',
            textStrokeColor:'rgba(33,29,22,0.55)',
            textStrokeWidth:2,
            formatter:(value, c)=>{
              if(!Array.isArray(value) || c.dataset.label==='Totale mese' || c.dataset.label==='Media mensile uscite') return '';
              const amt = value[1]-value[0];
              if(amt<=0) return '';
              const yScale = c.chart.scales.y;
              const h = yScale ? Math.abs(yScale.getPixelForValue(value[0]) - yScale.getPixelForValue(value[1])) : 0;
              const pct = monthTotals[c.dataIndex] ? Math.round(amt/monthTotals[c.dataIndex]*100) : 0;
              if(h < 13) return '';
              const emoji = c.dataset.label.split(' ')[0];
              return emoji+' '+pct+'%'; // emoji e percentuale sempre insieme, su un'unica riga
            }
          }
        },
        scales:{ x:{ stacked:true, ticks:{ color:'#4A443A', font:tickFont }, grid:{ display:false } }, y: yScaleBase }
      }
    });
  },

  /* ================= RENDER: YEARLY ================= */
  renderYearly(){
    const main = document.getElementById('main');
    const years = this.getYears();

    if(!years.length){
      main.innerHTML = `
        <div class="page-head">
          <div class="eyebrow">Riepilogo annuo</div>
          <h1 class="page-title">Nessun dato ancora</h1>
        </div>
        <div class="empty-state">
          <div class="display">Il registro è vuoto</div>
          <p>Importa i CSV di Spendee per vedere qui il riepilogo di ogni anno: totali, categorie, etichette e le relative medie mensili.</p>
          <button class="btn" onclick="App.navigate('import')">Carica i tuoi CSV</button>
        </div>
      `;
      return;
    }

    const catRow = (c, showLabels=true)=>`
      <div class="ledger-cat-block">
        <div class="ledger-row ledger-row-static">

          <span class="ledger-leader"></span>

              <span class="label-amt mono">${fmtEUR.format(l.total)}</span>
            </div>
          `).join('')}
        </div>` : ''}
      </div>`;

    const labelRow = (l)=>{
      const txs = (lblTxMap.get(l.label)||[]).slice().sort((a,b)=>b.date-a.date);

      </details>`;
    };

    if(!this.yearlyActiveYear || !years.includes(this.yearlyActiveYear)) this.yearlyActiveYear = years[0];
    const activeYear = this.yearlyActiveYear;

    const curYearStr = String(new Date().getFullYear());
    const tabsHTML = `<div class="year-tabs">${years.map(year=>

        <span class="yt-sub">${year===curYearStr?'in corso':'concluso'}</span>
      </button>`
    ).join('')}</div>`;

    const y = this.yearlyDetailedSummary(activeYear);
    const mc = this.monthlyCategoryBreakdown(activeYear);

    const yearDetailHTML = `
        ${y.isCurrent ? (y.monthsElapsed>0
          ? `<p class="stat-sub" style="margin:-8px 0 16px;">Anno non ancora concluso: le medie mensili sono calcolate sui ${y.monthsElapsed} mesi completati (Gennaio–${MESI_IT[y.monthsElapsed-1]}), escluso il mese in corso.</p>`
          : `<p class="stat-sub" style="margin:-8px 0 16px;">Anno non ancora concluso: nessun mese è stato ancora completato, quindi le medie mensili non sono ancora disponibili.</p>`
        ) : ''}

        <div class="grid grid-3">

            <div class="stat-sub">Media: ${fmtEUR.format(y.avgIncome)}</div>

            <div class="stat-label">Uscite ${activeYear}</div>
