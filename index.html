  refreshInvTotals(){
    const totalInvested = this.investments.reduce((s,i)=>s+i.invested,0);
    const totalValue = this.investments.reduce((s,i)=>s+i.currentValue,0);
    const gain = totalValue-totalInvested;
    const gainPct = totalInvested ? (gain/totalInvested*100) : 0;
    document.getElementById('inv-tot-invested').textContent = fmtEUR.format(totalInvested);
    document.getElementById('inv-tot-value').textContent = fmtEUR.format(totalValue);
    const gEl = document.getElementById('inv-tot-gain');
    gEl.textContent = (gain>=0?'+':'')+fmtEUR.format(gain);
    gEl.className = 'stat-value mono';
    gEl.style.color = gain>=0 ? 'var(--sage)' : 'var(--brick)';
    document.getElementById('inv-tot-gainpct').innerHTML = `<strong style="color:${gain>=0?'var(--sage)':'var(--brick)'};">${fmtPct(gainPct)}</strong>${this.xirrHTML()}`;
    const grossInvested = this.grossInvestedScalable();
    const grossEl = document.getElementById('inv-tot-invested-gross');
    if(grossEl && grossInvested!==null){
      const costsGap = grossInvested-totalInvested;
      grossEl.innerHTML = `Versato lordo (Scalable): <strong class="mono">${fmtEUR.format(grossInvested)}</strong>${Math.abs(costsGap)>=0.005 ? ` · Commissioni/Costi: <strong class="mono" style="color:var(--brick);">${fmtEUR.format(costsGap)}</strong>` : ''}`;
    }
    const aData = this.allocationData();
    this.investments.forEach(inv=>{
      const g = inv.currentValue - inv.invested;
      const gp = inv.invested ? (g/inv.invested*100) : 0;
      const d = this.etfDyn(inv, aData);
      const cls = 'r mono ' + (g>=0?'gain-pos':'gain-neg');
      const gE = document.getElementById('inv-gain-'+inv.id), gpE = document.getElementById('inv-gainpct-'+inv.id), wE = document.getElementById('inv-weight-'+inv.id), gbE = document.getElementById('inv-gainbox-'+inv.id);
      if(gE) gE.textContent = (g>=0?'+':'')+fmtEUR0.format(g);
      if(gpE) gpE.textContent = '('+fmtPct(gp)+')';
      if(gbE) gbE.className = cls;
      if(wE) wE.innerHTML = d.weight;
      const setH = (pre, html)=>{ const el = document.getElementById(pre+inv.id); if(el) el.innerHTML = html; };
      setH('inv-eff-', d.eff); setH('inv-range-', d.range); setH('inv-move-', d.move);
      if(inv.assetClass) setH('inv-status-', d.status); // per gli ETF senza classe la cella contiene il menu di scelta: non si sovrascrive
    });
    ASSET_CLASSES.forEach(c=>{ const el = document.getElementById('inv-sec-info-'+c); if(el) el.innerHTML = this.etfSecInfoHTML(c); });
    const allocEl = document.getElementById('inv-alloc');
    if(allocEl) allocEl.innerHTML = this.allocationHTML();
    const derEl = document.getElementById('inv-alloc-derived');
    if(derEl) derEl.innerHTML = this.allocDerivedHTML();
    const invCalcEl = document.getElementById('inv-invest-calc');
    if(invCalcEl) invCalcEl.innerHTML = this.investCalcHTML();
    const notesEl = document.getElementById('inv-etf-notes');
    if(notesEl) notesEl.innerHTML = this.etfNotesHTML();
    this.collapseLong();
    const cd = this.allocChartData();
    const pie = this.charts.allocPie;
    if(pie){ pie.data.labels = cd.pieLabels; pie.data.datasets[0].data = cd.pieValues; pie.data.datasets[0].backgroundColor = cd.pieColors; pie.update(); }
    const bar = this.charts.allocBar;
    if(bar){ bar.data.datasets[0].data = cd.current; bar.data.datasets[1].data = cd.target; bar.update(); }
  },

    });
    document.getElementById('file-input-backup').addEventListener('change', (e)=>{
      if(e.target.files.length) this.importBackupFile(e.target.files[0]);
      e.target.value = '';
    });
    const replaceInput = document.getElementById('file-input-replace');
    if(replaceInput){
      replaceInput.addEventListener('change', (e)=>{
        const files = Array.from(e.target.files); // copia subito: il modale e' asincrono e l'input viene svuotato dal browser
        e.target.value = '';
        if(!files.length) return;
        this.askConfirm(
          `Verranno azzerati tutti i movimenti importati da CSV in precedenza e sostituiti con quelli dei ${files.length} ${files.length===1?'file selezionato':'file selezionati'}. I movimenti manuali, i pagamenti previsti e i saldi di apertura restano invariati.`,
          'Sostituisci i dati',
          ()=> this.handleFiles(files, 'replace'),
          'Sostituire tutti i dati?'
        );
      });
    }
  },

  setOpeningBalance(wallet, value){
    const v = this.parseNum(value);
    this.openingBalances[wallet] = v;
    this.saveData();
    this.renderImport();
    this.showToast('Saldo di apertura aggiornato.');
  }
};

window.App = App;
document.addEventListener('click', (e)=>{
  const el = e.target.closest && e.target.closest('.cl-text');
  if(!el || String(window.getSelection()).length) return;
  const k = (el.textContent||'').trim().slice(0,60);
  el.classList.toggle('cl-closed');
  if(el.classList.contains('cl-closed')) App._clOpen.delete(k); else App._clOpen.add(k);
});
document.addEventListener('toggle', (e)=>{ if(e.target && e.target.open) App.collapseLong(); }, true);
(function(){ let w = window.innerWidth, t; window.addEventListener('resize', ()=>{ clearTimeout(t); t = setTimeout(()=>{ if(window.innerWidth!==w){ w = window.innerWidth; App.collapseLong(true); } }, 200); }); })();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ App.collapseLong(true); Object.values(App.charts).forEach(c=>{ try{ c.resize(); c.update('none'); }catch(e){} }); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Tab'){ App._tabAt = Date.now(); App._tabDir = e.shiftKey ? -1 : 1; } }, true);

/* Tendina categorie: si chiude cliccando fuori (o esaudendo la selezione) o con Esc. */
document.addEventListener('mousedown', (e)=>{
  if(!App._catDD) return;
  if(e.target===App._catDDInput || App._catDD.contains(e.target)) return;
  App.closeCatPicker();
}, true);
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape' && App._catDD) App.closeCatPicker();
});

/* Campi numerici editabili: se il valore presente e' 0, al click/tap si svuota da solo per scrivere subito il nuovo numero;
   se esci senza scrivere nulla torna lo 0 originale. Vale per tutta la dashboard (delegato sul documento). */
(function(){
  const ZERO_RE = /^\s*[-+]?0+([.,]0+)?\s*$/;
  const isNumericField = (el)=> el && el.tagName==='INPUT' && ['text','number','tel',''].includes((el.getAttribute('type')||'').toLowerCase());
  document.addEventListener('focusin', (e)=>{
    const el = e.target;
    if(!isNumericField(el) || el.readOnly || el.disabled) return;
    if(ZERO_RE.test(el.value)){
      el.dataset.zeroOrig = el.value;
      el.value = '';
    }
  });
  document.addEventListener('focusout', (e)=>{
    const el = e.target;
    if(!el || !el.dataset || el.dataset.zeroOrig === undefined) return;
    if(el.value === '') el.value = el.dataset.zeroOrig; // niente scritto: ripristina lo 0
    delete el.dataset.zeroOrig;
  });
})();
document.addEventListener('DOMContentLoaded', ()=> App.init());
</script>
